document.querySelector('.panel.lvl').onclick=()=>{if(visiting)return;if(examBlocked())openExam();else openProfile();};

setInterval(()=>{tickEnergy(Date.now());recompute();updHUD();updClock();if(!visiting&&!mOpen&&S.tips&&S.tips.seasons&&S.lastSea!==ENV().season)seasonNews(false);if(!visiting){if(!inTk)S.c.maxTour=Math.max(S.c.maxTour||0,D.tourists);updGoalsBtn();}updTkBtn();updInbox();v16Tick();v20Tick();{const hn=$('#hName');if(hn)hn.classList.toggle('bday',bdayToday());}testTick();mjWork();updMomiji();mjNews();updQuest();updSheet();updEvent();updPlate();examTick();if(!visiting&&!planning&&!mOpen&&S.tutOff&&loginDue()&&loginS().shown!==today()){loginS().shown=today();openLogin(true);}if(!$('#drawer').hidden){document.querySelectorAll('.card').forEach(c=>{const d=DEFS[c.dataset.t];c.classList.toggle('poor',S.lvl>=d.lvl&&(S.yen<d.cost||S.goods<gcost(d)||!!(d.candy&&E().candy<d.candy)||!!(d.koban&&S.koban<d.koban)));});}},250);

/* ---------- guided tutorial: a glowing ring and an arrow show where to tap for the first five requests ---------- */
let tutT=null,TUT=null;
const w2s=(wx,wy)=>[(wx-cam.x)*cam.z+W/2,(wy-cam.y)*cam.z+H/2];
const tutOn=()=>!S.tutOff&&S.q<5&&!visiting&&!planning&&!inTk;
function tutBand(){let top=0,bot=H;for(const id of ['#top','#quest','#eventCard']){const e=document.querySelector(id);if(e&&e.offsetParent){const r=e.getBoundingClientRect();if(r.bottom<H*.6)top=Math.max(top,r.bottom);}}
  const d=$('#dock');if(d&&d.offsetParent)bot=Math.min(bot,d.getBoundingClientRect().top);return[top+20,bot-20];}
function tutFree(road){const o=off(),sz=S.size,[t0,t1]=tutBand(),cy=(t0+t1)/2;let best=null,bd=1e9;
  for(let y=o;y<o+sz;y++)for(let x=o;x<o+sz;x++){if(!canPlace('rice',x,y))continue;const nr=[[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>isRoad(x+a,y+b));if(road&&!nr)continue;
    const p=P(x+.5,y+.5,0),q=w2s(p[0],p[1]),out=(q[1]<t0+40||q[1]>t1-20||q[0]<30||q[0]>W-30)?400:0;
    const dd=Math.hypot(q[0]-W/2,q[1]-cy)/40+out+(nr&&!road?2:0);if(dd<bd){bd=dd;best=[x,y];}}
  return best;}
function tutPan(wx,wy){if(ptrs.size)return;const [t0,t1]=tutBand(),q=w2s(wx,wy),cy=(t0+t1)/2;if(q[1]>t0+30&&q[1]<t1-10&&q[0]>40&&q[0]<W-40)return;
  cam.x+=(q[0]-W/2)/cam.z*.12;cam.y+=(q[1]-cy)/cam.z*.12;clampCam();}
function tutStep(){if(!tutOn())return null;const q=QUESTS[S.q];if(!q)return null;if(q[2]()>=q[3])return{el:'#qClaim',txt:'Well done! Claim your reward.'};
  const drawer=!$('#drawer').hidden,bOf=t=>S.b.find(b=>b.type===t);
  const flow=(type,tabName,road,txt)=>{
    if(mode==='build'&&sel===type){if(!tutT||!canPlace(type,tutT[0],tutT[1]))tutT=tutFree(road);return tutT?{tile:tutT,txt:road?'Tap the glowing tile. Shops must touch a road.':'Tap the glowing tile to put your farm there.'}:null;}
    if(mode&&mode!=='build')return{el:'#chipDone',txt:'Tap Done first'};
    if(!drawer)return{el:'#dock button[data-act=build]',txt};
    const tb=document.querySelector('#tabs .tab[data-k="'+(tabName==='Farms'?'farm':'shop')+'"]');
    if(tb&&!tb.classList.contains('on'))return{el:tb,txt:'Open the '+tabName+' tab'};
    return{el:'#cards .card[data-t="'+type+'"]',txt:'Pick the '+DEFS[type].n};};
  if(mode&&S.q!==0&&S.q!==2)return{el:'#chipDone',txt:'Tap Done to stop building'};
  switch(S.q){
   case 0:return flow('rice','Farms',false,'Tap Build to make your first farm');
   case 1:{const b=bOf('rice');if(!b)return null;if(b.st==='empty')return{b,txt:'Tap the field to plant rice'};const p=prog(b,Date.now());return p>=1?{b,txt:'Ready! Tap it to harvest'}:{b,txt:'Growing… ready in '+fmt(DEFS.rice.grow*(1-p)),wait:1};}
   case 2:return flow('dango','Shops',true,'Now open a shop. Tap Build');
   case 3:{const b=bOf('dango');return b?{b,txt:'Tap the stall to stock it with goods'}:null;}
   case 4:{const b=bOf('dango');if(!b)return null;const p=prog(b,Date.now());return b.st!=='open'?{b,txt:'Tap the stall to stock it'}:p>=1?{b,txt:'Tap it to collect your yen!'}:{b,txt:'Tourists are eating… ready in '+fmt(DEFS.dango.time*(1-p)),wait:1};}}
  return null;}
function tutDone(){S.tutOff=true;save();
  modal('<div class="big">'+TANUKI+'</div><h2>You\'re ready, Mayor!</h2><ul><li>Keep following my <b>requests</b> in the corner.</li><li><b>Goals</b> has daily missions, achievements and merchant orders. They pay <b>koban</b>.</li><li><b>Upgrade</b> shows stars and upgrades. Busy buildings grow grander.</li><li>Decor and roads bring <b>tourists</b>, and tourists make shops earn more.</li><li>Tap the <b>goods</b> counter for your pantry.</li></ul>',[{label:'Let\'s go!',cls:'primary'}]);}
function updTut(){const ring=$('#tutRing'),tip=$('#tutTip'),arr=$('#tutArr');
  if(!S.tutOff&&S.q>=5&&!visiting&&!planning&&!mOpen){tutDone();}
  TUT=mOpen?null:tutStep();if(!TUT){ring.hidden=tip.hidden=arr.hidden=true;return;}
  let x,y,r;
  if(TUT.el){const el=typeof TUT.el==='string'?document.querySelector(TUT.el):TUT.el;if(!el||!el.offsetParent){ring.hidden=tip.hidden=arr.hidden=true;return;}const b=el.getBoundingClientRect();
    ring.style.cssText='left:'+(b.left-6)+'px;top:'+(b.top-6)+'px;width:'+(b.width+12)+'px;height:'+(b.height+12)+'px;border-radius:14px';x=b.left+b.width/2;y=b.top;r=b.height/2;ring.hidden=false;}
  else{let wx,wy;if(TUT.tile){const p=P(TUT.tile[0]+.5,TUT.tile[1]+.5,0);wx=p[0];wy=p[1];}else{const d=DEFS[TUT.b.type],p=P(TUT.b.x+d.w/2,TUT.b.y+d.h/2,htOf(TUT.b)*.5);wx=p[0];wy=p[1];}
    tutPan(wx,wy);[x,y]=w2s(wx,wy);r=Math.max(26,40*cam.z);ring.style.cssText='left:'+(x-r)+'px;top:'+(y-r)+'px;width:'+(2*r)+'px;height:'+(2*r)+'px;border-radius:50%';ring.hidden=!!TUT.tile||!!TUT.wait;y-=r;}
  arr.hidden=!!TUT.wait;arr.style.left=(x-14)+'px';arr.style.top=(y-40)+'px';
  $('#tutTxt').textContent=TUT.txt;tip.hidden=false;const tw=tip.offsetWidth,th=tip.offsetHeight;let tx=clamp(x-tw/2,8,W-tw-8),ty=y-48-th;if(ty<70)ty=Math.min(H-th-8,y+2*r+30);tip.style.left=tx+'px';tip.style.top=ty+'px';}
function drawTut(n){if(!TUT||!TUT.tile)return;const [x,y]=TUT.tile,a=.35+.25*Math.sin(n/220);poly([P(x,y),P(x+1,y),P(x+1,y+1),P(x,y+1)],'rgba(255,214,90,'+a.toFixed(2)+')','#f0b429');}
/* ---------- boot ---------- */
resize();rebuild();fitCam();tickEnergy(Date.now());updHUD();updQuest();updEvent();
let last=performance.now();
function frame(t){const dt=Math.min(.1,(t-last)/1000);last=t;updWalkers(dt);updCars(dt);updParticles(dt,ENV());updGhosts(dt,Date.now());updCats(dt);updLeaves(dt);eggSky(dt);draw(Date.now());updTut();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
platformReady.then(plat=>{
let isNew=fresh;
if(CG){
  const o=readCG();cgHadSave=!!o;
  if(o)useTown(o);else{dirty=true;cloudDirty=true;flush();}
  isNew=!o&&fresh;
  try{if(CG.user&&CG.user.addAuthListener)CG.user.addAuthListener(()=>setTimeout(()=>{const n=readCG();if(n&&!visiting){useTown(n);toast('Loaded your saved town.');}},600));}catch(e){}
  try{CG.ad.hasAdblock().then(b=>{if(b)adsOff='Video ads are blocked by an ad blocker, so this option is off.';}).catch(()=>{});}catch(e){}
}
if(innerHeight<560){$('#quest').classList.add('min');$('#qToggle').textContent='+';}
if(isNew&&eventOn())E().seen=true;
if(isNew)modal('<div class="big">'+TANUKI+'</div><h2>Welcome to Komorebi Town</h2><p>I\'m Mayor Kobu. Our sleepy valley wants to become the best holiday spot in Japan. Grow rice, open shops, plant sakura and bring the tourists in!</p><p>Follow my requests in the corner and I\'ll reward you.</p>',[{label:'Let\'s build',cls:'primary'}]);
if(eventOn()&&!E().seen){E().seen=true;save();modal('<div class="big">'+PUMPKIN+'</div><h2>The Halloween Festival is here!</h2><p>For two weeks only, until 11 November. Catch floating ghosts and grow pumpkins to collect candy, then spend it on limited items like the Haunted House and Lantern Ghost.</p>',[{label:'Later'},{label:'See the festival',cls:'primary',fn:()=>openEvent()}]);}
if(!isNew){const ls=lastSeen();if(ls&&Date.now()-ls>=AWAY_MIN)welcomeBack(Date.now()-ls);}
markSeen();seasonNews(isNew);if(S.tkAt&&tkOpen()&&!inTk)tkResume();updClock();if(!isNew&&!visiting)ffNotice();else{S.tips=S.tips||{};S.tips.ff=true;}
if(!mOpen)gp(true);
});
})();
