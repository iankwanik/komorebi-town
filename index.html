<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Komorebi Town</title>
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Yuji+Syuku&display=swap">
<style>
/* Layout: full-screen isometric town canvas; HUD + mayor quest card float top-left, action dock bottom-centre, trays rise above the dock */
:root{
  --ink:#1c2541; --ink-2:#4b5675; --paper:#fbfaf3; --paper-2:#e9efdc; --sky:#cfe5ec;
  --vermilion:#d6432b; --gold:#f0b429; --matcha:#6a9b42;
  --display:'Dela Gothic One','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  --body:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Yu Gothic',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);font-weight:500;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
canvas#sky{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#clockBtn{cursor:pointer;font:inherit;font-weight:800;font-size:13px;color:var(--ink)}
#clockBtn.night{background:#2b3566;color:#fff}
#clockBtn.night small{color:#c9d2f0}
.card .dn{position:absolute;top:10px;right:10px;display:flex;align-items:center;gap:2px;font-size:10px;font-weight:800;border-radius:6px;padding:1px 5px 1px 2px;background:#fff4c2;color:#7a4d00}
.card .dn svg{width:12px;height:12px}
.card .dn.night{background:#2b3566;color:#fff}
.dnbox svg{width:15px;height:15px;vertical-align:-3px}
.tab.seatab{color:var(--sc);background:#fff;box-shadow:inset 0 0 0 2px var(--sc)}
.tab.seatab.on{background:var(--sc);color:#fff}
.panel{background:var(--paper);border:2px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink)}
.btn{border:2px solid var(--ink);background:var(--paper);border-radius:10px;padding:7px 13px;font-weight:800;font-size:13px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
.btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--vermilion);color:#fff}
.btn.danger{background:#fff0ec;color:var(--vermilion)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

#top{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:flex-start;gap:8px;pointer-events:none;z-index:5}
#hud{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%}
#hud>*{pointer-events:auto}
.lvl{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px}
.ttl{display:inline-block;padding:1px 9px;border-radius:999px;line-height:1.4;white-space:nowrap;vertical-align:middle;position:relative;font-weight:800}
.ttl.r1{font-family:'M PLUS Rounded 1c',system-ui,sans-serif;font-size:12px;color:#fff;background:linear-gradient(135deg,#a8642c,#e3a66b 50%,#8c5426);border:1.5px solid #5e3514;text-shadow:0 1px 0 rgba(60,30,0,.5)}
.ttl.r2{font-family:'M PLUS Rounded 1c',system-ui,sans-serif;font-size:12.5px;color:#26303f;background:linear-gradient(110deg,#c3c9d2 25%,#fff 45%,#c3c9d2 65%);background-size:260% 100%;animation:ttlShine 3.2s linear infinite;border:1.5px solid #6f7a8c}
.ttl.r3{font-family:var(--display);font-weight:400;font-size:13px;letter-spacing:.4px;color:#5a3b00;background:linear-gradient(110deg,#e2b53a 25%,#fff4b8 45%,#e2b53a 65%);background-size:260% 100%;animation:ttlShine 2.2s linear infinite;border:1.5px solid #8a6a1a;box-shadow:0 0 9px rgba(240,180,41,.6);text-shadow:0 1px 0 rgba(255,255,255,.6)}
.ttl.r4{font-family:'Yuji Syuku','Dela Gothic One',serif;font-weight:400;font-size:14.5px;letter-spacing:.6px;color:#fff;background:linear-gradient(90deg,#ff5f6d,#ffc371,#7ee08a,#5fb7ff,#b388ff,#ff5f6d);background-size:300% 100%;animation:ttlRain 4s linear infinite;border:1.5px solid #1c2541;box-shadow:0 0 12px rgba(179,136,255,.7);text-shadow:0 1px 2px rgba(28,37,65,.75)}
.ttl.r4::before,.ttl.r4::after{content:'✦';position:absolute;color:#fff6c4;font-size:11px;text-shadow:0 0 5px #ffd27a;animation:ttlTw 1.6s ease-in-out infinite}
.ttl.r4::before{left:-5px;top:-7px}.ttl.r4::after{right:-5px;bottom:-6px;animation-delay:.8s}
.ttl.big{font-size:22px;padding:5px 18px}.ttl.r4.big{font-size:26px}
.rlab{display:block;font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-top:8px}.rlab.r1{color:#a0623a}.rlab.r2{color:#6f7a8c}.rlab.r3{color:#b8860b}.rlab.r4{color:#7a4fb0}
@keyframes ttlShine{from{background-position:130% 0}to{background-position:-130% 0}}
@keyframes ttlRain{from{background-position:0 0}to{background-position:300% 0}}
@keyframes ttlTw{0%,100%{opacity:.15;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(25deg)}}
.reveal{position:relative;height:130px;display:grid;place-items:center;overflow:hidden;margin:-4px -6px 6px;border-radius:14px;background:radial-gradient(circle,#fff8dc 0,#f6e9c4 60%,#efe0b8 100%)}
.reveal .rays{position:absolute;inset:-60%;background:repeating-conic-gradient(rgba(255,214,120,.55) 0 10deg,transparent 10deg 20deg);animation:rays 12s linear infinite}
.reveal .ttl{animation:ttlPop .7s cubic-bezier(.2,1.6,.4,1) both,ttlShine 2.2s linear infinite}.reveal .ttl.r4{animation:ttlPop .7s cubic-bezier(.2,1.6,.4,1) both,ttlRain 4s linear infinite}.reveal .ttl.r1{animation:ttlPop .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes rays{to{transform:rotate(360deg)}}
@keyframes ttlPop{from{transform:scale(.2) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
#fuku{display:block;margin:0 auto;max-width:100%}
.dbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.dbtns .btn{display:flex;flex-direction:column;align-items:center;line-height:1.15}.dbtns .btn small{font-size:10.5px;opacity:.9;font-weight:700}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin-top:8px;max-height:46vh;overflow:auto}
.dres{border:2px solid #d9d2c0;border-radius:12px;padding:4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;background:#fff;font-size:12px}
.dres canvas{width:100px;height:82px}.dres small{font-size:10.5px;color:var(--ink-2)}.dres small.new{color:#4f7f2e;font-weight:800}.dres small.dup{color:#a87407}
.dres.re{border-color:#7a4fb0;box-shadow:0 0 10px rgba(122,79,176,.5)}.dres.rl{border-color:#e2b53a;background:linear-gradient(160deg,#fff8dc,#ffe9a8);box-shadow:0 0 16px rgba(240,180,41,.9);animation:ttlPop .7s cubic-bezier(.2,1.6,.4,1) both}.dres.rr{border-color:#2f6db0}
.rtag{display:inline-block;color:#fff;font-size:10px;font-weight:800;padding:0 7px;border-radius:999px;letter-spacing:.5px}
.chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}.schip{font-size:10px;font-weight:800;border:1.5px solid var(--rc);color:#b0b6c2;border-radius:999px;padding:0 6px}.schip.own{background:var(--rc);color:#fff}
.skinl .rk{width:64px}.board.skinl li{grid-template-columns:64px minmax(0,1fr) auto}.mock{display:grid;place-items:center}.mock canvas{width:180px;height:150px}
.tsel{background:none;border:2px solid transparent;border-radius:999px;padding:2px;margin:3px 1px;cursor:pointer}.tsel.on{border-color:var(--ink)}
#plate{margin-top:3px;cursor:pointer;max-width:170px}#plate:empty{display:none}#plate .ttl{font-size:10.5px;padding:0 7px}#plate .ttl.r4{font-size:12px}
.ord .who .nm small{color:var(--ink-2);font-weight:700}.ord .need{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:3px}.ord .need span{display:inline-flex;align-items:center;gap:2px;font-weight:800;font-size:12px}.ord .need span.no{color:#c8402e}.ord .need svg{width:16px;height:16px}
.ord li.bigo{background:#fff6dc}
@media (prefers-reduced-motion:reduce){.ttl,.ttl::before,.ttl::after,.reveal .rays,.reveal .ttl{animation:none!important}}
.lvl-num{width:34px;height:34px;border-radius:50%;background:var(--vermilion);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:15px;border:2px solid var(--ink)}
.xpbar{width:78px;height:8px;border-radius:6px;background:var(--paper-2);border:1.5px solid var(--ink);overflow:hidden}
.xpfill{height:100%;background:var(--matcha);width:0;transition:width .3s}
.xptxt{font-size:10.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-top:2px;font-weight:700}
.stat{display:flex;align-items:center;gap:5px;padding:5px 10px 5px 6px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat svg{width:22px;height:22px;flex:none}
#gCap.full{color:#c8402e}
#mayorIcon.wiggle{animation:kWig .35s}
#mayorIcon.dance{animation:kDance .5s ease-in-out 8}
@keyframes kWig{30%{transform:rotate(-8deg)}70%{transform:rotate(8deg)}}
@keyframes kDance{0%{transform:translateY(0) rotate(0)}25%{transform:translateY(-6px) rotate(-12deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-6px) rotate(12deg)}}
.moonbun{position:fixed;z-index:6;font-size:26px;pointer-events:none;animation:mbHop 1s ease-in-out infinite}
@keyframes mbHop{50%{transform:translateY(-6px)}}
.big.secret{font-size:46px}
.board.secrets li.locked .nm{color:var(--ink-2)}
#hName.bday::after{content:' 🎂'}
.garage{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:6px 0 10px}
.garc{background:#fff;border:2px solid var(--paper-2);border-radius:12px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px}
.garc canvas{width:150px;height:90px}
.gst{color:#5c6b7a}
.garrow{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.gsw{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);padding:0;cursor:pointer}
.gsw.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--vermilion)}
.bdsel{display:flex;gap:8px;justify-content:center;margin:8px 0}.bdsel select{font:inherit;padding:6px;border-radius:8px;border:2px solid var(--ink)}

#testBanner{position:fixed;bottom:96px;left:10px;z-index:40;background:repeating-linear-gradient(135deg,#f0c33c 0 12px,#1c2541 12px 24px);color:#fff;font:900 12px/1 'M PLUS Rounded 1c',system-ui,sans-serif;padding:7px 12px;border-radius:10px;cursor:pointer;text-shadow:0 1px 2px #000;letter-spacing:.5px;border:2px solid #1c2541}
#testBanner[hidden]{display:none}
.admin h3{font-size:13px;margin:12px 0 4px;text-align:left}
.admin .adgrid{display:flex;flex-wrap:wrap;gap:6px}

#mjCard{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 8px;pointer-events:auto;background:#5a2412;color:#fbeedd;max-width:300px;box-sizing:border-box}
#mjCard[hidden]{display:none}
#mjCard #mjIcon svg{width:36px;height:36px;display:block}
#mjCard .qlabel{color:#f6b88a}
#mjCard .evline{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
#mjCard .btn{margin-left:auto;padding:5px 11px;color:var(--ink);background:#f6a77a}
.evnote.mjnote{background:#5a2412}
ul.awl{text-align:left;margin:6px 0;padding-left:20px;font-size:13px}ul.awl li::marker{content:'✓  ';color:#4f7f2e}
.ttl.r7{font-family:'Yuji Syuku','Dela Gothic One',serif;font-weight:400;font-size:14px;color:#fff;background:linear-gradient(90deg,#7a1f0f,#e2513b,#f0a03c,#e2513b,#7a1f0f);background-size:250% 100%;border:1.5px solid #1c2541;box-shadow:0 0 10px rgba(226,81,59,.7);text-shadow:0 1px 2px #1c2541;animation:ttlPop .7s cubic-bezier(.2,1.6,.4,1) both,ttlRain 4s linear infinite}
.ttl.r7::before{content:'🍁';position:absolute;left:-9px;top:-9px;font-size:12px}
.ttl.r7.big{font-size:24px;padding:5px 20px}
.rlab.r7{background:#7a1f0f;color:#ffd27a}

/* v16: profile icon in the HUD */
.lvl .avw{position:relative;width:38px;height:38px;flex:0 0 38px}
.lvl .avw .av{width:38px;height:38px;font-size:21px}
.lvl .avw .lvl-num{position:absolute;right:-6px;bottom:-5px;width:19px;height:19px;font-size:10px;border-width:1.5px}
#hName{font-size:11.5px;font-weight:800;max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2;margin-bottom:2px}
#hName:not(.notr){color:var(--ink-2);font-weight:700;font-size:10px}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-size:17px;line-height:1;border:2px solid var(--ink);box-sizing:border-box;vertical-align:middle;flex:none;position:relative}
.av.sm{width:22px;height:22px;font-size:12px;border-width:1.5px;margin-right:5px}
.av.lg{width:64px;height:64px;font-size:36px;border-width:3px}
.av.fr-wood{border-color:#8a5a2b;box-shadow:0 0 0 2px #c8963a,0 0 0 3.5px #6b4220}
.av.fr-silver{border-color:#6f7a8c;box-shadow:0 0 0 2px #dfe4ea,0 0 0 3.5px #8d97a6}
.av.fr-sakura{border-color:#e07a98;box-shadow:0 0 0 2px #ffd3e0,0 0 0 3.5px #e07a98}
.av.fr-sakura::after{content:'🌸';position:absolute;right:-7px;top:-7px;font-size:11px}
.av.fr-gold{border-color:#8a6a1a;box-shadow:0 0 0 2px #f0c33c,0 0 0 3.5px #8a6a1a,0 0 8px rgba(240,195,60,.8)}
.av.fr-neon{border-color:#ff5fa8;box-shadow:0 0 0 2px #1c2541,0 0 0 3.5px #5fe8ff,0 0 10px #5fe8ff;animation:avNeon 1.6s ease-in-out infinite}
.av.fr-ice{border-color:#5f9fd0;box-shadow:0 0 0 2px #e6f6ff,0 0 0 3.5px #7fc4e0,0 0 8px rgba(160,215,255,.9)}
.av.fr-ice::after{content:'❄';position:absolute;right:-6px;top:-8px;font-size:11px;color:#5f9fd0}
.av.fr-flame{border-color:#c8402e;box-shadow:0 0 0 2px #ffb04a,0 0 0 3.5px #e2513b,0 0 10px rgba(255,120,40,.9);animation:avFlame 1.1s ease-in-out infinite}
.av.fr-ghost{border-color:#5b4fb0;box-shadow:0 0 0 2px #2a1f4f,0 0 0 3.5px #b9a8ff,0 0 12px #8f7cff;animation:avGhost 2.4s ease-in-out infinite}
.av.fr-ghost::after{content:'👻';position:absolute;right:-8px;top:-9px;font-size:12px;animation:avFloat 2.4s ease-in-out infinite}
.av.fr-shogun{border-color:#1c2541;box-shadow:0 0 0 2px #c8402e,0 0 0 4px #f0c33c,0 0 0 5.5px #1c2541,0 0 14px rgba(240,195,60,.9)}
.av.fr-shogun::after{content:'⚜';position:absolute;left:50%;top:-12px;transform:translateX(-50%);font-size:12px;color:#c8963a;text-shadow:0 0 4px #fff}
@keyframes avNeon{50%{box-shadow:0 0 0 2px #1c2541,0 0 0 3.5px #ff5fa8,0 0 14px #ff5fa8}}
@keyframes avFlame{50%{box-shadow:0 0 0 2px #ffd36a,0 0 0 3.5px #ff7a2a,0 0 16px rgba(255,90,30,.95)}}
@keyframes avGhost{50%{box-shadow:0 0 0 2px #2a1f4f,0 0 0 3.5px #e4dcff,0 0 18px #b9a8ff}}
@keyframes avFloat{50%{transform:translateY(-3px)}}
/* banners */
.pfhead{display:flex;align-items:center;gap:14px;padding:14px;border-radius:12px;border:2px solid var(--ink);margin:0 0 10px;text-align:left;background:#fff;min-height:64px}
.pfinfo{min-width:0}.pfname{font-family:var(--display);font-size:18px;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.pfsub{font-size:12px;color:var(--ink-2);margin-top:4px;font-weight:700}
.bn-washi{--bn:#f6efe0 radial-gradient(rgba(160,120,70,.12) 1px,transparent 1.5px) 0 0/9px 9px;background:var(--bn)}
.bn-waves{--bn:radial-gradient(circle at 50% 100%,transparent 6px,#7fb3d8 7px,#7fb3d8 9px,transparent 10px,transparent 13px,#7fb3d8 14px,#7fb3d8 16px,transparent 17px) 0 0/34px 17px,#dcecf8;background:var(--bn)}
.bn-sakura{--bn:radial-gradient(#f7a8c0 2px,transparent 2.5px) 0 0/16px 16px,radial-gradient(#fbd3e0 2px,transparent 2.5px) 8px 8px/16px 16px,#fff1f5;background:var(--bn)}
.bn-night{--bn:radial-gradient(#fff 1px,transparent 1.5px) 0 0/22px 22px,radial-gradient(#ffe9a8 1px,transparent 1.5px) 11px 7px/26px 26px,linear-gradient(135deg,#1c2541,#3b4f8a);background:var(--bn);color:#fff}
.bn-night .pfsub,.bn-shogun .pfsub,.bn-ghost .pfsub{color:#dfe4f4}
.bn-gold{--bn:linear-gradient(110deg,#e2b53a 20%,#fff4b8 40%,#e2b53a 60%,#c8963a);background:var(--bn);background-size:250% 100%;animation:ttlShine 4s linear infinite}
.bn-ghost{--bn:radial-gradient(rgba(185,168,255,.5) 2px,transparent 3px) 0 0/24px 24px,linear-gradient(135deg,#1a1236,#4a2f7a 60%,#d06a1a);background:var(--bn);color:#fff}
.bn-shogun{--bn:repeating-linear-gradient(90deg,transparent 0 22px,rgba(240,195,60,.35) 22px 24px),linear-gradient(135deg,#7a1f1f,#c8402e 50%,#1c2541);background:var(--bn);color:#fff;box-shadow:inset 0 0 0 2px #f0c33c}
.bn-fuji{--bn:linear-gradient(160deg,transparent 60%,#fff 60.5%,#fff 64%,transparent 64.5%) right 20px bottom 0/90px 60px no-repeat,linear-gradient(200deg,transparent 60%,#fff 60.5%,#fff 64%,transparent 64.5%) right -16px bottom 0/90px 60px no-repeat,linear-gradient(#bfe0f6,#fbe3d4);background:var(--bn)}
.bn-lantern{--bn:radial-gradient(circle,#e2513b 5px,#ffb04a 6px,transparent 7px) 0 6px/28px 28px,linear-gradient(#2a2348,#4a3a6a);background:var(--bn);color:#fff}
.bn-lantern .pfsub,.bn-night .pfname,.bn-lantern .pfname{color:#fff}
.bnsw{display:block;width:100%;height:30px;border-radius:7px;border:1.5px solid var(--ink)}
.bnsw.bn-none{background:#fff}
.board li.bnr:not(.bn-none){background:var(--bn)!important}
.board li.bnr.bn-washi,.board li.bnr.bn-waves,.board li.bnr.bn-sakura,.board li.bnr.bn-gold,.board li.bnr.bn-fuji{background-size:auto}
.board li.bnr.bn-night,.board li.bnr.bn-ghost,.board li.bnr.bn-shogun,.board li.bnr.bn-lantern{color:#fff}
.board li.bnr.bn-night .tw,.board li.bnr.bn-ghost .tw,.board li.bnr.bn-shogun .tw,.board li.bnr.bn-lantern .tw,.board li.bnr.bn-night .val small,.board li.bnr.bn-ghost .val small,.board li.bnr.bn-shogun .val small,.board li.bnr.bn-lantern .val small{color:#e4e8f4}
/* wallpapers for windows */
.wpsw{display:block;width:100%;height:30px;border-radius:7px;border:1.5px solid var(--ink);background:var(--paper)}
body[data-wp=sakura] .mcard,.wpsw.wp-sakura{background:radial-gradient(rgba(247,168,192,.45) 2px,transparent 2.5px) 0 0/22px 22px,radial-gradient(rgba(251,211,224,.6) 2px,transparent 2.5px) 11px 11px/22px 22px,#fff8fa}
body[data-wp=waves] .mcard,.wpsw.wp-waves{background:radial-gradient(circle at 50% 100%,transparent 6px,rgba(127,179,216,.28) 7px,rgba(127,179,216,.28) 9px,transparent 10px,transparent 13px,rgba(127,179,216,.28) 14px,rgba(127,179,216,.28) 16px,transparent 17px) 0 0/34px 17px,#f4f9fd}

function mkFeed(db, f) {
  return {
    post: async e => { await f.addDoc(f.collection(db, "draws"), { name: String(e.name || "A mayor").slice(0, 20), skin: String(e.skin).slice(0, 40), r: e.r === "l" ? "l" : "e", at: f.serverTimestamp() }); },
    load: async n => { const q = await f.getDocs(f.query(f.collection(db, "draws"), f.orderBy("at", "desc"), f.limit(n || 20))); return q.docs.map(d => { const x = d.data(); return { name: x.name, skin: x.skin, r: x.r, at: x.at && x.at.toMillis ? x.at.toMillis() : 0 }; }); }
  };
}
const PLATFORM = await (window.__platformReady || Promise.resolve("web"));
if (PLATFORM === "crazygames") {
  console.info("Komorebi Town: running on CrazyGames, so CrazyGames handles accounts and saves.");
  try {
    const V = "10.12.2";
    const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const fsm = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
    window.feed = mkFeed(fsm.getFirestore(initializeApp(firebaseConfig)), fsm);
  } catch (e) { console.info("Recent draws are offline:", e && e.message); }
} else if (firebaseConfig.apiKey.startsWith("PASTE")) {
  console.info("Komorebi Town: Firebase config not set, so the game saves on this device only.");
} else {
  const V = "10.12.2";
  const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, signOut, onAuthStateChanged } =
    await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const { getFirestore, doc, getDoc, setDoc, serverTimestamp, collection, query, orderBy, limit, getDocs, where, addDoc, deleteDoc } =
    await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();
  window.feed = mkFeed(db, { addDoc, collection, serverTimestamp, getDocs, query, orderBy, limit });

  window.cloud = {
    async signIn() {
      try { await signInWithPopup(auth, provider); }
      catch (e) {
        if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") await signInWithRedirect(auth, provider);
        else if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") throw e;
      }
    },
    signOut: () => signOut(auth),
    onUser: cb => onAuthStateChanged(auth, u => cb(u ? { uid: u.uid, name: u.displayName || u.email || "Player", email: u.email || "" } : null)),
    async load() {
      const snap = await getDoc(doc(db, "saves", auth.currentUser.uid));
      return snap.exists() ? JSON.parse(snap.data().data) : null;
    },
    async save(state) {
      await setDoc(doc(db, "saves", auth.currentUser.uid), {
        data: JSON.stringify(state),
        savedAt: state.savedAt || Date.now(),
        level: state.lvl,
        updated: serverTimestamp()
      });
    }
  };
  window.cloud.uid = () => (auth.currentUser ? auth.currentUser.uid : null);
  window.cloud.saveBoard = async entry => {
    await setDoc(doc(db, "leaderboard", auth.currentUser.uid), { ...entry, updated: serverTimestamp() }, { merge: true });
  };
  window.cloud.loadBoard = async field => {
    const snap = await getDocs(query(collection(db, "leaderboard"), orderBy(field, "desc"), limit(50)));
    return snap.docs.map(d => ({ uid: d.id, ...d.data() }));
  };
  window.cloud.loadSave = async uid => {
    const snap = await getDoc(doc(db, "saves", uid));
    return snap.exists() ? JSON.parse(snap.data().data) : null;
  };
  window.cloud.getBoard = async uid => {
    const snap = await getDoc(doc(db, "leaderboard", uid));
    return snap.exists() ? { uid, ...snap.data() } : null;
  };
  window.cloud.findByCode = async code => {
    const q = await getDocs(query(collection(db, "leaderboard"), where("code", "==", code), limit(1)));
    return q.empty ? null : { uid: q.docs[0].id, ...q.docs[0].data() };
  };
  window.cloud.sendHelp = async (to, data) => {
    await addDoc(collection(db, "inbox", to, "items"), { ...data, from: auth.currentUser.uid, at: serverTimestamp() });
  };
  window.cloud.readInbox = async () => {
    const q = await getDocs(collection(db, "inbox", auth.currentUser.uid, "items"));
    return q.docs.map(d => ({ id: d.id, ...d.data() }));
  };
  window.cloud.deleteInbox = async id => {
    await deleteDoc(doc(db, "inbox", auth.currentUser.uid, "items", id));
  };
  window.dispatchEvent(new Event("cloud-ready"));
}
</script>

/* compare a plan with the real town */
function planDiff(p){const byId=new Map(S.b.map(b=>[b.id,b])),keep=new Set(),moves=[],miss=[],st=(S.store||[]).slice(),fromStore=[],buy=[];
  for(const o of p.b){const b=byId.get(o.id);if(b&&b.type===o.type){moves.push([b,o]);keep.add(b.id);}else miss.push(o);}
  for(const o of miss){let k=st.findIndex(s=>s.id===o.id&&s.type===o.type);if(k<0)k=st.findIndex(s=>s.type===o.type);if(k>=0)fromStore.push([st.splice(k,1)[0],o]);else buy.push(o);}
  const toStore=S.b.filter(b=>!keep.has(b.id));let road=0,tiles=0;
  for(let k=0;k<MAP*MAP;k++){const r=p.roads[k];if(r&&r!==S.roads[k]){road+=RT_DEF(r).cost;tiles++;}}
  const canBuy=o=>{const d=DEFS[o.type];return d.cost>0&&!gcost(d)&&!d.kura&&!d.koban&&!d.candy&&!d.ev&&!d.season&&!d.uniq&&S.lvl>=d.lvl;},bought=buy.filter(canBuy);
  return{moves,fromStore,buy,bought,buyCost:bought.reduce((a,o)=>a+DEFS[o.type].cost,0),toStore,road,tiles,stLeft:st};}
function askApply(i){const p=plansOf()[i];if(!p)return;const df=planDiff(p),mv=df.moves.filter(([b,o])=>b.x!==o.x||b.y!==o.y).length;
  const li=[mv+' building'+(mv===1?'':'s')+' move'];if(df.toStore.length)li.push(df.toStore.length+' go to Storage (they keep their level and stars)');if(df.fromStore.length)li.push(df.fromStore.length+' come back from Storage');
  if(df.tiles)li.push(df.tiles+' new road tiles: ¥'+num(df.road));if(df.buy.length)li.push(df.buy.length+' missing: '+[...new Set(df.buy.map(o=>DEFS[o.type].n))].join(', '));
  let res=0,staff=0;const after=df.moves.map(m=>m[0]).concat(df.fromStore.map(m=>({type:m[0].type,lv:m[0].lv})));for(const b of after){const d=DEFS[b.type];if(d.res)res+=resOf(b);if(d.staff)staff+=d.staff;}
  if(staff>res)li.push('<b>Warning:</b> your shops need '+staff+' staff but homes give only '+res+'. You cannot build new shops until you add homes.');
  const btns=[{label:'Cancel'}],ok=S.yen>=df.road;
  btns.push({label:ok?'Apply'+(df.road?' · ¥'+num(df.road):''):'Need ¥'+num(df.road),cls:'primary',fn:()=>{if(!ok){toast('You need ¥'+num(df.road-S.yen)+' more for the new roads.');return true;}doApply(p,false);}});
  if(df.bought.length&&S.yen>=df.road+df.buyCost)btns.push({label:'Apply + build '+df.bought.length+' missing · ¥'+num(df.road+df.buyCost),fn:()=>doApply(p,true)});
  modal('<h2>Apply '+esc(p.n)+'?</h2><ul>'+li.map(x=>'<li>'+x+'</li>').join('')+'</ul><p><small>Shops keep their stock and timers. Nothing is sold.</small></p>',btns);}
function doApply(p,buy){const df=planDiff(p),cost=df.road+(buy?df.buyCost:0);if(S.yen<cost){toast('You need ¥'+num(cost-S.yen)+' more.');return;}
  S.store=df.stLeft;for(const b of df.toStore)if(!DEFS[b.type].uniq)S.store.push(Object.assign({id:b.id,type:b.type,lv:b.lv||1,cnt:b.cnt||0},b.bu?{bu:b.bu,bs:b.bs}:{},b.up?{up:b.up}:{}));
  const keep=new Set(df.moves.map(m=>m[0].id));S.b=S.b.filter(b=>keep.has(b.id));
  for(const [b,o] of df.moves){b.x=o.x;b.y=o.y;}
  for(const [r,o] of df.fromStore)S.b.push(unstore(r,o.x,o.y));
  if(buy)for(const o of df.bought){const b={id:S.nid++,type:o.type,x:o.x,y:o.y};initB(b);S.b.push(b);S.c.built[o.type]=(S.c.built[o.type]||0)+1;}

  rewardFx('Your town now matches '+p.n+'!');}

function gp(on){if(!CG||gpOn===on)return;gpOn=on;try{on?CG.game.gameplayStart():CG.game.gameplayStop();}catch(e){}}
function adState(){if(!S.ads||S.ads.d!==today())S.ads={d:today(),n:0,last:0};return S.ads;}
const EBUY_MAX=3,EBUY_STEP=[4,6,9];
function avgCollect(){let s=0,c=0;for(const b of S.b){const d=DEFS[b.type];if(d.cat==='shop'&&nearRoad(b)){s+=baseEarn(b);c++;}}return c?s/c:30*S.lvl;}

/* ---------- Tip Box: tourists drop tips over time. A full box holds about 20 minutes of active income, gives no XP and stops filling when full ---------- */
const TIP_H=[8,12,16];
const tipCapH=()=>TIP_H[Math.min(2,(S.perk&&S.perk.tip)|0)];
/* about ¥150 per full box at Lv 1, ¥1,000 at Lv 5 and ¥6,000 at Lv 17; more tourists help, with diminishing returns */
function tipRate(){return 15*S.lvl*(1+Math.sqrt(Math.max(0,D.tourists))/25);}
function tipFull(){return Math.max(50,Math.round(tipRate()*tipCapH()));}
function tipFill(){const span=tipCapH()*3600e3;return clamp((Date.now()-(S.tipT||Date.now()))/span,0,1);}
function tipAmount(){return Math.floor(tipFill()*tipFull());}
function collectTips(){if(visiting)return 0;const a=tipAmount();if(a<1){toast('The Tip Box is empty. Tourists fill it over time.');return 0;}
  S.yen+=a;S.tipT=Date.now();S.c.tips=(S.c.tips||0)+a;const tb=S.b.find(b=>b.type==='tipbox');if(tb)float(tb,'+¥'+num(a),'#a87407');save();updHUD();toast('Collected ¥'+num(a)+' in tips!');return a;}
/* puts the Tip Box on a free tile beside a road, as close to the front of town as possible */
function autoPlace(o,type,border){if(o.b.some(b=>b.type===type))return;const sz=o.size||10,of=(MAP-sz)/2,used=new Set();
  for(const b of o.b){const d=DEFS[b.type];if(!d)continue;for(let i=0;i<d.w;i++)for(let j=0;j<d.h;j++)used.add((b.y+j)*MAP+b.x+i);}
  const R=(x,y)=>x>=0&&y>=0&&x<MAP&&y<MAP&&o.roads[y*MAP+x]>0&&o.roads[y*MAP+x]!==2;let best=null,bs=-1e9;
  for(let y=of;y<of+sz;y++)for(let x=of;x<of+sz;x++){const k=y*MAP+x;if(used.has(k)||o.roads[k])continue;const edge=x===of||y===of||x===of+sz-1||y===of+sz-1;
    const sc=((R(x+1,y)||R(x-1,y)||R(x,y+1)||R(x,y-1))?1000:0)+(border&&edge?2000:0)+x+y;if(sc>bs){bs=sc;best=[x,y];}}
  if(best)o.b.push({id:(o.nid=(o.nid||1)+1)-1,type,x:best[0],y:best[1]});}
function ensureTipBox(o){if(o&&o.__tk)return;autoPlace(o,'gate',true);autoPlace(o,'tipbox',false);}
/* ---------- day and night bonus ---------- */
function baseEarn(b){const d=DEFS[b.type];return Math.round(d.earn*D.mult*(1+.1*bStars(b))*LV_MULT[lvOf(b)-1]*(1+.05*perkInc())*(hasRT(b,4)||hasRT(b,7)?1.1:1)*(DEFS[b.type].cat==='shop'?footMult(b)*dupMult(b):1)*(b.type==='onsen'&&WX().k==='snow'?1.3:1)*(DEFS[b.type].cat==='shop'?trendMult(b):1)*v20Mult(b));}
const dnOn=d=>!!d.dn&&d.dn===ENV().phase;

function readyCounts(){let crops=0,shops=0,stock=0,homes=0;const n=Date.now();
  for(const b of S.b){const d=DEFS[b.type];if(d.cat==='farm'&&b.st!=='empty'&&prog(b,n)>=1)crops++;else if(d.cat==='shop'&&nearRoad(b)){if(b.st==='idle')stock++;else if(prog(b,n)>=1)shops++;}else if(d.cat==='home'&&nearRoad(b)&&prog(b,n)>=1)homes++;}

function star5(px,py,r,col,st){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;ctx.lineTo(px+Math.cos(a)*rr,py+Math.sin(a)*rr);}ctx.closePath();ctx.fillStyle=col;ctx.fill();if(st){ctx.strokeStyle=st;ctx.lineWidth=.6;ctx.stroke();}}
function starPath(px,py,r){for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r,X=px+Math.cos(a)*rr,Y=py+Math.sin(a)*rr;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}ctx.closePath();}
function starPlaque(b,k){const d=DEFS[b.type],x=b.x+d.w-.1,y=b.y+d.h-.1,g=P(x,y,0),p=P(x,y,10),w=3+k*4.2;ln(g,[p[0],p[1]+.6],'#5a391f',1.3);
  ctx.fillStyle=k===3?'#2b2b2e':'#6b4426';ctx.fillRect(p[0]-w/2,p[1]-4.4,w,5);if(!LOW){ctx.strokeStyle=k===3?GOLD:'rgba(28,37,65,.6)';ctx.lineWidth=.7;ctx.strokeRect(p[0]-w/2,p[1]-4.4,w,5);}
  ctx.beginPath();for(let i=0;i<k;i++)starPath(p[0]-w/2+3.6+i*4.2,p[1]-1.9,1.8);ctx.fillStyle='#f6d36a';ctx.fill();}
function fenceRun(x0,y0,x1,y1,col,h,n){ctx.beginPath();for(let i=0;i<=n;i++){const t=i/n,a=P(x0+(x1-x0)*t,y0+(y1-y0)*t,0),c=P(x0+(x1-x0)*t,y0+(y1-y0)*t,h);ctx.moveTo(a[0],a[1]);ctx.lineTo(c[0],c[1]);}
  ctx.strokeStyle=col;ctx.lineWidth=1.6;ctx.lineCap='round';ctx.stroke();ctx.beginPath();for(const f of [.72,.32]){const a=P(x0,y0,h*f),c=P(x1,y1,h*f);ctx.moveTo(a[0],a[1]);ctx.lineTo(c[0],c[1]);}ctx.strokeStyle=shade(col,.82);ctx.lineWidth=1.1;ctx.stroke();}
function stoneRun(x0,y0,x1,y1){const n=4;for(let i=0;i<n;i++){const t=i/n,t2=(i+.85)/n;box(x0+(x1-x0)*t-.035,y0+(y1-y0)*t-.035,(x1-x0)*(t2-t)+.07,(y1-y0)*(t2-t)+.07,0,3.4,i%2?'#bdb6a8':'#cfc8ba');}}

const starable=d=>d.cat==='farm'||d.cat==='shop'||d.cat==='home';
function canUp(b){const c=upCost(b);return !!c&&!b.up&&!busy(b)&&!DEFS[b.type].kura&&!(c.lvl&&S.lvl<c.lvl)&&S.koban>=(c.koban||0)&&bStars(b)>=c.need&&S.yen>=c.yen&&S.goods>=c.goods;}
function upArrow(px,py,s){ctx.save();ctx.translate(px,py);ctx.scale(s,s);ctx.beginPath();ctx.arc(0,0,7,0,6.283);ctx.fillStyle='#5aa646';ctx.fill();ctx.strokeStyle='#1c2541';ctx.lineWidth=1.4;ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,-4.2);ctx.lineTo(3.6,0);ctx.lineTo(1.4,0);ctx.lineTo(1.4,3.8);ctx.lineTo(-1.4,3.8);ctx.lineTo(-1.4,0);ctx.lineTo(-3.6,0);ctx.closePath();ctx.fillStyle='#fff';ctx.fill();ctx.restore();}
function drawUpgradeView(s){for(const b of S.b){const d=DEFS[b.type];if(!starable(d))continue;const k=bStars(b),L=lvOf(b),shop=d.cat!=='farm',p=P(b.x+d.w/2,b.y+d.h/2,htOf(b)+14+((b.x+b.y)%2)*13);
  ctx.save();ctx.translate(p[0],p[1]);ctx.scale(s,s);const w=30;
  ctx.fillStyle='rgba(28,37,65,.85)';ctx.beginPath();ctx.roundRect?ctx.roundRect(-w/2,-6.5,w,11,5.5):ctx.rect(-w/2,-6.5,w,11);ctx.fill();
  ctx.beginPath();for(let i=0;i<k;i++)starPath(-w/2+6+i*9,-1,3.3);ctx.fillStyle='#f6d36a';ctx.fill();
  ctx.beginPath();for(let i=k;i<3;i++)starPath(-w/2+6+i*9,-1,3.3);ctx.fillStyle='rgba(255,255,255,.3)';ctx.fill();
  if(shop){ctx.beginPath();ctx.arc(w/2+4,-1,6.5,0,6.283);ctx.fillStyle=L===3?'#e2b53a':'#ffffff';ctx.fill();ctx.strokeStyle='#1c2541';ctx.lineWidth=1.3;ctx.stroke();
    ctx.fillStyle='#1c2541';ctx.font='800 8px "M PLUS Rounded 1c",system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(String(L),w/2+4,2);}
  ctx.restore();const c=upCost(b);if(c&&k>=c.need)upArrow(p[0]+(shop?w/2+15:w/2+6)*s,p[1]-1*s,s*.75);}}

function normExtra(o){const now=Date.now();if(!o.ffT)o.ffT=now;o.ing=(o.ing&&typeof o.ing==='object')?o.ing:{};for(const k in ING)o.ing[k]=Math.max(0,o.ing[k]|0);if(!o.tipT||o.tipT>now+60000)o.tipT=now;o.perk.tip=o.perk.tip|0;

function dayKey(off){const d=new Date();d.setDate(d.getDate()+(off||0));return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function newDaily(){
  const key=today();let seed=0;for(const ch of key)seed=(seed*31+ch.charCodeAt(0))%1000003;
  const pool=DPOOL.filter(m=>!m.ok||m.ok());const ids=[];
  while(ids.length<3&&ids.length<pool.length){seed=(seed*9301+49297)%233280;const m=pool[Math.floor(seed/233280*pool.length)];if(!ids.includes(m.id))ids.push(m.id);}
  const ms=ids.map(id=>DPOOL.find(m=>m.id===id));
  S.daily={d:key,ids,t:ms.map(m=>m.t(S.lvl)),base:ms.map(m=>cval(m.k)),claimed:[false,false,false],bonus:false};}
function dailyNow(){if(!S.daily||S.daily.d!==today())newDaily();return S.daily;}
function dProg(i){const dl=dailyNow(),m=DPOOL.find(q=>q.id===dl.ids[i]);return Math.max(0,cval(m.k)-dl.base[i]);}
function goalsReady(){if(visiting)return 0;if(!planning)bookDraws();const dl=dailyNow();let c=0;
  dl.ids.forEach((id,i)=>{if(!dl.claimed[i]&&dProg(i)>=dl.t[i])c++;});if(!dl.bonus&&dl.claimed.every(Boolean))c++;
  return c+ACH.filter(achReady).length+ordersReady()+setsReady()+(vipMet(vipNow())?1:0)+(loginDue()?1:0)+albumReady()+tkReady();}
function giveKoban(k,why){S.koban+=k;toast('+'+k+' koban · '+why);}
function claimDaily(i){const dl=dailyNow();if(dl.claimed[i]||dProg(i)<dl.t[i])return;dl.claimed[i]=true;S.c.daily=(S.c.daily||0)+1;S.energy+=5;giveKoban(1,'mission complete, +5 energy');save();}
function claimBonus(){const dl=dailyNow();if(dl.bonus||!dl.claimed.every(Boolean))return;dl.bonus=true;

      if(hash(k,9)<.18){c.fillRect(x+w/2-1.5,y0-h-18,3,18);if(night>.3&&(n/600+k)%2<1.4){c.fillStyle='#ff5050';c.fillRect(x+w/2-1.5,y0-h-20,3,3);}}

const isCar=(x,y)=>{const r=rtAt(x,y);return r===6||r===8;};
function tkRoad(x,y,r){const n4=[[1,0],[-1,0],[0,1],[0,-1]];
  if(r===7){poly([P(x,y),P(x+1,y),P(x+1,y+1),P(x,y+1)],'#d9c3a5',false);for(let i=0;i<4;i++)for(let j=0;j<4;j++)if((i+j)%2===0){const a=x+.03+i*.24,b=y+.03+j*.24;poly([P(a,b),P(a+.22,b),P(a+.22,b+.22),P(a,b+.22)],'#cfb594',false);}
    poly([P(x+.44,y),P(x+.56,y),P(x+.56,y+1),P(x+.44,y+1)],'rgba(255,255,255,.18)',false);return;}
  poly([P(x,y),P(x+1,y),P(x+1,y+1),P(x,y+1)],'#5f636a',false);
  const cx=isCar(x+1,y)||isCar(x-1,y),cy=isCar(x,y+1)||isCar(x,y-1);
  /* pavements along edges that do not continue as road */
  const sw='#c9c6bf',cb='#9a968f';
  if(!isCar(x,y-1)){poly([P(x,y),P(x+1,y),P(x+1,y+.15),P(x,y+.15)],sw,false);ln(P(x,y+.15),P(x+1,y+.15),cb,1);}
  if(!isCar(x,y+1)){poly([P(x,y+.85),P(x+1,y+.85),P(x+1,y+1),P(x,y+1)],sw,false);ln(P(x,y+.85),P(x+1,y+.85),cb,1);}
  if(!isCar(x-1,y)){poly([P(x,y),P(x+.15,y),P(x+.15,y+1),P(x,y+1)],sw,false);ln(P(x+.15,y),P(x+.15,y+1),cb,1);}
  if(!isCar(x+1,y)){poly([P(x+.85,y),P(x+1,y),P(x+1,y+1),P(x+.85,y+1)],sw,false);ln(P(x+.85,y),P(x+.85,y+1),cb,1);}
  if(r===8){const along=cx||!cy;for(let i=0;i<5;i++){const t=.2+i*.13;if(along)poly([P(x+.22,y+t),P(x+.78,y+t),P(x+.78,y+t+.07),P(x+.22,y+t+.07)],'#f4f4f0',false);else poly([P(x+t,y+.22),P(x+t+.07,y+.22),P(x+t+.07,y+.78),P(x+t,y+.78)],'#f4f4f0',false);}return;}
  if(cx&&!cy){for(const a of [.08,.58])ln(P(x+a,y+.5),P(x+a+.3,y+.5),'#f4f1e0',1.1);}
  else if(cy&&!cx){for(const a of [.08,.58])ln(P(x+.5,y+a),P(x+.5,y+a+.3),'#f4f1e0',1.1);}
  else if(cx&&cy)ell(...P(x+.5,y+.5),3,1.5,'rgba(255,255,255,.12)',false);}
function tkRoadDeco(rd){const x=rd.x,y=rd.y;

    if(/\{\d\}/.test(en)){const parts=en.split(/\{(\d)\}/);let re='^',lit=0;const idx=[];
      for(let i=0;i<parts.length;i++){if(i%2){re+=(parts[i+1]===''&&i+2<parts.length)?'([\\s\\S]+?)':'([\\s\\S]*?)';idx.push(+parts[i]);}else{re+=parts[i].replace(/[.*+?^${}()|[\]\\]/g,'\\$&');lit+=parts[i].length;}}

    box.innerHTML=L.length?'<ol class="board goals feed">'+L.map(x=>{const s=SKIN[x.skin];return '<li><span class="rk" style="color:'+RAR_COL[s.r]+'">'+(s.r==='l'?'★':'◆')+'</span><span class="who"><span class="nm"><span class="notr">'+esc(clean(x.name,20)||'A mayor')+'</span></span><span class="tw">'+esc(s.n)+' · '+typeName(s.t)+' · <span class="rtag" style="background:'+RAR_COL[s.r]+'">'+RAR_N[s.r]+'</span></span></span><span class="val"><small>'+(x.at?fmt(Math.max(1,(Date.now()-x.at)/1000))+' ago':'')+'</small></span></li>';}).join('')+'</ol>':'<p class="gnote"><small>No Epic or Legendary draws yet. Be the first!</small></p>';}
  catch(e){box.innerHTML='<p class="gnote"><small>Could not load recent draws.</small></p>';}}

ce bubble and finish the request.","點擊有頭像泡泡的東京住宅，完成他們的請求。","㩒一間有頭像泡泡嘅東京屋，完成佢嘅要求。","顔の吹き出しがある東京の住まいをタップして、お願いをかなえよう。"],["Lay 12 car road tiles","鋪設 12 格車道","鋪 12 格車道","車道を12マス敷く"],["Cars drive on car roads. People walk on the pavements.","汽車在車道上行駛，行人走行人道。","車喺車道行，人行行人路。","車は車道を走り、人は歩道を歩きます。"],["Build a Warehouse","興建物流倉","起一間物流倉","倉庫を建てる"],["Warehouses hold more supplies and parts.","物流倉能存放更多物資和零件。","物流倉放得多啲物資同零件。","倉庫があると資材と部品をもっと保管できます。"],["Reach 1,000 Tokyo tourists","東京遊客達到 1,000 人","東京遊客去到 1,000 人","東京の観光客 1,000 人"],["Decorations by a road bring tourists.","路旁的裝飾會吸引遊客。","路邊啲裝飾會吸引遊客。","道沿いの飾りが観光客を呼びます。"],["Build the Loyal Dog Statue","興建忠犬像","起忠犬像","忠犬像を建てる"],["Make 3 neighbours good friends (friendship Lv 3). Then build it from Landmarks.","和 3 位鄰居成為好朋友（友好度 Lv 3），然後在 地標 興建。","同 3 個街坊做好朋友（友好度 Lv 3），然後喺 地標 起佢。","住人3人と仲良くなろう（友好度 Lv 3）。そしてランドマークから建てよう。"],["Grow Tokyo to 12×12","把東京擴展到 12×12","將東京擴到 12×12","東京を 12×12 に広げる"],["Tap Expand while you are in Tokyo.","在東京時點擊 擴張。","喺東京嗰陣㩒 擴地。","東京にいる間に 拡張 をタップ。"],["Golden Racer","黃金賽車","金色戰車","ゴールデンレーサー"],["Midnight Purple Wing","午夜紫翼","午夜紫翼","ミッドナイトパープル・ウイング"],["Neon Rotary","霓虹轉子","霓虹轉子","ネオンロータリー"],["Sakura Kei Truck","櫻花輕型貨車","櫻花小貨車","桜の軽トラ"],["Chrome Taxi","鍍鉻的士","銀光的士","クロームタクシー"],["Sky Blue Van","天藍色客貨車","天藍色貨Van","スカイブルーのバン"],["Hana Sato","佐藤花","佐藤花","佐藤ハナ"],["University student","大學生","大學生","大学生"],["Hi, I'm Hana! I just moved to Tokyo for university. Everything is so big and fast here. I hope I can find a quiet place to study.","嗨，我是小花！我剛搬來東京讀大學。這裡一切都又大又快。希望我能找到一個安靜的地方讀書。","Hi，我係小花！我啱啱搬嚟東京讀大學。呢度乜都好大好快。希望可以搵到個靜啲嘅地方溫書。","こんにちは、ハナです！大学のために東京に引っ越してきたばかり。ここは何でも大きくて速いの。静かに勉強できる場所が見つかるといいな。"],["I found a café near my home! I study there every evening. The owner remembers my order now. I feel a little less lonely.","我在家附近找到一間咖啡店！我每晚都在那裡讀書。老闆現在記得我點甚麼了。我覺得沒那麼孤單了。","我喺屋企附近搵到間咖啡店！我晚晚都喺度溫書。老闆而家記得我飲咩。我冇咁孤單喇。","家の近くにカフェを見つけた！毎晩そこで勉強してるの。店長さんがもう私の注文を覚えてくれた。少しさみしくなくなったよ。"],["I failed my first exam today. I sat in the park and cried a bit. Then a kind grandma gave me a candy and told me to try again.","我今天第一次考試不及格。我坐在公園裡哭了一會兒。然後一位好心的婆婆給了我一顆糖，叫我再試一次。","我今日第一次考試肥咗。我坐喺公園喊咗陣。跟住有個好好人嘅婆婆俾咗粒糖我，叫我再試過。","今日、初めての試験に落ちちゃった。公園で少し泣いたの。そしたら優しいおばあちゃんがアメをくれて、もう一度がんばってって。"],["I passed my exam! I studied every night with coffee and bread from the konbini. Thank you for making this street so easy to live in.","我考試合格了！我每晚都配著便利店的咖啡和麵包溫習。謝謝你讓這條街這麼好住。","我考試合格喇！我晚晚飲住便利店嘅咖啡、食住麵包溫書。多謝你令呢條街咁好住。","試験に合格したよ！毎晩コンビニのコーヒーとパンで勉強したの。この通りを住みやすくしてくれてありがとう。"],["I want to be a city planner, like you, Mayor! I made a small study corner for everyone. Please put it somewhere nice.","我想成為城市規劃師，就像你一樣，鎮長！我為大家做了一個小讀書角。請把它放在好地方。","我想做城市規劃師，好似你咁，鎮長！我整咗個小小嘅溫書角俾大家。請擺喺個好地方。","私も町長みたいな都市計画家になりたい！みんなのために小さな勉強コーナーを作ったよ。いい場所に置いてね。"],["Kenji Mori","森健二","森健二","森ケンジ"],["Office worker","上班族","打工仔","会社員"],["I'm Kenji. I work long hours at an office downtown. I come home late and eat dinner from the konbini. It's fine. Really.","我是健二。我在市中心的辦公室工作很長時間。我很晚回家，晚餐吃便利店的東西。沒事的，真的。","我係健二。我喺市中心間寫字樓返長工。好夜先返到屋企，晚餐食便利店。冇事嘅，真係。","ケンジです。都心のオフィスで長時間働いています。帰りは遅くて、夕飯はコンビニ。大丈夫です。本当に。"],["My team went to karaoke after work. I sang an old 90s song and everyone laughed. In a good way! I forgot how much I like singing.","下班後團隊去了唱卡拉OK。我唱了一首 90 年代的老歌，大家都笑了。是好的那種笑！我都忘了自己有多喜歡唱歌。","收工之後成組人去唱K。我唱咗首 90 年代嘅舊歌，個個都笑。係好嗰種笑！我都唔記得自己幾鍾意唱歌。","仕事のあと、チームでカラオケに行きました。90年代の古い歌を歌ったら、みんな笑った。いい意味で！歌うのがこんなに好きだったなんて忘れてた。"],["My boss shouted at me today. On the way home, the vending machine gave me two drinks by mistake. Small luck still counts.","老闆今天罵了我。回家路上，自動販賣機不小心給了我兩罐飲品。小小的運氣也算數。","老闆今日鬧咗我。返屋企路上，部自動售賣機甩多咗罐嘢飲俾我。小小好彩都計㗎。","今日は上司に怒鳴られた。帰り道、自販機が間違えて2本出してくれた。小さな幸運も幸運だ。"],["I asked my boss if I can leave on time on Fridays. He said yes! Now Friday night is karaoke night.","我問老闆星期五可不可以準時下班。他答應了！現在星期五晚上是卡拉OK之夜。","我問老闆星期五可唔可以準時收工。佢話得！而家星期五晚就係唱K夜。","金曜日は定時で帰っていいか上司に聞いたら、OKだった！今は金曜の夜はカラオケの夜。"],["I won the office karaoke contest! They gave me a golden mic. I want the whole street to have it. Every tired worker deserves a song.","我贏了公司的卡拉OK比賽！他們送了我一支金色咪。我想讓整條街都擁有它。每個疲累的打工族都值得唱一首歌。","我贏咗公司唱K比賽！佢哋送咗支金咪俾我。我想成條街都有份。每個攰到癱嘅打工仔都值得唱返首歌。","会社のカラオケ大会で優勝！金のマイクをもらった。この通りのみんなのものにしたい。疲れた働く人はみんな、一曲歌っていいんだ。"],["Yuki Tanaka","田中雪","田中雪","田中ユキ"],["Café owner","咖啡店老闆","咖啡店老闆","カフェの店主"],["Welcome! I'm Yuki. My dream is to run the best little café in Tokyo. Right now it's just me, one coffee machine and a lot of hope.","歡迎！我是小雪。我的夢想是經營東京最好的小咖啡店。現在只有我、一部咖啡機和滿滿的希望。","歡迎！我係小雪。我嘅夢想係開東京最好嘅小咖啡店。而家得我一個、一部咖啡機同好多希望。","いらっしゃい！ユキです。夢は東京一の小さなカフェを開くこと。今は私とコーヒーマシン1台と、たくさんの希望だけ。"],["A student comes every evening and orders the same latte. Her name is Hana. Regular customers make a shop feel like home.","有一位學生每晚都來，點同一杯拿鐵。她叫小花。熟客讓一間店有家的感覺。","有個學生晚晚都嚟，叫同一杯拿鐵。佢叫小花。有熟客，間舖就好似屋企咁。","毎晩、同じラテを頼む学生さんがいるの。名前はハナちゃん。常連さんがいると、お店が家みたいになる。"],["The rent went up again. I almost closed the café. Then my customers made a poster: 'Please stay, Yuki!' I cried into the milk.","租金又漲了。我差點要關掉咖啡店。然後客人做了一張海報：「小雪，請留下！」我哭到眼淚滴進牛奶裡。","又加租。我差啲要執笠。跟住啲客整咗張海報：「小雪，唔好走！」我喊到眼淚滴落啲奶度。","また家賃が上がった。もう少しでカフェを閉めるところだった。そしたらお客さんがポスターを作ってくれたの：「ユキさん、辞めないで！」ミルクに涙が落ちちゃった。"],["I learned latte art! My first heart looked like a potato. Now people take photos of my cups and share them online.","我學會拉花了！我的第一個心形看起來像一顆薯仔。現在大家會拍我的杯子，分享到網上。","我學識拉花喇！我第一個心心似粒薯仔。而家啲人會影我啲杯放上網。","ラテアートを覚えた！最初のハートはジャガイモみたいだった。今ではみんなカップの写真を撮ってネットに載せてくれる。"],["A food magazine wrote about my café! To say thank you, I made a fountain shaped like a latte cup. Yes, it's a little silly.","一本美食雜誌介紹了我的咖啡店！為了道謝，我做了一個拿鐵杯形狀的噴泉。對，是有點傻。","有本飲食雜誌寫咗我間咖啡店！為咗多謝大家，我整咗個拿鐵杯形嘅噴泉。係，係有啲傻。","グルメ雑誌に私のカフェが載った！お礼にラテカップの形の噴水を作ったの。うん、ちょっとおかしいよね。"],["Grandma Fumiko","文子婆婆","文子婆婆","フミコおばあちゃん"],["Retired teacher","退休教師","退休老師","元教師"],["I'm Fumiko. I have lived in this area for seventy years. The buildings changed many times, but the ginkgo trees stayed.","我是文子。我在這一帶住了七十年。建築物變了很多次，但銀杏樹一直都在。","我係文子。我喺呢頭住咗七十年。啲樓變咗好多次，但係啲銀杏樹一直都喺度。","フミコです。この辺りに七十年住んでいます。建物は何度も変わったけれど、イチョウの木はずっとそのまま。"],["I was a school teacher for forty years. Sometimes my old students wave at me on the street. They have grey hair now too!","我當了四十年小學老師。有時以前的學生會在街上向我揮手。他們現在也白頭髮了！","我做咗四十年老師。有時以前啲學生喺街度同我揮手。佢哋而家都白頭髮喇！","四十年、学校の先生をしていました。昔の教え子が通りで手を振ってくれることも。みんなもう白髪ですよ！"],["I grow small bonsai on my balcony. Each one is older than most people in this town. Patience is a beautiful thing.","我在露台種小盆栽。每一盆都比這個鎮上大多數人年紀還大。耐心是一件美好的事。","我喺露台種啲細盆栽。每盆都老過呢個鎮大部分人。有耐性係一件好靚嘅事。","ベランダで小さな盆栽を育てています。どれもこの町のほとんどの人より年上。辛抱は美しいものです。"],["A young girl was crying in the park, so I gave her a candy. She came back today to say she passed her exam. Good girl, Hana.","有個女孩在公園裡哭，所以我給了她一顆糖。今天她回來告訴我她考試合格了。好孩子，小花。","有個後生女喺公園喊，我就俾咗粒糖佢。今日佢返嚟話佢考試合格喇。乖女，小花。","公園で泣いている女の子にアメをあげたの。今日、試験に受かったって言いに来てくれた。えらいね、ハナちゃん。"],["I want to share my bonsai with the neighbours. Please give them a sunny spot, Mayor. Old trees and young people grow well together.","我想和鄰居分享我的盆栽。鎮長，請給它們一個有陽光的位置。老樹和年輕人一起會長得很好。","我想同街坊分享我啲盆栽。鎮長，請俾個有太陽嘅位佢哋。老樹同後生仔一齊會大得好好。","盆栽をご近所さんと分かち合いたいの。町長さん、日当たりのいい場所をお願いね。古い木と若い人は、一緒によく育つのよ。"],["Ren Kato","加藤蓮","加藤蓮","加藤レン"],["Street musician","街頭音樂人","街頭賣唱","ストリートミュージシャン"],["Yo! I'm Ren. I play guitar on the street every night. Nobody stops yet, but one day this whole street will sing with me.","喲！我是阿蓮。我每晚都在街上彈結他。現在還沒有人停下來聽，但總有一天整條街都會跟我一起唱。","Yo！我係阿蓮。我晚晚喺街度彈結他。暫時未有人停低聽，但總有一日成條街都會跟我一齊唱。","よっ！レンだ。毎晩、路上でギターを弾いてる。まだ誰も足を止めないけど、いつかこの通り全部が一緒に歌うんだ。"],["A man in a suit dropped ¥100 in my guitar case and said, 'Keep going.' It was Kenji from the apartment! Now we sing together sometimes.","一位穿西裝的男人丟了 ¥100 進我的結他盒，說：「繼續加油。」原來是公寓的健二！現在我們有時會一起唱。","有個著西裝嘅男人掟咗 ¥100 落我個結他盒，話：「繼續加油。」原來係公寓嗰個健二！而家我哋有時會一齊唱。","スーツの男の人がギターケースに ¥100 入れて「続けろよ」って。アパートのケンジさんだった！今は時々一緒に歌ってる。"],["It rained all week and I couldn't play. I wrote three new songs at home instead. Rain is just music that falls.","下了一整個星期雨，我沒辦法表演。於是我在家寫了三首新歌。雨只是會落下來的音樂。","落咗成個星期雨，我冇得表演。於是我喺屋企寫咗三首新歌。雨只不過係跌落嚟嘅音樂。","一週間ずっと雨で弾けなかった。代わりに家で新曲を3つ書いた。雨は空から落ちてくる音楽なんだ。"],["Fifty people stopped to listen tonight! Someone filmed it and now my video has 10,000 views. My mum called me, crying.","今晚有五十人停下來聽！有人拍了下來，現在我的影片有 10,000 次觀看。媽媽打電話給我，哭了。","今晚有五十個人停低聽！有人影咗落嚟，而家我條片有 10,000 個 view。阿媽打俾我，喊晒。","今夜は五十人が足を止めて聴いてくれた！誰かが撮ってくれて、動画は1万回再生。母さんが泣きながら電話してきた。"],["A music company wants to meet me! Before I go, I built a little stage for the street. Any musician can play there. Free, always.","一間唱片公司想見我！出發之前，我為這條街搭了一個小舞台。任何音樂人都可以在那裡表演。永遠免費。","有間唱片公司想見我！走之前，我幫呢條街搭咗個小舞台。邊個音樂人都可以喺度表演。永遠免費。","音楽会社が会いたいって！行く前に、この通りに小さなステージを作ったんだ。どんなミュージシャンも演奏できる。ずっと無料で。"],["Aiko Fujii","藤井愛子","藤井愛子","藤井アイコ"],["Fashion designer","時裝設計師","時裝設計師","ファッションデザイナー"],["I'm Aiko. I design clothes in my tiny apartment. My sewing machine is louder than the trains. Sorry, neighbours.","我是愛子。我在小小的公寓裡設計衣服。我的衣車比火車還吵。鄰居們，對不起。","我係愛子。我喺間細細嘅公寓度設計衫。我部衣車嘈過火車。街坊，唔好意思。","アイコです。小さなアパートで服をデザインしています。ミシンの音は電車よりうるさいの。ご近所さん、ごめんなさい。"],["I sold my first jacket! A girl bought it at the boutique downstairs. I followed her for one block just to see it move. Is that strange?","我賣出了第一件外套！一個女孩在樓下的時裝店買的。我跟著她走了一個街口，只是想看它穿起來的樣子。這樣奇怪嗎？","我賣出咗第一件褸！有個女仔喺樓下間時裝舖買咗。我跟咗佢行一個街口，淨係想睇件褸郁起嚟點。係咪好怪？","初めてジャケットが売れた！下のブティックで女の子が買ってくれたの。動く姿が見たくて、1ブロックついて行っちゃった。変かな？"],["My big fashion show was cancelled. I sat on the floor with all my dresses around me. Then I thought: the street can be my runway.","我的大型時裝表演取消了。我坐在地上，身邊圍滿了我的裙子。然後我想：這條街可以成為我的天橋。","我個大型時裝騷取消咗。我坐喺地下，周圍都係我啲裙。跟住我諗：呢條街可以做我嘅天橋。","大きなファッションショーが中止になった。ドレスに囲まれて床に座り込んだの。そして思った：この通りを私のランウェイにすればいい。"],["I held a mini show on the walking street. Grandma Fumiko walked in it! She was the best model. Everyone clapped for her.","我在行人街辦了一場小型時裝表演。文子婆婆也有走秀！她是最好的模特兒。大家都為她鼓掌。","我喺行人專用區搞咗個迷你時裝騷。文子婆婆都有行！佢係最好嘅模特兒。個個都為佢拍手。","歩行者天国でミニショーを開いたの。フミコおばあちゃんも歩いてくれた！最高のモデルだった。みんな拍手してくれたよ。"],["The Fashion Tower wants my designs! I made a runway arch for the town, so everyone can feel like a star when they walk under it.","時裝大樓想要我的設計！我為小鎮做了一個天橋拱門，讓每個人走過時都覺得自己是明星。","時裝大樓想要我啲設計！我幫個鎮整咗個天橋拱門，等個個行過都覺得自己係明星。","ファッションタワーが私のデザインを欲しいって！町にランウェイアーチを作ったの。くぐる人がみんなスターの気分になれるように。"],["Taro Ishida","石田太郎","石田太郎","石田タロウ"],["Game developer","遊戲開發者","遊戲開發者","ゲーム開発者"],["Hi, I'm Taro. I make video games. Well, one game. It has 12 players, and 10 of them are my family.","嗨，我是太郎。我製作電子遊戲。嗯，一個遊戲。它有 12 位玩家，其中 10 位是我的家人。","Hi，我係太郎。我整電子遊戲。嗯，一隻遊戲。有 12 個玩家，其中 10 個係我屋企人。","やあ、タロウです。ゲームを作ってます。まあ、1本だけ。プレイヤーは12人、そのうち10人は家族。"],["I spent all night at the arcade 'for research'. I lost to a ten-year-old girl five times. She was very kind about it.","我「為了研究」在遊戲中心待了一整晚。我輸給一個十歲女孩五次。她對我很友善。","我「為咗做研究」喺機舖打咗成晚。我輸咗俾個十歲女仔五次。佢對我好好。","「研究のため」にゲームセンターで一晩過ごした。十歳の女の子に5回負けた。彼女はとても優しかった。"],["My computer broke one week before my game update. The electronics store owner fixed it for free. Tokyo people are the best.","在遊戲更新前一個星期，我的電腦壞了。電器店老闆免費幫我修好了。東京人最好了。","遊戲更新前一個星期，我部電腦壞咗。電器舖老闆免費幫我整返好。東京人最正。","ゲームのアップデートの1週間前にパソコンが壊れた。家電店の店主さんがタダで直してくれた。東京の人は最高だ。"],["My game reached number one in a small online shop! The ten-year-old girl sent me a message: 'Still easy.' I'm so proud.","我的遊戲在一個小型網上商店排第一！那個十歲女孩傳訊息給我：「還是很簡單。」我好驕傲。","我隻遊戲喺一個細細嘅網店排第一！嗰個十歲女仔send咗個message俾我：「都係好易。」我好有成功感。","僕のゲームが小さなオンラインストアで1位になった！あの十歳の女の子からメッセージ：「まだ簡単」。誇らしい。"],["I built a real arcade machine with my game inside. It's for the town. High score gets a free coffee at Yuki's café. Probably.","我做了一部真的街機，裡面是我的遊戲。這是給小鎮的。最高分可以在小雪的咖啡店免費喝一杯咖啡。大概吧。","我整咗部真嘅街機，入面係我隻遊戲。呢部係送俾個鎮嘅。最高分可以喺小雪間咖啡店免費飲杯咖啡。應該啦。","僕のゲームが入った本物のアーケード筐体を作った。町へのプレゼント。ハイスコアの人はユキさんのカフェでコーヒー1杯無料。たぶん。"],["Mei Lin","林小美","林小美","リン・メイ"],["Delivery rider","外賣車手","外賣仔","配達員"],["Hi! I'm Mei. I came to Tokyo from Taiwan two years ago. I deliver food on my bike. I know every shortcut in this town!","嗨！我是小美。我兩年前從台灣來到東京。我騎單車送外賣。這個鎮的每條捷徑我都知道！","Hi！我係小美。我兩年前由台灣嚟東京。我踩單車送外賣。呢個鎮每條捷徑我都知！","こんにちは！メイです。2年前に台湾から東京に来ました。自転車でフードを配達してます。この町の近道は全部知ってるよ！"],["I deliver lunch to the factory every day. The workers call me 'Lightning Mei'. I like that name a lot.","我每天都送午餐到工廠。工人們叫我「閃電小美」。我很喜歡這個名字。","我日日都送午餐去工廠。啲工人叫我「閃電小美」。我好鍾意呢個名。","毎日、工場にお昼を届けてるの。職人さんたちは私を「いなずまメイ」って呼ぶ。この名前、すごく気に入ってる。"],["My bike was stolen today. I walked to all my deliveries. My feet hurt, but the customers gave me big smiles. And one gave me a bun.","我的單車今天被偷了。我走路去送所有外賣。腳很痛，但客人都給我大大的笑容。還有一位給了我一個包。","我架單車今日俾人偷咗。我行路送晒所有外賣。隻腳好痛，但啲客都對我笑得好開心。仲有個俾咗個包我。","今日、自転車を盗まれた。全部歩いて配達したよ。足が痛いけど、お客さんはみんな笑顔をくれた。ひとりはパンもくれた。"],["The whole street put money together and bought me a new bike! It's yellow and very fast. I cried on the way to my first delivery.","整條街一起湊錢，買了一部新單車給我！是黃色的，而且很快。我在去送第一單外賣的路上哭了。","成條街夾錢買咗架新單車俾我！黃色㗎，好快。我送第一單嗰陣喊咗成路。","通りのみんながお金を出し合って、新しい自転車を買ってくれた！黄色でとても速いの。最初の配達の途中で泣いちゃった。"],["I painted my old bike gold and made it into art. It says: 'Thank you, neighbours.' Please put it where everyone can see it.","我把舊單車漆成金色，變成一件藝術品。上面寫著：「謝謝你們，鄰居。」請把它放在大家都看得到的地方。","我將架舊單車髹成金色，整成件藝術品。上面寫住：「多謝晒，街坊。」請擺喺個個都睇到嘅地方。","古い自転車を金色に塗ってアートにしたよ。「ありがとう、ご近所さん」って書いてある。みんなが見える場所に置いてね。"],["Haruto Ono","小野陽人","小野陽人","小野ハルト"],["Night taxi driver","夜班的士司機","夜更的士司機","夜のタクシー運転手"],["Good evening. I'm Haruto. I drive a taxi at night. I've seen this city at 3 a.m. Most of its secrets are about ramen.","晚上好。我是陽人。我在晚上開的士。我見過凌晨三點的這座城市。它大部分的秘密都和拉麵有關。","晚安。我係陽人。我揸夜更的士。我見過凌晨三點嘅呢個城市。佢大部分秘密都同拉麵有關。","こんばんは。ハルトです。夜にタクシーを走らせています。午前3時のこの街を見てきました。秘密のほとんどはラーメンのことです。"],["Tonight I drove a famous actor and a lost grandmother. The grandmother was more interesting. She told me about Tokyo seventy years ago.","今晚我載了一位著名演員和一位迷路的婆婆。婆婆比較有趣。她跟我講了七十年前的東京。","今晚我載咗個出名演員同一個蕩失路嘅婆婆。婆婆有趣啲。佢同我講七十年前嘅東京。","今夜は有名な俳優と、道に迷ったおばあさんを乗せました。おばあさんの方が面白かった。七十年前の東京の話をしてくれました。"],["My old taxi broke down after 500,000 km. I patted it like an old dog and said thank you. It was a good car.","我的舊的士跑了 500,000 公里後壞了。我像拍老狗一樣拍拍它，說聲謝謝。它是一部好車。","我架舊的士行咗 500,000 公里之後壞咗。我好似掃隻老狗咁掃下佢，同佢講多謝。佢係架好車。","古いタクシーが50万キロで壊れました。老犬をなでるようになでて、ありがとうと言いました。いい車でした。"],["I helped a sick man get to the hospital fast. His family came to thank me with a big box of fruit. This job matters.","我幫一位生病的男人盡快趕到醫院。他的家人帶了一大盒水果來道謝。這份工作很有意義。","我幫一個病咗嘅男人好快去到醫院。佢屋企人拎咗一大盒生果嚟多謝我。呢份工有意義。","病気の男性を急いで病院へ送りました。家族が大きな果物の箱を持ってお礼に来てくれた。この仕事には意味があります。"],["I restored my old taxi and painted it like new. It can't drive any more, but it can sit in town and remember all those nights.","我修好了舊的士，把它漆得像新的一樣。它已經不能開了，但可以留在小鎮，記住所有那些夜晚。","我整返好架舊的士，髹到好似新嘅咁。佢開唔到喇，但可以留喺個鎮度，記住嗰啲晚。","古いタクシーを直して、新品みたいに塗りました。もう走れないけど、町に置いて、あの夜たちを覚えていてもらえます。"],["Emi Hayashi","林惠美","林惠美","林エミ"],["Idol trainee","偶像練習生","偶像練習生","アイドル練習生"],["Hello hello! I'm Emi! I'm training to be an idol. I dance six hours a day. My downstairs neighbours are very patient.","哈囉哈囉！我是惠美！我正在受訓成為偶像。我每天跳舞六小時。樓下的鄰居很有耐性。","哈囉哈囉！我係惠美！我做緊偶像訓練。我日日跳六個鐘舞。樓下啲街坊好有耐性。","ハローハロー！エミです！アイドルになるために練習中。毎日6時間ダンスしてます。下の階の住人さんはとても我慢強いの。"],["I failed another audition. The judge said I smile too much. Is that even possible? I practised a serious face. It looked silly.","我又一次試鏡失敗了。評審說我笑得太多。這怎麼可能？我練習了嚴肅的表情，看起來好傻。","我又試鏡失敗。評判話我笑得太多。咁都得？我練咗個認真樣，好核突。","またオーディションに落ちた。審査員に「笑いすぎ」って言われた。そんなことある？真面目な顔を練習したけど、変な顔だった。"],["I danced on the walking street with Ren's guitar. A small crowd clapped. My first real fans! One of them was a cat.","我在行人街配著阿蓮的結他跳舞。一小群人鼓掌。我第一批真正的粉絲！其中一位是貓。","我喺行人專用區跟住阿蓮彈結他跳舞。有一小班人拍手。我第一批真正嘅fans！其中一個係隻貓。","歩行者天国でレンくんのギターに合わせて踊ったの。小さな人だかりが拍手してくれた。初めての本物のファン！そのうち1人は猫だった。"],["I passed the audition! I'm in a new idol group. We practise at the karaoke box at night because it's cheap.","我通過試鏡了！我加入了一個新偶像組合。我們晚上在卡拉OK練習，因為比較便宜。","我試鏡過咗喇！我入咗個新偶像組合。我哋夜晚喺K房練習，因為平。","オーディション合格！新しいアイドルグループに入ったよ。安いから、夜はカラオケボックスで練習してるの。"],["Our first poster is ready! I made a poster wall for the town with all our faces. Please don't draw moustaches on us.","我們的第一張海報出來了！我為小鎮做了一面海報牆，上面有我們所有人的臉。請不要在我們臉上畫鬍子。","我哋第一張海報出咗喇！我幫個鎮整咗幅海報牆，有齊我哋所有人個樣。唔該唔好喺我哋度畫鬚。","初めてのポスターができた！町にメンバー全員の顔が載ったポスターの壁を作ったよ。ヒゲを描かないでね。"],["Chef Daichi","大地師傅","大地師傅","大地大将"],["Sushi chef","壽司師傅","壽司師傅","寿司職人"],["I'm Daichi. I trained as a sushi chef for ten years. Ten years! Now I work at the conveyor sushi. My knife is very sharp.","我是大地。我學做壽司師傅學了十年。十年！現在我在迴轉壽司工作。我的刀很鋒利。","我係大地。我學整壽司學咗十年。十年呀！而家我喺迴轉壽司做。我把刀好利。","ダイチです。寿司職人として十年修業しました。十年ですよ！今は回転寿司で働いています。包丁はとてもよく切れます。"],["Some people say conveyor sushi is not real sushi. I say: good food makes people happy, on a plate or on a belt.","有人說迴轉壽司不是真正的壽司。我說：好的食物會令人開心，無論在碟上還是在輸送帶上。","有人話迴轉壽司唔係真壽司。我話：好嘢食令人開心，喺碟度定喺轉帶度都一樣。","回転寿司は本物の寿司じゃないと言う人もいます。私は言います：おいしい料理は人を幸せにする。皿の上でも、レーンの上でも。"],["I made a new roll with fresh rooftop greens. The kids love it. A food blogger called it 'the green dragon'. I like that.","我用屋頂菜園的新鮮蔬菜做了一款新卷物。孩子們很愛吃。一位美食博客叫它「青龍」。我喜歡。","我用天台菜園嘅新鮮菜整咗款新卷物。啲細路好鍾意。有個食評blogger叫佢做「青龍」。我鍾意。","屋上菜園の新鮮野菜で新しい巻き寿司を作りました。子どもたちに大人気。グルメブロガーが「グリーンドラゴン」と名付けた。気に入っています。"],["I taught Mei how to make onigiri. Hers were square. She said they are 'delivery-shaped'. Fair point.","我教小美做飯糰。她做的是方形的。她說那是「外賣形」。說得有道理。","我教小美整飯糰。佢整嗰啲係四四方方嘅。佢話係「外賣形」。都啱嘅。","メイちゃんにおにぎりの作り方を教えました。四角になった。「配達しやすい形」だそうです。なるほど。"],["I bought a food truck! On Sundays I will drive it around town and feed everyone. The first plate is always free for my neighbours.","我買了一部餐車！每個星期日我都會開著它在鎮上轉，讓大家吃飽。第一碟永遠免費送給我的鄰居。","我買咗架美食車！逢星期日我會揸住佢喺個鎮度兜，餵飽大家。第一碟永遠免費俾我啲街坊。","キッチンカーを買いました！日曜日は町を回ってみんなにごちそうします。ご近所さんには最初の一皿はいつも無料。"],["Professor Okada","岡田教授","岡田教授","岡田教授"],["Retired engineer","退休工程師","退休工程師","元エンジニア"],["Good day. I am Okada. I built bridges and trains for forty years. Now I build tiny model trains in my living room.","你好。我是岡田。我建造了四十年橋和火車。現在我在客廳裡做小小的火車模型。","你好。我係岡田。我起咗四十年橋同火車。而家我喺客廳整細細架嘅火車模型。","こんにちは。岡田です。四十年、橋と列車を造ってきました。今は居間で小さな鉄道模型を作っています。"],["I helped design the first bullet trains. We called them 'dream trains'. Every dream needs good engineering.","我參與設計了第一代子彈火車。我們叫它們「夢想列車」。每個夢想都需要好的工程。","我有份設計第一代子彈火車。我哋叫佢哋做「夢想列車」。每個夢想都要好嘅工程。","最初の新幹線の設計を手伝いました。私たちは「夢の超特急」と呼んでいました。どんな夢にも良い技術が必要です。"],["My hands shake a little now. Tiny screws are hard. Taro helps me with them, and I teach him maths. A fair trade.","我的手現在有點抖。小螺絲很難處理。太郎幫我，我教他數學。很公平的交換。","我隻手而家有啲震。啲細螺絲好難搞。太郎幫我，我教佢數學。公平交易。","今は手が少し震えます。小さなネジは難しい。タロウくんが手伝ってくれて、私は数学を教えます。公平な取引です。"],["Children from the school visited my model trains. One girl asked how bridges stay up. I talked for two hours. She stayed for all of it.","學校的孩子來參觀我的火車模型。一個女孩問橋怎樣站得穩。我講了兩小時。她一直聽到最後。","學校啲細路嚟睇我啲火車模型。有個女仔問座橋點企得穩。我講咗兩個鐘。佢由頭聽到尾。","学校の子どもたちが鉄道模型を見に来ました。ある女の子が、橋はどうして立っていられるのかと聞いた。2時間話しました。最後まで聞いてくれました。"],["I built a model train set of our whole town, Mayor. The little train goes round and round. Please show it to the children.","鎮長，我做了一套整個小鎮的火車模型。小火車一圈又一圈地轉。請給孩子們看看。","鎮長，我整咗套成個鎮嘅火車模型。架小火車轉完一圈又一圈。請俾啲細路睇下。","町長、町全体の鉄道模型を作りました。小さな列車がぐるぐる回ります。子どもたちに見せてあげてください。"],["I would love a Walking Street near my home.","我很想家附近有一條行人街。","我好想屋企附近有條行人專用區。","家の近くに歩行者天国があったらいいな。"],["A crosswalk near my home would make me feel safe.","家附近有斑馬線會讓我覺得安全。","屋企附近有條斑馬線我會覺得安全啲。","家の近くに横断歩道があると安心です。"],["New neighbour!","新鄰居！","新街坊！","新しい住人！"],["A new neighbour!","來了一位新鄰居！","有新街坊！","新しい住人が来ました！"],["Nice to meet you!","很高興認識你！","好高興識到你！","はじめまして！"],["Read the story","閱讀故事","睇故事","物語を読む"],["Best friends!","最好的朋友！","老友！","親友！"],["Not yet","還沒有","未得","まだです"],["Thank you!","謝謝你！","多謝晒！","ありがとう！"],["More stories at higher friendship.","友好度更高時有更多故事。","友好度高啲會有更多故事。","友好度が上がるともっと物語が読めます。"],["Loyal Friend","忠實好友","老友記","忠実な友"],["Neighbours at friendship Lv 3","友好度 Lv 3 的鄰居","友好度 Lv 3 嘅街坊","友好度 Lv 3 の住人"],["Gatekeeper","守門人","守門人","門番"],["Old Castle restored","已修復舊城堡","整返好舊城堡","古城を復元"],["Tokyo shops","東京商店","東京舖頭","東京の店"],["Crossing Master","過路大師","過路大師","交差点マスター"],["Shops beside crosswalks","斑馬線旁的商店","斑馬線隔籬嘅舖","横断歩道沿いの店"],["Tokyo tourists (best)","東京遊客（最高）","東京遊客（最高）","東京の観光客（最高）"],["Electric Town Hero","電器街英雄","電器街英雄","電気街のヒーロー"],["Gadgets made","製造的電子產品","整咗嘅電子產品","作ったガジェット"],["Fashion Icon","時尚偶像","潮人","ファッションアイコン"],["Clothes used by shops","商店用掉的服裝","啲舖用咗嘅衫","店で使った洋服"],["City Planner","城市規劃師","城市規劃師","都市プランナー"],["Yen earned in Tokyo","在東京賺到的日圓","喺東京賺到嘅日圓","東京で稼いだ円"],["Bay Builder","灣區建造者","灣區建造者","ベイエリアの建設者"],["Tokyo grown to 20×20","東京擴展到 20×20","東京擴到 20×20","東京を 20×20 に拡張"],["Tower Boss","高塔之主","高塔之主","タワーのボス"],["Tokyo Legend","東京傳奇","東京傳奇","東京の伝説"],["Other landmark artment","迷你公寓","劏房公寓","ワンルームアパート"],["Designer Loft","設計師閣樓","設計師 Loft","デザイナーズロフト"],["Riverside Condo","河畔大廈","河畔屋苑","リバーサイドマンション"],["Startup Loft","新創辦公室","初創辦公室","スタートアップオフィス"],["TV Studio","電視台","電視台","テレビ局"],["Office Tower","辦公大樓","商業大廈","オフィスタワー"],["Phone Booth","電話亭","電話亭","電話ボックス"],["Bicycle Rack","單車架","單車架","駐輪場"],["Lantern Post","燈籠柱","燈籠柱","ちょうちん柱"],["Street Mural","街頭壁畫","街頭壁畫","ストリート壁画"],["Corner Shrine","街角神社","街角神社","街角のほこら"],["Sakura Street Tree","櫻花行道樹","櫻花街樹","桜の街路樹"],["Metro Station","地鐵站","地鐵站","地下鉄駅"],["Offices","辦公室","寫字樓","オフィス"],["Rush hour! Shops near metro stations earn more for a while.","繁忙時間！地鐵站附近的商店暫時賺更多。","繁忙時間！地鐵站附近啲舖頭暫時賺多啲。","ラッシュアワー！駅の近くのお店がしばらく多く稼ぎます。"],["I'm supposed to be studying... but this yakitori is too good. One more stick, then I'll go home. Maybe.","我本來應該在讀書……但這串燒太好吃了。再吃一串就回家。大概吧。","我本來應該溫書……但啲串燒好好食。食多串就返屋企。可能啦。","本当は勉強しなきゃ……でもこの焼き鳥がおいしすぎる。あと一本で帰る。たぶん。"],["After work I come here for one drink. Then Ren starts playing and it becomes three drinks. Don't tell my boss.","下班後我來這裡喝一杯。然後阿蓮開始彈琴，就變成三杯。別告訴我老闆。","放工我嚟飲一杯。跟住阿蓮開始彈結他，就變咗三杯。唔好話俾我老細聽。","仕事のあと一杯だけ飲みに来る。でもレンが弾き始めると三杯になる。上司にはないしょ。"],["I come here to get ideas for my café menu. Today I learned you can put cheese on almost anything.","我來這裡為咖啡廳菜單找靈感。今天我學到：幾乎什麼都可以加芝士。","我嚟搵 Cafe 餐牌靈感。今日學到：差唔多乜都可以加芝士。","カフェのメニューのアイデアを探しに来るの。今日の発見：チーズはほとんど何にでも合う。"],["When I was young, this alley had a tiny bar run by a lady with a red umbrella. I'm happy it still feels the same.","我年輕時，這條小巷有一間小酒吧，老闆娘總拿著紅傘。很高興這裡感覺還是一樣。","我後生嗰陣，呢條巷有間細細嘅酒吧，老闆娘成日拎住把紅遮。好開心呢度感覺都仲係一樣。","若いころ、この横丁に赤い傘のママがやっている小さなバーがあったの。今も同じ空気でうれしいわ。"],["Small places like this are the best for music. Nobody is too cool to sing along after ten o'clock.","這種小地方最適合音樂。十點以後，沒有人會酷到不跟著唱。","呢啲細地方最啱玩音樂。過咗十點，冇人會扮型唔跟住唱。","音楽にはこういう小さな店が一番。十時を過ぎれば、みんな一緒に歌いだす。"],["I'm sketching the lanterns for my next collection. Red, orange and a little bit of smoke. Very Tokyo.","我在畫燈籠，為下一個系列找靈感。紅色、橙色，再加一點煙。很東京。","我喺度畫燈籠，幫下個系列搵靈感。紅色、橙色，再加少少煙。好東京。","次のコレクションのために提灯をスケッチ中。赤、オレンジ、少しの煙。とっても東京。"],["I'm testing my new game on the people here. The oden man beat my high score. Twice.","我在這裡讓大家試玩我的新遊戲。關東煮大叔打破了我的最高分。兩次。","我喺度俾大家試玩我隻新遊戲。關東煮大叔破咗我最高分。兩次。","ここのみんなに新作ゲームを試してもらってる。おでん屋のおじさんにハイスコアを抜かれた。二回も。"],["I deliver food all day, so it's nice when someone cooks for me. The grill master always adds an extra egg for me.","我整天送外賣，所以有人為我煮飯真好。燒烤師傅總是多給我一顆蛋。","我成日送外賣，所以有人煮俾我食真係好好。燒烤師傅成日加多隻蛋俾我。","一日中配達してるから、誰かが作ってくれるのはうれしい。焼き場の大将はいつも卵をおまけしてくれる。"],["My shift starts at midnight. I eat here first. The cook knows my order before I sit down.","我的班從午夜開始。我先在這裡吃飯。我還沒坐下，廚師就知道我要點什麼。","我半夜開工。我會先喺度食飯。我未坐低，師傅已經知我食乜。","夜中から勤務。その前にここで食べる。座る前に大将はもう注文をわかってる。"],["My manager says no fried food before a show. So I'm only looking at it. Very, very closely.","經紀人說表演前不能吃炸物。所以我只是看看。非常、非常仔細地看。","經理人話表演前唔食得炸嘢。所以我淨係睇。好近、好近咁睇。","マネージャーにライブ前の揚げ物は禁止って言われてる。だから見てるだけ。すごーく近くで。"],["I came to see the competition. The skewers are good. Not as good as my sushi, but good.","我來看看對手。串燒不錯。沒有我的壽司好，但不錯。","我嚟睇下對手。啲串燒唔錯。冇我啲壽司咁好，但係唔錯。","ライバルの偵察に来た。串はうまい。俺の寿司ほどじゃないが、うまい。"],["Every alley in Tokyo has a story. This one used to be next to the old tram line. You can still see the rail in the road.","東京每條小巷都有故事。這條以前在舊電車線旁邊。你還能在路上看到路軌。","東京每條巷都有故事。呢條以前喺舊電車線隔離。你仲見到路面啲路軌。","東京の横丁にはどれも物語がある。ここは昔の路面電車の線路沿いだった。道にまだレールが見えるだろう。"],["Nice chat!","聊得真開心！","傾得好開心！","楽しかった！"],["Black","黑色","黑色","ブラック"],["Chrome","鍍鉻","電鍍","クローム"],["🚗 Driving in town","🚗 在鎮上行駛中","🚗 喺鎮度揸緊","🚗 町を走行中"],["🅿️ Parked","🅿️ 已停泊","🅿️ 泊咗","🅿️ 駐車中"],["Drive in town","在鎮上行駛","出去揸","町を走らせる"],["Park it","停好","泊車","駐車する"],["Only 3 cars can drive at once. Park one first.","最多只能同時行駛 3 輛車。請先停好一輛。","最多同時揸 3 架車。請先泊好一架。","同時に走れるのは 3 台まで。先に 1 台停めてください。"],["I'm doing an internship at the city office now. My boss looked at our town plans and said, \"Who designed this? It's wonderful.\" I said, \"My mayor.\"","我現在在市政府實習。上司看到我們小鎮的規劃，說：「誰設計的？太棒了。」我說：「我的鎮長。」","我而家喺市政府實習。上司睇到我哋個鎮嘅規劃，話：「邊個設計㗎？好正。」我話：「我哋鎮長。」","今、市役所でインターンをしているの。上司が町の計画を見て「誰が設計したの？すばらしい」って。私は「うちの町長です」と答えた。"],["I graduated! Grandma Fumiko made me a bonsai, Yuki baked a cake, and Kenji cried more than my parents. I'm staying in Tokyo. This is home now.","我畢業了！文子婆婆送我一盆盆栽，小雪烤了蛋糕，健二哭得比我爸媽還厲害。我會留在東京。這裡現在是我的家。","我畢業喇！文子婆婆送咗盆盆栽俾我，小雪焗咗個蛋糕，健二喊得仲勁過我爸媽。我會留喺東京。呢度而家係我屋企。","卒業した！フミコおばあちゃんは盆栽、ユキはケーキ、ケンジは両親より泣いてた。東京に残るよ。ここが今の私の家。"],["I got promoted! Now I'm the boss. On my first day I told everyone to go home on time. Nobody knew what to do. They just stood there.","我升職了！現在我是老闆。第一天我叫大家準時下班。沒有人知道該怎麼辦，大家就站在那裡。","我升職喇！而家我係老細。第一日我叫大家準時放工。冇人知點算，個個企喺度。","昇進した！今は僕がボス。初日にみんなに定時で帰ろうと言った。誰もどうしていいかわからず、ただ立っていた。"],["I started a lunchtime choir at the office. Twelve tired workers singing in the stairwell. The echo is amazing. Please come to our first concert, Mayor!","我在公司組了午餐合唱團。十二個累壞的上班族在樓梯間唱歌。回音超棒。鎮長，請來我們的第一場音樂會！","我喺公司搞咗個午飯合唱團。十二個好攰嘅打工仔喺後樓梯唱歌。回音好正。鎮長，嚟睇我哋第一場音樂會啦！","会社でお昼の合唱団を始めた。疲れた社員十二人が階段で歌う。響きが最高なんだ。町長、初コンサートに来てください！"],["I hired my first worker. It's Hana! She makes terrible coffee but the customers love her. We're working on it.","我請了第一個員工。是小花！她煮的咖啡很難喝，但客人很喜歡她。我們正在努力。","我請咗第一個員工。係小花！佢沖嘅咖啡好難飲，但啲客好鍾意佢。我哋努力緊。","初めての店員を雇ったの。ハナよ！コーヒーはひどいけど、お客さんには大人気。練習中です。"],["I opened a second café, next to the metro station. Same cups, same hearts, same hope. Thank you for building this street with me.","我在地鐵站旁開了第二間咖啡廳。一樣的杯子、一樣的心、一樣的希望。謝謝你和我一起建造這條街。","我喺地鐵站隔離開咗第二間 Cafe。一樣嘅杯、一樣嘅心、一樣嘅希望。多謝你同我一齊起呢條街。","駅の隣に二号店を開いたの。同じカップ、同じハート、同じ希望。この通りを一緒に作ってくれてありがとう。"],["My old students came to visit. All twenty of them, at the same time. My tiny flat was full of grey hair and laughter.","我以前的學生來探我。二十個人一起來。我的小房子擠滿了白頭髮和笑聲。","我以前啲學生嚟探我。廿個人一齊嚟。我間細屋擠滿白頭髮同笑聲。","昔の教え子たちが会いに来たよ。二十人いっぺんに。小さな部屋が白髪と笑い声でいっぱい。"],["I'm teaching a free bonsai class every Sunday. The youngest student is six. The oldest is Professor Okada. He is the slowest. Don't tell him.","我每個星期日教免費盆栽班。最小的學生六歲。最老的是岡田教授。他最慢。別告訴他。","我逢星期日教免費盆栽班。最細嘅學生六歲。最老嘅係岡田教授。佢最慢。唔好話俾佢知。","毎週日、無料の盆栽教室をしてるの。一番若い生徒は六歳。一番年上は岡田教授。一番遅いのも彼。ないしょね。"],["I recorded my first real song in a real studio! It's about this street. There's a line about the vending machine. Kenji says it's his favourite part.","我在真正的錄音室錄了第一首歌！歌是關於這條街的。有一句寫自動販賣機。健二說那是他最喜歡的部分。","我喺真正嘅錄音室錄咗第一首歌！講呢條街嘅。有一句寫自動售賣機。健二話係佢最鍾意嗰段。","本物のスタジオで初めて曲を録音した！この通りの歌。自販機の歌詞もある。ケンジはそこが一番好きだって。"],["My song is playing in the konbini! I bought a rice ball just to hear it twice. Then I played a free show on the street stage for everyone.","便利店在播我的歌！我買了一個飯糰，只為了多聽一次。然後我在街頭舞台為大家免費表演。","便利店播緊我首歌！我買咗個飯糰，就係為咗聽多次。跟住我喺街頭舞台免費表演俾大家睇。","コンビニで僕の曲が流れてる！二回聴くためにおにぎりを買った。そのあと路上ステージでみんなに無料ライブをした。"],["A famous model wore my jacket on the giant screen. The whole crossing stopped to look. I fainted a little bit. Only a little.","一位名模在大螢幕上穿了我的外套。整個十字路口都停下來看。我暈了一點點。只有一點點。","一個名模喺大電視度著咗我件褸。成個十字路口停晒落嚟睇。我暈咗少少。真係少少。","有名モデルが大型ビジョンで私のジャケットを着てた。交差点のみんなが立ち止まった。ちょっと気絶した。ちょっとだけ。"],["I opened my own shop! The first customer was Grandma Fumiko. She bought the boldest dress I have. She says life is too short for beige.","我開了自己的店！第一位客人是文子婆婆。她買了我最大膽的裙子。她說人生太短，不要穿米色。","我開咗自己間舖！第一個客係文子婆婆。佢買咗我最大膽嗰條裙。佢話人生太短，唔好著米色。","自分の店を開いた！最初のお客さんはフミコおばあちゃん。一番派手なドレスを買ってくれた。「ベージュを着るには人生は短すぎる」って。"],["The ten-year-old girl from the arcade now tests all my games. She is very strict. She gave my new level two stars out of ten. I'm fixing it.","遊戲中心那個十歲女孩現在幫我測試所有遊戲。她很嚴格。她給我的新關卡十顆星只給兩顆。我在修改。","機舖嗰個十歲妹妹而家幫我試晒所有遊戲。佢好嚴。我個新關卡佢十粒星只俾兩粒。我改緊。","ゲーセンの十歳の女の子が今は全部のゲームをテストしてくれる。とても厳しい。新ステージは十点中二点。直してます。"],["My game won an award! I thanked my mum, the girl from the arcade and the Mayor. The town in my game looks a lot like ours. That's not an accident.","我的遊戲得獎了！我感謝了媽媽、遊戲中心的女孩和鎮長。我遊戲裡的小鎮很像我們的小鎮。這不是巧合。","我隻遊戲攞咗獎！我多謝咗阿媽、機舖嗰個妹妹同鎮長。我遊戲入面個鎮好似我哋個鎮。唔係巧合嚟㗎。","僕のゲームが賞を取った！母さんとゲーセンの女の子と町長にお礼を言った。ゲームの町はこの町にそっくり。偶然じゃないよ。"],["I passed my Japanese exam! Daichi made me a sushi plate shaped like a gold medal. I ate the medal. It was delicious.","我通過了日語考試！大地師傅做了一盤金牌形狀的壽司。我把金牌吃掉了。很好吃。","我日文試合格喇！大地師傅整咗碟金牌形嘅壽司。我食咗個金牌。好好味。","日本語の試験に合格した！大地さんが金メダルの形のお寿司を作ってくれた。メダルを食べた。おいしかった。"],["My family flew from Taiwan to visit. I showed them every shortcut, every shop and every neighbour. My dad said, \"You have a whole village here.\"","我的家人從台灣飛來探我。我帶他們看每條捷徑、每間店和每位鄰居。爸爸說：「你在這裡有一整條村。」","我屋企人由台灣飛嚟探我。我帶佢哋行晒每條捷徑、每間舖、每個街坊。我爸話：「你喺度有成條村。」","家族が台湾から会いに来た。近道もお店もご近所さんも全部案内した。父は「ここに村がまるごとあるね」と言った。"],["The grandmother from that night ride found me again. She brought old photos of Tokyo. Every corner I drive past has a story now.","那晚坐車的婆婆又找到我了。她帶來東京的舊照片。現在我開過的每個街角都有故事。","嗰晚搭我車嘅婆婆又搵到我。佢帶咗東京啲舊相嚟。而家我揸車經過每個街角都有故事。","あの夜のおばあさんがまた来てくれた。昔の東京の写真を持って。今は通る角すべてに物語がある。"],["I'm retiring next year. The whole street signed a card for me. On my last night shift, I'll drive slowly past every house. Just to say goodnight.","我明年退休。整條街都為我簽了卡。最後一個夜班，我會慢慢開過每一間房子。只為說聲晚安。","我明年退休。成條街都簽咗張卡俾我。最後一更夜班，我會慢慢揸過每間屋。淨係想講聲早唞。","来年引退する。通りのみんながカードに寄せ書きしてくれた。最後の夜勤では、一軒ずつゆっくり通るよ。おやすみを言うために。"],["Our group sang at the summer festival! The crowd waved lights, and Ren played guitar for our last song. I didn't smile too much. I smiled perfectly.","我們的組合在夏日祭唱歌了！觀眾揮著螢光棒，阿蓮為我們最後一首歌彈結他。我沒有笑太多。我笑得剛剛好。","我哋隊組合喺夏日祭唱歌喇！觀眾揮住螢光棒，阿蓮幫我哋最後一首歌彈結他。我冇笑得太多。我笑得啱啱好。","夏祭りでグループで歌った！みんながペンライトを振って、最後の曲はレンがギターを弾いてくれた。笑いすぎなかった。完璧な笑顔だった。"],["We sold out a real concert hall! Before the show I came back to the walking street and danced for free. This is where it all started.","我們在真正的音樂廳爆滿了！表演前我回到步行街免費跳舞。一切都是從這裡開始的。","我哋喺真正嘅音樂廳爆滿喇！表演前我返嚟行人街免費跳舞。一切都係由呢度開始。","本物のホールが満員になった！本番前に歩行者天国に戻って無料で踊った。全部ここから始まったから。"],["My food truck was on TV! Now there's a line every Sunday. Mei helps me. She still makes square onigiri, but now people ask for them.","我的餐車上電視了！現在每個星期日都有人排隊。小美來幫我。她做的飯糰還是方形的，但現在大家都指定要。","我架餐車上咗電視！而家逢星期日都有人排隊。小美幫我手。佢整嘅飯糰仲係四方，但而家啲人指明要。","キッチンカーがテレビに出た！今は毎週日曜に行列。メイが手伝ってくれる。おにぎりはまだ四角いけど、今はそれが人気。"],["I opened a tiny sushi counter. Only eight seats. The first eight guests were all my neighbours. Ten years of training, and this is the best night.","我開了一間小小的壽司吧台。只有八個座位。頭八位客人全是我的鄰居。十年修業，這是最棒的一晚。","我開咗間細細嘅壽司吧枱。得八個位。頭八個客全部係我街坊。十年修業，呢晚係最好嘅一晚。","小さな寿司カウンターを開いた。八席だけ。最初の八人は全員ご近所さん。修業十年、最高の夜だ。"],["Taro and I built a model of the metro loop. The tiny train runs on time, unlike me. The children call it the Okada Line.","我和太郎做了一個環狀地鐵的模型。小火車很準時，不像我。孩子們叫它「岡田線」。","我同太郎整咗個環線地鐵模型。細火車好準時，唔似我。啲細路叫佢做「岡田綫」。","タロウと地下鉄の環状線の模型を作った。小さな電車は時間通りに走る。私と違ってね。子どもたちは「岡田線」と呼んでいる。"],["The city asked me to give a talk about bridges. I was nervous for the first time in fifty years. Hana sat in the front row and asked the best question.","市政府請我講講橋樑。五十年來我第一次緊張。小花坐在第一排，問了最好的問題。","市政府請我講橋。五十年嚟我第一次緊張。小花坐喺第一行，問咗最好嘅問題。","市から橋について講演を頼まれた。五十年ぶりに緊張したよ。ハナが最前列で一番いい質問をしてくれた。"],["Hooray!","萬歲！","好嘢！","やったー！"],["Heart of Tokyo","東京之心","東京之心","東京のハート"],["Kobu's Dance","小武的舞蹈","小武嘅舞","コブのダンス"],["Tap Mayor Kobu 10 times.","點擊小武鎮長 10 次。","㩒小武鎮長 10 次。","コブ町長を 10 回タップ。"],["Kobu's Friend","小武的朋友","小武嘅朋友","コブの友だち"],["Someone in town loves to dance.","鎮上有人很愛跳舞。","鎮上有人好鍾意跳舞。","町に踊るのが大好きな人がいる。"],["Moon Rabbit","月兔","月兔","月のうさぎ"],["Tap the moon 5 times at night.","晚上點擊月亮 5 次。","夜晚㩒月亮 5 次。","夜に月を 5 回タップ。"],["Look up on a clear night.","在晴朗的夜晚抬頭看看。","晴朗嘅夜晚望上天。","晴れた夜に空を見上げて。"],["Lucky 11:11","幸運 11:11","幸運 11:11","ラッキー 11:11"],["Play at 11:11.","在 11:11 玩遊戲。","喺 11:11 玩。","11:11 にプレイする。"],["Make a wish at the right minute.","在對的那一分鐘許願。","喺啱嗰分鐘許願。","ちょうどいい一分に願いごとを。"],["Ghost Train","幽靈列車","鬼火車","幽霊電車"],["Tap the ghost train in Tokyo just after midnight.","午夜剛過時，在東京點擊幽靈列車。","啱啱過咗午夜，喺東京㩒鬼火車。","真夜中すぎの東京で幽霊電車をタップ。"],["Ghost Train Rider","幽靈列車乘客","鬼火車乘客","幽霊電車の乗客"],["Some trains run after the last train.","有些列車在尾班車之後才開。","有啲車喺尾班車之後先開。","終電のあとに走る電車もある。"],["UFO over Tokyo","東京上空的 UFO","東京上空嘅 UFO","東京上空の UFO"],["Spot the UFO on a Tokyo night.","在東京的夜晚找到 UFO。","喺東京夜晚搵到 UFO。","東京の夜に UFO を見つける。"],["UFO Spotter","UFO 觀察家","UFO 觀察家","UFO ウォッチャー"],["Not everything in the sky is a star.","天上的不一定都是星星。","天上面嘅唔一定係星。","空に見えるのは星だけじゃない。"],["Snow Monkeys","雪猴","雪猴","スノーモンキー"],["Visit an Onsen in winter.","冬天去溫泉看看。","冬天去溫泉睇下。","冬に温泉をのぞく。"],["Monkey Business","猴子搗蛋","馬騮搞事","おさるのいたずら"],["Some gues    The owner's Google account (checked by a SHA-256 hash of the email, so the email is not in the code) can open a
   TEST TOWN: a copy of the real town with unlimited resources and test tools. The test town never saves online,
   never touches the leaderboard, the lucky draw feed or friends, and is kept on this device under its own key.
   Leaving test mode puts the real town back exactly as it was. */
const ADMIN_HASHES=['e319a089fa591113d8751d01c35241f7f087389207f9d3137e4f498298bb3232'];
const TEST_KEY='komorebi-test-town';
let isAdmin=false,testMode=false,testReal=null,testFill=true,testWrap=null;
async function adminCheck(u){isAdmin=false;try{const e=(u&&u.email||'').trim().toLowerCase();if(e&&window.crypto&&crypto.subtle){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(e));
  const hx=[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');isAdmin=ADMIN_HASHES.includes(hx);}}catch(e){}
  if(!u&&testMode)testExit();updAdminUI();}
function updAdminUI(){const b=$('#testBanner');if(b)b.hidden=!testMode;document.body.classList.toggle('testmode',testMode);}
/* block every online write while testing */
function testBlockWrites(on){if(on){testWrap={};for(const o of [window.cloud,window.feed]){if(!o)continue;for(const k of Object.keys(o)){if(typeof o[k]==='function'&&/save|send|delete|clear|post|remove|add|gift/i.test(k)){testWrap[k+'@'+(o===window.cloud?'c':'f')]=[o,k,o[k]];o[k]=async()=>{};}}}}
  else if(testWrap){for(const k in testWrap){const [o,n,f]=testWrap[k];o[n]=f;}testWrap=null;}}
function testStart(fresh){if(!isAdmin||testMode)return;if(visiting)goHome();if(inTk)leaveTokyo(true);if(planning)endPlan(false);
  dirty=true;flush();testReal=JSON.stringify(cur());let t=null;if(!fresh){try{t=JSON.parse(localStorage.getItem(TEST_KEY)||'null');}catch(e){t=null;}}
  testMode=true;window.__test=1;window.__noBT=1;testBlockWrites(true);useTown(t&&t.v===1?t:JSON.parse(testReal));testTop();updAdminUI();toast('Test mode on. Nothing here is saved online.');}

/* the metro loop: a little train runs between your stations */
function drawMetro(n){if(!inTk)return;const st=metroOf();if(st.length<2)return;const Z=34,pts=st.map(b=>[b.x+.5,b.y+.5]);if(st.length>=3)pts.push(pts[0]);
  ctx.save();ctx.lineCap='round';for(let i=0;i<pts.length-1;i++){const a=P(pts[i][0],pts[i][1],Z),c=P(pts[i+1][0],pts[i+1][1],Z);
    ctx.strokeStyle='rgba(28,37,65,.5)';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(c[0],c[1]);ctx.stroke();ctx.strokeStyle='#c9ced4';ctx.lineWidth=3;ctx.stroke();
    const seg=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]);for(let k=1;k<seg;k+=1.6){const t=k/seg,x=pts[i][0]+(pts[i+1][0]-pts[i][0])*t,y=pts[i][1]+(pts[i+1][1]-pts[i][1])*t;ln(P(x,y,0),P(x,y,Z-1),'#9aa0a6',1.6);}}
  let L=0;const segs=[];for(let i=0;i<pts.length-1;i++){const l=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]);segs.push([pts[i],pts[i+1],l]);L+=l;}
  const at=s=>{s=((s%L)+L)%L;if(st.length<3){const back=s>L/2;s=back?L-s:s;}for(const [a,c,l] of segs){if(s<=l)return [a[0]+(c[0]-a[0])*s/l,a[1]+(c[1]-a[1])*s/l];s-=l;}return segs[segs.length-1][1];};
  const speed=rushOn()?1.6:1.1,head=n/1000*speed*(st.length<3?1:1);
  for(let k=0;k<3;k++){const a=at(head-k*.62),c=at(head-k*.62-.5),A=P(a[0],a[1],Z+3),C=P(c[0],c[1],Z+3);
    ctx.strokeStyle='#1c2541';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(C[0],C[1]);ctx.stroke();ctx.strokeStyle='#fbfbf8';ctx.lineWidth=7;ctx.stroke();
    ctx.strokeStyle='#2fb3a8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(A[0],A[1]+1.5);ctx.lineTo(C[0],C[1]+1.5);ctx.stroke();
    if(_dk>.3){const m=[(A[0]+C[0])/2,(A[1]+C[1])/2];light(m[0],m[1],12,'warm',.8);}}
  ctx.restore();}

      return '<li><span class="rk astars">'+'★'.repeat(k)+'<em>'+'☆'.repeat(3-k)+'</em></span><span class="who"><span class="nm">'+a.n+'</span><span class="tw">'+(k>=3?'Complete · '+ttlHTML(a.title):'<small>'+RAR[ttlR(a.title)]+' title at ★★★</small> '+bar(v,t)+a.d+' '+num(Math.min(v,t))+' / '+num(t)+' · '+ACH_KOBAN[k]+' koban')+'</span></span><span class="val">'+(achReady(a)?'<button class="btn mini primary" data-a="'+i+'">Claim</button>':'')+'</span></li>';}).join('')+'</ol>';}
  else{
    h='<ol class="board goals">'+PERKS.map((p,i)=>{const lv=S.perk[p.id]|0;return '<li><span class="rk">'+lv+'/'+p.max+'</span><span class="who"><span class="nm">'+p.n+'</span><span class="tw">'+p.d+(lv?' · now '+(p.id==='inc'?'+'+lv*5+'%':p.id==='tip'?TIP_H[lv]+'h':p.id==='kura'?'+'+num(lv*2000)+' goods':'+'+lv*2+' energy'):'')+'</span></span><span class="val">'+(lv>=p.max?'Max':'<button class="btn mini" data-p="'+i+'">'+perkCost(p)+' koban</button>')+'</span></li>';}).join('')+
      '<li><span class="rk">⚡</span><span class="who"><span class="nm">Full energy refill</span><span class="tw">Fill your energy to the top right now</span></span><span class="val"><button class="btn mini" id="gRefill">'+refillPrice()+' koban</button></span></li>'+
      Object.keys(DEFS).filter(k=>DEFS[k].tab==='treasure').map(k=>{const d=DEFS[k];return '<li><span class="rk">'+(ev(k)?'✓':'')+'</span><span class="who"><span class="nm">'+d.n+(d.w>1?' (2×2)':'')+'</span><span class="tw">Exclusive decoration · +'+d.appeal*3+' tourists</span></span><span class="val"><button class="btn mini" data-b="'+k+'">'+d.koban+' koban</button></span></li>';}).join('')+'</ol>';}
  body.innerHTML=h;
  body.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{claimDaily(+b.dataset.d);renderGoals(card);});
  const gb=body.querySelector('#gBonus');if(gb)gb.onclick=()=>{claimBonus();renderGoals(card);};
  body.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{claimAch(ACH[+b.dataset.a]);renderGoals(card);});
  if(goalsTab==='book')bookBind(body);
  if(goalsTab==='album')albumBind(body);if(goalsTab==='boutique')boutBind(body,card);
  if(goalsTab==='tokyo')tkGoalsBind(body);
  {const gl=body.querySelector('#gLogin');if(gl)gl.onclick=()=>{nextModal();openLogin();};}
  {const gv=body.querySelector('#gVip');if(gv)gv.onclick=()=>{claimVip();renderGoals(card);};}
  body.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{fillOrder(+b.dataset.o);renderGoals(card);});
  body.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{skipOrder(+b.dataset.k);renderGoals(card);});
  body.querySelectorAll('.tsel').forEach(b=>b.onclick=()=>{S.title=b.dataset.t;save();pushBoard();renderGoals(card);});
  body.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{buyPerk(PERKS[+b.dataset.p]);renderGoals(card);});
  const rf=body.querySelector('#gRefill');if(rf)rf.onclick=()=>{buyRefill();renderGoals(card);};
  body.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const d=DEFS[b.dataset.b];if(blocked(d))return;nextModal();closeDrawer();mode='build';sel=b.dataset.b;moving=null;removeSel=null;updChip();});}
function updGoalsBtn(){const n=goalsReady(),dot=$('#goalsDot');dot.hidden=!n;dot.textContent=n>9?'9+':n;}
$('#goalsBtn').onclick=()=>openGoals();
