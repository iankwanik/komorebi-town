<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Komorebi Town</title>
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* Layout: full-screen isometric town canvas; HUD + mayor quest card float top-left, action dock bottom-centre, trays rise above the dock */
:root{
  --ink:#1c2541; --ink-2:#4b5675; --paper:#fbfaf3; --paper-2:#e9efdc; --sky:#cfe5ec;
  --vermilion:#d6432b; --gold:#f0b429; --matcha:#6a9b42;
  --display:'Dela Gothic One','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  --body:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Yu Gothic',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);font-weight:500;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
canvas#sky{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#clockBtn{cursor:pointer;font:inherit;font-weight:800;font-size:13px;color:var(--ink)}
#clockBtn.night{background:#2b3566;color:#fff}
#clockBtn.night small{color:#c9d2f0}
.card .dn{position:absolute;top:10px;right:10px;display:flex;align-items:center;gap:2px;font-size:10px;font-weight:800;border-radius:6px;padding:1px 5px 1px 2px;background:#fff4c2;color:#7a4d00}
.card .dn svg{width:12px;height:12px}
.card .dn.night{background:#2b3566;color:#fff}
.dnbox svg{width:15px;height:15px;vertical-align:-3px}
.tab.seatab{color:var(--sc);background:#fff;box-shadow:inset 0 0 0 2px var(--sc)}
.tab.seatab.on{background:var(--sc);color:#fff}
.panel{background:var(--paper);border:2px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink)}
.btn{border:2px solid var(--ink);background:var(--paper);border-radius:10px;padding:7px 13px;font-weight:800;font-size:13px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
.btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--vermilion);color:#fff}
.btn.danger{background:#fff0ec;color:var(--vermilion)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

#top{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:flex-start;gap:8px;pointer-events:none;z-index:5}
#hud{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%}
#hud>*{pointer-events:auto}
.lvl{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px}
.lvl-num{width:34px;height:34px;border-radius:50%;background:var(--vermilion);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:15px;border:2px solid var(--ink)}
.xpbar{width:78px;height:8px;border-radius:6px;background:var(--paper-2);border:1.5px solid var(--ink);overflow:hidden}
.xpfill{height:100%;background:var(--matcha);width:0;transition:width .3s}
.xptxt{font-size:10.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-top:2px;font-weight:700}
.stat{display:flex;align-items:center;gap:5px;padding:5px 10px 5px 6px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat svg{width:22px;height:22px;flex:none}
.stat small{display:block;font-weight:700;font-size:9.5px;color:var(--ink-2)}
[hidden]{display:none!important}
.hud-right{margin-left:auto;display:flex;gap:6px;align-items:center}
#cloudBtn{display:flex;align-items:center;gap:6px;height:40px;box-sizing:border-box;padding:0 11px 0 8px;font-weight:800;font-size:12.5px;cursor:pointer;white-space:nowrap}
#cloudBtn svg{width:22px;height:22px;flex:none}
#cloudBtn.off{background:var(--gold)}
#cloudBtn.err{background:#ffe3dc}
#enBtn{cursor:pointer;font:inherit;font-weight:800;font-size:14px;color:var(--ink);position:relative}
#enBtn .plus{display:grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--matcha);color:#fff;font-size:12px;line-height:1;margin-left:2px}
#enBtn.pulse{animation:pulse .7s ease-out 2}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.14);background:#e9f5d8}100%{transform:scale(1)}}
#adCover{position:fixed;inset:0;z-index:50;background:rgba(28,37,65,.55);display:grid;place-items:center}
#adCover .panel{padding:14px 22px;font-weight:800}
.mcard .adnote{background:var(--paper-2);border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--ink)}
#goalsBtn{display:flex;align-items:center;gap:5px;height:40px;box-sizing:border-box;padding:0 11px 0 7px;font-weight:800;font-size:12.5px;cursor:pointer;position:relative}
#goalsBtn svg{width:22px;height:22px}
#goalsDot{position:absolute;top:-7px;right:-7px;min-width:18px;height:18px;border-radius:9px;background:var(--vermilion);color:#fff;font-size:10.5px;display:grid;place-items:center;border:2px solid var(--ink);padding:0 3px;box-sizing:border-box}
.kbal{display:inline-flex;align-items:center;gap:6px;background:#fff4c2;border:2px solid var(--ink);border-radius:999px;padding:3px 12px 3px 6px;font-weight:800;font-size:13px;margin:0 0 10px}
.kbal svg{width:20px;height:20px}
.gbar{display:inline-block;width:56px;height:6px;border-radius:4px;background:var(--paper-2);border:1px solid var(--ink);overflow:hidden;vertical-align:middle;margin-right:6px}
.gbar i{display:block;height:100%;background:var(--gold)}
.board.goals .tw{white-space:normal}
.board.goals li.bonus{background:#fff8e1}
.astars{font-family:var(--body)!important;font-size:11px!important;color:#c9971f!important;letter-spacing:-1px}
.astars em{font-style:normal;color:#c7c2b2}
.gnote{font-size:12.5px!important;margin:0 0 10px!important}
.gnote .tab{padding:3px 9px;font-size:11.5px;margin:2px}
#friendsBtn{width:40px;height:40px;display:grid;place-items:center;padding:0;cursor:pointer}
#friendsBtn svg{width:23px;height:23px}
#eventCard{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 8px;pointer-events:auto;background:#2b2238;color:#fbeedd;max-width:300px;box-sizing:border-box}
#eventCard #evIcon svg{width:38px;height:38px;display:block}
#eventCard .qlabel{color:#f0b46a}
#eventCard .evline{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
#eventCard .btn{margin-left:auto;padding:5px 11px;color:var(--ink);background:#f6c48a}
.tab.evtab{background:#2b2238;color:#f6c48a}
.tab.evtab.on{background:#7a4fb0;color:#fff}
.evnote{flex:none;width:96px;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:4px;border-radius:12px;background:#2b2238;color:#fbeedd;padding:8px;font-size:13px;line-height:1.3;text-align:center}
.evnote b{font-family:var(--display);font-weight:400;font-size:22px;color:#f6c48a}
.evnote small{font-size:10.5px;color:#d9c8e8}
.card .lim{position:absolute;top:10px;right:10px;background:#7a4fb0;color:#fff;font-size:10px;font-weight:800;border-radius:6px;padding:2px 6px}
.codebox{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 12px}
.codebox span{font-family:var(--display);font-size:24px;letter-spacing:.12em;background:var(--paper-2);border-radius:10px;padding:4px 12px;-webkit-user-select:all;user-select:all}
.field .row{display:flex;gap:8px}
.field .row input{flex:1;min-width:0;text-transform:uppercase;letter-spacing:.1em}
.btn.mini{padding:4px 9px;font-size:12px;box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:#fff;color:var(--ink-2)}
.btn:disabled{opacity:.55;cursor:default}
.acts{display:flex;gap:6px}
.board li[data-i]{cursor:pointer}
.board li[data-i]:hover{background:#f6f8ef}
#visitBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:7;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;width:min(540px,calc(100% - 20px));box-sizing:border-box}
#visitBar .vinfo{flex:1;min-width:0}
#visitBar .sstat{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#boardBtn{width:40px;height:40px;display:grid;place-items:center;padding:0;cursor:pointer}
#boardBtn svg{width:23px;height:23px}
.field{display:flex;flex-direction:column;gap:4px;text-align:left;margin:0 0 10px}
.field label{font-size:12px;font-weight:800;color:var(--ink-2)}
.field input{font:inherit;font-size:15px;font-weight:700;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:10px;padding:8px 10px;-webkit-user-select:text;user-select:text;box-sizing:border-box;width:100%}
.field input:focus{outline:3px solid var(--gold);outline-offset:1px}
.btabs{display:flex;gap:6px;justify-content:center;margin:0 0 10px;flex-wrap:wrap}
.board{list-style:none;margin:0 0 12px;padding:0;text-align:left;max-height:min(48vh,420px);overflow-y:auto;border:2px solid var(--ink);border-radius:12px;background:#fff}
.board li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--paper-2);font-size:13px}
.board li:last-child{border-bottom:0}
.board li.empty{display:block;text-align:center;color:var(--ink-2);padding:18px}
.board .rk{font-family:var(--display);font-size:14px;text-align:center;color:var(--ink-2)}
.board li:nth-child(1) .rk{color:#b8860b}.board li:nth-child(2) .rk{color:#7d8798}.board li:nth-child(3) .rk{color:#a0623a}
.board .who{min-width:0;display:flex;flex-direction:column}
.board .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .tw{font-size:11px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .val{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.board .val small{font-weight:700;color:var(--ink-2)}
.board li.me{background:#fff4d2}
#menuBtn{width:40px;height:40px;display:grid;place-items:center;padding:0;cursor:pointer}
#menuBtn svg{width:20px;height:20px}

#quest{display:flex;gap:10px;padding:10px 30px 10px 10px;max-width:300px;pointer-events:auto;position:relative}
.mayor svg{width:46px;height:46px;display:block}
.qbody{min-width:0}
.qlabel{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:800}
.qtitle{font-family:var(--display);font-size:14px;line-height:1.3;margin:2px 0 3px;text-wrap:balance}
.qhint{font-size:12px;color:var(--ink-2);line-height:1.45}
.qprog{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.qbar{flex:1;height:7px;border-radius:5px;background:var(--paper-2);border:1.5px solid var(--ink);overflow:hidden;min-width:60px}
#qFill{height:100%;background:var(--gold);width:0;transition:width .3s}
.qreward{font-size:11.5px;margin-top:4px;font-weight:700}
#qClaim{margin-top:8px}
#quest.min .qhint,#quest.min .qreward,#quest.min .qprog{display:none}
#qToggle{position:absolute;top:4px;right:4px;border:0;background:none;font-weight:800;cursor:pointer;font-size:16px;width:26px;height:26px;border-radius:8px}

#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:5px;z-index:6}
#dock button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:66px;padding:6px 8px;border-radius:10px;font-weight:800;font-size:12px;cursor:pointer}
#dock button svg{width:24px;height:24px}
#dock button[data-act=build]{background:var(--vermilion);color:#fff}
#dock button.on{background:var(--ink);color:var(--paper)}
#zoom{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:5}
#zoom button{width:42px;height:42px;font-size:20px;font-weight:800;cursor:pointer;padding:0;line-height:1}

.tray{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:7}
#drawer{width:min(700px,calc(100% - 20px));padding:10px;box-sizing:border-box}
.tabs{display:flex;gap:5px;overflow-x:auto;margin-bottom:8px;align-items:center}
.tab{border:0;background:var(--paper-2);border-radius:999px;padding:6px 13px;font-weight:800;font-size:12.5px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--ink);color:var(--paper)}
#drawerClose{margin-left:auto;border:0;background:none;font-size:20px;font-weight:800;cursor:pointer;width:32px;height:32px;flex:none}
.cards{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px}
.card{flex:none;width:112px;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:6px;display:flex;flex-direction:column;align-items:stretch;gap:2px;cursor:pointer;text-align:left;position:relative}
.card:hover{background:#fffdf3}
.card canvas{width:100%;height:80px;background:linear-gradient(#e3eff2,#f2f6ea);border-radius:8px;display:block}
.cname{font-weight:800;font-size:12px;line-height:1.2;margin-top:3px}
.cmeta{font-size:10.5px;color:var(--ink-2);line-height:1.3}
.ccost{font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums}
.card.locked{background:#f0f0ea}
.card.locked canvas{filter:grayscale(1) opacity(.55)}
.card .lock{position:absolute;top:10px;left:10px;background:var(--ink);color:#fff;font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 6px}
.card.poor .ccost{color:var(--vermilion)}

#chip{display:flex;align-items:center;gap:10px;padding:7px 7px 7px 14px;font-weight:700;font-size:13px;max-width:calc(100% - 20px);box-sizing:border-box}
#chip span{min-width:0}
#sheet{display:flex;gap:10px;align-items:center;padding:8px;width:min(460px,calc(100% - 20px));box-sizing:border-box}
#sheet canvas{width:72px;height:60px;border-radius:8px;background:linear-gradient(#e3eff2,#f2f6ea);flex:none}
.sbody{flex:1;min-width:0}
.stitle{font-family:var(--display);font-size:14px}
.sstat{font-size:12px;color:var(--ink-2);line-height:1.4;margin-top:1px}
.sbar{height:7px;border-radius:5px;background:var(--paper-2);border:1.5px solid var(--ink);overflow:hidden;margin-top:5px}
#sBar{height:100%;background:var(--matcha);width:0}
.sbtns{display:flex;flex-direction:column;gap:6px}
.sstars{font-size:12px;font-weight:800;color:#b8860b;margin-top:2px;font-variant-numeric:tabular-nums}
.sstars small{color:var(--ink-2);font-weight:700}
.btn.sup{margin-top:7px;padding:5px 10px;font-size:12px;white-space:normal;text-align:left;line-height:1.3}
.btn.sup.locked{background:var(--paper-2);color:var(--ink-2)}
.btn.sup.fin{background:#fff;color:var(--ink);margin-left:6px}
.evnote.koban{background:#5a4512}
.evnote.koban b{color:#f6d36a}
.sbtns .btn{padding:5px 10px;font-size:12px}

#toast{position:fixed;top:30%;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-weight:700;font-size:13px;z-index:20;max-width:calc(100% - 40px);text-align:center;pointer-events:none;box-shadow:3px 3px 0 rgba(28,37,65,.25)}
#modal{position:fixed;inset:0;background:rgba(28,37,65,.45);display:grid;place-items:center;z-index:30;padding:20px}
.mcard{max-width:370px;width:100%;padding:18px 18px 16px;text-align:center;box-sizing:border-box;max-height:calc(100vh - 60px);overflow:auto}
.mcard .big svg{width:72px;height:72px}
.mcard h2{font-family:var(--display);font-weight:400;font-size:21px;margin:6px 0 8px;text-wrap:balance}
.mcard p{font-size:13.5px;line-height:1.6;color:var(--ink-2);margin:0 0 10px}
.mcard ul{text-align:left;font-size:13px;line-height:1.55;color:var(--ink-2);padding-left:18px;margin:0 0 12px}
.mcard li{margin-bottom:4px}
.mcard .unlocks{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0 12px}
.mcard .unlocks span{background:var(--paper-2);border-radius:999px;padding:4px 10px;font-weight:800;font-size:12px}
.mbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.levelstamp{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--vermilion);color:#fff;font-family:var(--display);font-size:28px;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
@media (max-width:480px){
  #goalsBtn span{display:none}
  #goalsBtn{padding:0 9px}
  .stat{font-size:13px;padding:4px 8px 4px 5px}
  .stat svg{width:19px;height:19px}
  .xpbar{width:60px}
  #quest{max-width:240px}
  .qhint{font-size:11.5px}
  #dock button{min-width:58px;padding:5px 6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="game" aria-label="Town map"></canvas>

<div id="top">
  <div id="hud">
    <div class="panel lvl"><div class="lvl-num" id="lvlNum">1</div><div><div class="xpbar"><div class="xpfill" id="xpFill"></div></div><div class="xptxt" id="xpTxt">0 / 30 XP</div></div></div>
    <div class="panel stat" title="Yen"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f0b429" stroke="#1c2541" stroke-width="2"/><path d="M8.5 6.8l3.5 5 3.5-5M12 11.8v6.4M9 13h6M9 16h6" stroke="#1c2541" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg><span id="yen">0</span></div>
    <button class="panel stat" id="enBtn" title="Energy: tap for more"><svg viewBox="0 0 24 24"><path d="M12 3c2 0 9 11 9 14a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3c0-3 7-14 9-14z" fill="#fff" stroke="#1c2541" stroke-width="2" stroke-linejoin="round"/><rect x="8" y="13.5" width="8" height="6.5" rx="1" fill="#1c2541"/></svg><span><span id="en">0</span><small id="enT"></small></span><span class="plus" aria-hidden="true">+</span></button>
    <div class="panel stat" title="Goods"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="6" fill="#e2c27a" stroke="#1c2541" stroke-width="2"/><path d="M8 6.5v11M16 6.5v11" stroke="#1c2541" stroke-width="1.8"/></svg><span id="goods">0</span></div>
    <div class="panel stat" title="Tourists"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="12" rx="3" fill="#7fb8d0" stroke="#1c2541" stroke-width="2"/><path d="M8 7l1.5-2.5h5L16 7" fill="#7fb8d0" stroke="#1c2541" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" fill="#fff" stroke="#1c2541" stroke-width="2"/></svg><span id="tour">0</span></div>
    <div class="panel stat" title="Staff in use / residents"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2" fill="#f0cfae" stroke="#1c2541" stroke-width="2"/><path d="M3.5 20c0-4 2.5-6 5.5-6s5.5 2 5.5 6z" fill="#5d8f4c" stroke="#1c2541" stroke-width="2" stroke-linejoin="round"/><circle cx="16.5" cy="9" r="2.6" fill="#f0cfae" stroke="#1c2541" stroke-width="1.8"/><path d="M15 14.2c3.3-.4 5.6 1.6 5.6 5.8h-4" fill="#c8572f" stroke="#1c2541" stroke-width="1.8" stroke-linejoin="round"/></svg><span id="staff">0</span></div>
    <button class="panel stat" id="clockBtn" title="Season and time of day"><span id="clkIco"></span><span><span id="clkSea"></span><small id="clkNext"></small></span></button>

/* ---------- tap picking: bubbles first, then pixel-accurate hits, then smart priority ---------- */
let lastPT='mouse';
const HS=19,hitC=document.createElement('canvas');hitC.width=hitC.height=HS;const hitX=hitC.getContext('2d',{willReadFrequently:true});
const depthOf=b=>{const d=DEFS[b.type];return b.x+b.y+(d.w+d.h)/2;};

  return w[0]>=l[0]-pad&&w[0]<=r[0]+pad&&w[1]>=t[1]-Math.max(14,htOf(b))-24-pad&&w[1]<=bo[1]+pad;}
function opaqueAt(b,w){
  const tol=lastPT==='mouse'?3:9,k=cam.z,c=hitX,prev=ctx,n=Date.now();
  c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,HS,HS);c.setTransform(k,0,0,k,HS/2-w[0]*k,HS/2-w[1]*k);

  return false;}

  $('#lvlNum').textContent=S.lvl;$('#xpFill').style.width=(S.xp/need(S.lvl)*100)+'%';$('#xpTxt').textContent=num(S.xp)+' / '+num(need(S.lvl))+' XP';
  $('#yen').textContent='¥'+num(S.yen);$('#en').textContent=S.energy+'/'+maxE();
  $('#enT').textContent=S.energy<maxE()?'+1 in '+fmt(ER-(n-S.eT)/1000):'';
  $('#goods').textContent=num(S.goods);$('#tour').textContent=num(D.tourists);$('#staff').textContent=D.staff+'/'+D.res;}
function tickEnergy(n){const me=maxE();if(S.energy>=me){S.eT=n;return;}const k=Math.floor((n-S.eT)/(ER*1000));if(k>0){S.energy=Math.min(me,S.energy+k);S.eT+=k*ER*1000;if(S.energy>=me)S.eT=n;}}

const AD_MAX=5,AD_GAP=180000,AD_GAIN=5;
const ONIGIRI='<svg viewBox="0 0 24 24"><path d="M12 3c2 0 9 11 9 14a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3c0-3 7-14 9-14z" fill="#fff" stroke="#1c2541" stroke-width="2" stroke-linejoin="round"/><rect x="8" y="13.5" width="8" height="6.5" rx="1" fill="#1c2541"/></svg>';
const VIDEO_ICON='<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="vertical-align:-3px;margin-right:6px"><rect x="2.5" y="6" width="13" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 10.5l5-3v9l-5-3z" fill="currentColor"/></svg>';
let adBusy=false,adsOff='',gpOn=false;
function gp(on){if(!CG||gpOn===on)return;gpOn=on;try{on?CG.game.gameplayStart():CG.game.gameplayStop();}catch(e){}}
function adState(){if(!S.ads||S.ads.d!==today())S.ads={d:today(),n:0,last:0};return S.ads;}
const EBUY_MAX=3,EBUY_STEP=[4,6,9];
function avgCollect(){let s=0,c=0;for(const b of S.b){const d=DEFS[b.type];if(d.cat==='shop'&&nearRoad(b)){s+=baseEarn(b);c++;}}return c?s/c:30*S.lvl;}
function ebuyState(){if(!S.ebuy||S.ebuy.d!==today())S.ebuy={d:today(),n:0};return S.ebuy;}
function energyPrice(){const k=Math.min(ebuyState().n,EBUY_MAX-1);return Math.max(100*S.lvl,Math.round(avgCollect()*EBUY_STEP[k]/10)*10);}
function openEnergy(){
  if(visiting)return;
  const me=maxE(),a=adState(),wait=Math.max(0,AD_GAP-(Date.now()-a.last)),canAd=CG&&!adsOff&&a.n<AD_MAX&&wait<=0;
  let note='';
  if(CG){if(adsOff)note=adsOff;else if(a.n>=AD_MAX)note='You watched all '+AD_MAX+' ads for today. Come back tomorrow!';else if(wait>0)note='Next video in '+fmt(wait/1000)+'.';}
  const eb=ebuyState(),left=EBUY_MAX-eb.n;if(left<=0)note=(note?note+' ':'')+'You bought energy '+EBUY_MAX+' times today. The shop opens again tomorrow.';
  const btns=[{label:'No thanks'}];if(left>0)btns.push({label:'Buy '+AD_GAIN+' for ¥'+num(energyPrice()),fn:buyEnergy});
  if(canAd)btns.push({html:VIDEO_ICON+'Watch video: +'+AD_GAIN,fn:watchAd});
  modal('<div class="big">'+ONIGIRI+'</div><h2>Need more energy?</h2><p>You have <b>'+S.energy+' / '+me+'</b> energy. You get 1 back every '+ER+' seconds.</p>'+
    (CG?'<p>Watch a short video for <b>+'+AD_GAIN+' energy</b> ('+Math.max(0,AD_MAX-a.n)+' left today), or buy energy with yen.</p>':'<p>Buy <b>+'+AD_GAIN+' energy</b> with yen.</p>')+'<p style="font-size:12px">Energy shop: '+Math.max(0,left)+' of '+EBUY_MAX+' left today. Each buy costs more than the last.</p>'+
    (note?'<p class="adnote">'+note+'</p>':''),btns);}
function rewardFx(txt){toast(txt);const b=$('#enBtn');b.classList.remove('pulse');void b.offsetWidth;b.classList.add('pulse');}
function buyEnergy(){const eb=ebuyState();if(eb.n>=EBUY_MAX){toast('The energy shop is closed until tomorrow.');return;}const pr=energyPrice();if(S.yen<pr){toast('You need ¥'+num(pr-S.yen)+' more.');return;}S.yen-=pr;eb.n++;S.energy+=AD_GAIN;save();updHUD();rewardFx('+'+AD_GAIN+' energy!');}
function watchAd(){
  if(!CG||adBusy)return;const a=adState();if(a.n>=AD_MAX)return;
  adBusy=true;$('#adCover').hidden=false;gp(false);
  let settled=false;
  const done=(ok,err)=>{if(settled)return;settled=true;adBusy=false;$('#adCover').hidden=true;
    if(ok){a.n++;a.last=Date.now();S.energy+=AD_GAIN;save();updHUD();rewardFx('Thanks for watching! +'+AD_GAIN+' energy');}
    else if(err&&err.code==='unfilled')toast('No video is available right now. Please try again later.');
    else{adsOff='Videos are not available right now.';toast('The video could not play. No energy was used.');}
    if(!mOpen)gp(true);};
  try{CG.ad.requestAd('rewarded',{adStarted:()=>{},adFinished:()=>done(true),adError:e=>done(false,e)});}catch(e){done(false,{code:'other'});}}
$('#enBtn').onclick=openEnergy;

/* ---------- Tip Box: tourists drop tips over time. A full box holds about 20 minutes of active income, gives no XP and stops filling when full ---------- */
const TIP_H=[8,12,16];
const tipCapH=()=>TIP_H[Math.min(2,(S.perk&&S.perk.tip)|0)];
function tipFull(){return Math.max(100,Math.round(20*avgCollect()*tipCapH()/8));}
function tipFill(){const span=tipCapH()*3600e3;return clamp((Date.now()-(S.tipT||Date.now()))/span,0,1);}
function tipAmount(){return Math.floor(tipFill()*tipFull());}
function collectTips(){if(visiting)return 0;const a=tipAmount();if(a<1){toast('The Tip Box is empty. Tourists fill it over time.');return 0;}
  S.yen+=a;S.tipT=Date.now();S.c.tips=(S.c.tips||0)+a;const tb=S.b.find(b=>b.type==='tipbox');if(tb)float(tb,'+¥'+num(a),'#a87407');save();updHUD();toast('Collected ¥'+num(a)+' in tips!');return a;}
/* puts the Tip Box on a free tile beside a road, as close to the front of town as possible */
function ensureTipBox(o){if(o.b.some(b=>b.type==='tipbox'))return;const sz=o.size||10,of=(MAP-sz)/2,used=new Set();
  for(const b of o.b){const d=DEFS[b.type];if(!d)continue;for(let i=0;i<d.w;i++)for(let j=0;j<d.h;j++)used.add((b.y+j)*MAP+b.x+i);}
  const R=(x,y)=>x>=0&&y>=0&&x<MAP&&y<MAP&&o.roads[y*MAP+x]===1;let best=null,bs=-1e9;
  for(let y=of;y<of+sz;y++)for(let x=of;x<of+sz;x++){const k=y*MAP+x;if(used.has(k)||o.roads[k])continue;const sc=((R(x+1,y)||R(x-1,y)||R(x,y+1)||R(x,y-1))?1000:0)+x+y;if(sc>bs){bs=sc;best=[x,y];}}
  if(best)o.b.push({id:(o.nid=(o.nid||1)+1)-1,type:'tipbox',x:best[0],y:best[1]});}
/* ---------- day and night bonus ---------- */

const SUN_SVG='<svg viewBox="0 0 24 24"><path d="M12 1.8v3M12 19.2v3M1.8 12h3M19.2 12h3M4.8 4.8l2.1 2.1M17.1 17.1l2.1 2.1M4.8 19.2l2.1-2.1M17.1 6.9l2.1-2.1" stroke="#1c2541" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="5" fill="#f6c343" stroke="#1c2541" stroke-width="1.8"/></svg>';

 spring:'<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="23" fill="#fde9ee"/><g fill="#f4a9bd" stroke="#1c2541" stroke-width="1.5">'+[0,72,144,216,288].map(a=>'<ellipse cx="24" cy="13.5" rx="5.6" ry="8" transform="rotate('+a+' 24 24)"/>').join('')+'</g><circle cx="24" cy="24" r="4.2" fill="#f6d36a" stroke="#1c2541" stroke-width="1.4"/></svg>',

/* ---------- welcome back ---------- */
const SEEN_KEY='komorebi-seen';let hiddenAt=0;
function markSeen(){try{localStorage.setItem(SEEN_KEY,String(Date.now()));}catch(e){}}
function lastSeen(){try{return +localStorage.getItem(SEEN_KEY)||0;}catch(e){return 0;}}
function readyCounts(){let crops=0,shops=0,stock=0,homes=0;const n=Date.now();
  for(const b of S.b){const d=DEFS[b.type];if(d.cat==='farm'&&b.st!=='empty'&&prog(b,n)>=1)crops++;else if(d.cat==='shop'&&nearRoad(b)){if(b.st==='idle')stock++;else if(prog(b,n)>=1)shops++;}else if(d.cat==='home'&&nearRoad(b)&&prog(b,n)>=1)homes++;}
  return{crops,shops,stock,homes};}
function welcomeBack(away){if(visiting||away<AWAY_MIN)return;const a=tipAmount(),r=readyCounts(),hrs=Math.min(away,tipCapH()*3600e3)/3600e3,vis=Math.round(D.tourists*hrs*.6),pl=(n,w)=>n+' '+w+(n===1?'':'s');
  const ls=[];if(r.crops)ls.push(pl(r.crops,'crop')+' to harvest');if(r.shops)ls.push(pl(r.shops,'shop')+' to collect');if(r.homes)ls.push(pl(r.homes,'home')+' with rent');if(r.stock)ls.push(pl(r.stock,'shop')+' need goods');
  modal('<div class="big">'+TANUKI+'</div><h2>Welcome back'+(S.name?', Mayor '+esc(S.name):'')+'!</h2><p>You were away for <b>'+fmt(away/1000)+'</b>. About <b>'+num(vis)+'</b> tourists visited and left <b>¥'+num(a)+'</b> in your Tip Box'+(tipFill()>=1?' (it is full)':'')+'.</p>'+(ls.length?'<p class="adnote">'+ls.join(' · ')+'</p>':''),
    a>=1?[{label:'Later'},{label:'Collect ¥'+num(a),cls:'primary',fn:()=>{collectTips();}}]:[{label:'OK',cls:'primary'}]);}
setInterval(()=>{if(!document.hidden)markSeen();},15000);
addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();markSeen();}else if(hiddenAt){const away=Date.now()-hiddenAt;hiddenAt=0;if(away>=AWAY_MIN)welcomeBack(away);}});
/* ---------- stars on the map: a small award sign, and farm fences that grow with each star ---------- */
function star5(px,py,r,col,st){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;ctx.lineTo(px+Math.cos(a)*rr,py+Math.sin(a)*rr);}ctx.closePath();ctx.fillStyle=col;ctx.fill();if(st){ctx.strokeStyle=st;ctx.lineWidth=.6;ctx.stroke();}}
function starPath(px,py,r){for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r,X=px+Math.cos(a)*rr,Y=py+Math.sin(a)*rr;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}ctx.closePath();}
function starPlaque(b,k){const d=DEFS[b.type],x=b.x+d.w-.1,y=b.y+d.h-.1,g=P(x,y,0),p=P(x,y,10),w=3+k*4.2;ln(g,[p[0],p[1]+.6],'#5a391f',1.3);
  ctx.fillStyle=k===3?'#2b2b2e':'#6b4426';ctx.fillRect(p[0]-w/2,p[1]-4.4,w,5);if(!LOW){ctx.strokeStyle=k===3?GOLD:'rgba(28,37,65,.6)';ctx.lineWidth=.7;ctx.strokeRect(p[0]-w/2,p[1]-4.4,w,5);}
  ctx.beginPath();for(let i=0;i<k;i++)starPath(p[0]-w/2+3.6+i*4.2,p[1]-1.9,1.8);ctx.fillStyle='#f6d36a';ctx.fill();}
function fenceRun(x0,y0,x1,y1,col,h,n){ctx.beginPath();for(let i=0;i<=n;i++){const t=i/n,a=P(x0+(x1-x0)*t,y0+(y1-y0)*t,0),c=P(x0+(x1-x0)*t,y0+(y1-y0)*t,h);ctx.moveTo(a[0],a[1]);ctx.lineTo(c[0],c[1]);}
  ctx.strokeStyle=col;ctx.lineWidth=1.6;ctx.lineCap='round';ctx.stroke();ctx.beginPath();for(const f of [.72,.32]){const a=P(x0,y0,h*f),c=P(x1,y1,h*f);ctx.moveTo(a[0],a[1]);ctx.lineTo(c[0],c[1]);}ctx.strokeStyle=shade(col,.82);ctx.lineWidth=1.1;ctx.stroke();}
function stoneRun(x0,y0,x1,y1){const n=4;for(let i=0;i<n;i++){const t=i/n,t2=(i+.85)/n;box(x0+(x1-x0)*t-.035,y0+(y1-y0)*t-.035,(x1-x0)*(t2-t)+.07,(y1-y0)*(t2-t)+.07,0,3.4,i%2?'#bdb6a8':'#cfc8ba');}}
function farmStarsBack(b,k,n){const x=b.x,y=b.y,c=k===2?'#a8713d':'#c9a66a';
  if(k===3){stoneRun(x+.01,y+.01,x+.99,y+.01);stoneRun(x+.01,y+.01,x+.01,y+.99);for(const [a,c2] of [[.08,.08]]){const q=[x+a,y+c2];box(q[0]-.05,q[1]-.05,.1,.1,3.4,6,'#9d988e');const lp=P(q[0],q[1],10);ell(lp[0],lp[1],2.2,1.8,'#ffd27a','#8a6a1a');light(lp[0],lp[1],12,'gold');}}
  else{fenceRun(x+.02,y+.02,x+.98,y+.02,c,6,4);fenceRun(x+.02,y+.02,x+.02,y+.98,c,6,4);}}
function farmStarsFront(b,k,n){const x=b.x,y=b.y;if(k===1)return;
  if(k===3){stoneRun(x+.99,y+.01,x+.99,y+.99);stoneRun(x+.01,y+.99,x+.99,y+.99);twinkle(x+.3,y+.6,10,n,b.id*.37);twinkle(x+.7,y+.3,14,n,b.id*.37+.5);}
  else{fenceRun(x+.98,y+.02,x+.98,y+.98,'#a8713d',5,4);fenceRun(x+.02,y+.98,x+.98,y+.98,'#a8713d',5,4);
    for(const [a,c] of [[.98,.98]]){const p=P(x+a,y+c,6);ell(p[0],p[1],2.2,1.6,'#f0b429',false);ell(p[0]-1.6,p[1]+.6,1.6,1.2,'#e0789a',false);}}}
/* Upgrade mode: every building shows its stars and level; a green arrow means an upgrade is ready */
const starable=d=>d.cat==='farm'||d.cat==='shop'||d.cat==='home';
function canUp(b){const c=upCost(b);return !!c&&bStars(b)>=c.need&&S.yen>=c.yen&&S.goods>=c.goods;}
function upArrow(px,py,s){ctx.save();ctx.translate(px,py);ctx.scale(s,s);ctx.beginPath();ctx.arc(0,0,7,0,6.283);ctx.fillStyle='#5aa646';ctx.fill();ctx.strokeStyle='#1c2541';ctx.lineWidth=1.4;ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,-4.2);ctx.lineTo(3.6,0);ctx.lineTo(1.4,0);ctx.lineTo(1.4,3.8);ctx.lineTo(-1.4,3.8);ctx.lineTo(-1.4,0);ctx.lineTo(-3.6,0);ctx.closePath();ctx.fillStyle='#fff';ctx.fill();ctx.restore();}
function drawUpgradeView(s){for(const b of S.b){const d=DEFS[b.type];if(!starable(d))continue;const k=bStars(b),L=lvOf(b),shop=d.cat!=='farm',p=P(b.x+d.w/2,b.y+d.h/2,htOf(b)+14+((b.x+b.y)%2)*13);
  ctx.save();ctx.translate(p[0],p[1]);ctx.scale(s,s);const w=30;
  ctx.fillStyle='rgba(28,37,65,.85)';ctx.beginPath();ctx.roundRect?ctx.roundRect(-w/2,-6.5,w,11,5.5):ctx.rect(-w/2,-6.5,w,11);ctx.fill();
  ctx.beginPath();for(let i=0;i<k;i++)starPath(-w/2+6+i*9,-1,3.3);ctx.fillStyle='#f6d36a';ctx.fill();
  ctx.beginPath();for(let i=k;i<3;i++)starPath(-w/2+6+i*9,-1,3.3);ctx.fillStyle='rgba(255,255,255,.3)';ctx.fill();
  if(shop){ctx.beginPath();ctx.arc(w/2+4,-1,6.5,0,6.283);ctx.fillStyle=L===3?'#e2b53a':'#ffffff';ctx.fill();ctx.strokeStyle='#1c2541';ctx.lineWidth=1.3;ctx.stroke();
    ctx.fillStyle='#1c2541';ctx.font='800 8px "M PLUS Rounded 1c",system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(String(L),w/2+4,2);}
  ctx.restore();const c=upCost(b);if(c&&k>=c.need)upArrow(p[0]+(shop?w/2+15:w/2+6)*s,p[1]-1*s,s*.75);}}

function normExtra(o){const now=Date.now();if(!o.tipT||o.tipT>now+60000)o.tipT=now;o.perk.tip=o.perk.tip|0;
  if(o.mast&&!o.mastMig){for(const t in o.mast){const fs=o.b.filter(b=>b.type===t);if(!fs.length)continue;const per=Math.min(60,Math.floor(o.mast[t]/fs.length));for(const f of fs)if(!f.cnt)f.cnt=per;}o.mastMig=1;
    let mx=0,f3=0;for(const f of o.b){if(DEFS[f.type].cat!=='farm')continue;const k=starsOf(f.cnt||0,STAR_B);mx=Math.max(mx,k);if(k===3)f3++;}o.c.fstars=Math.max(o.c.fstars||0,mx);o.c.f3=Math.max(o.c.f3||0,f3);}
  ensureTipBox(o);}
$('#clockBtn').onclick=openClock;
/* ---------- Goals: daily missions, lifetime achievements and the Treasure shop (all pay out koban) ---------- */
const ACH=[
 {id:'harvest',n:'Green Thumb',d:'Harvest crops',v:()=>S.c.harvest||0,t:[50,250,1000],title:'Rice Master'},
 {id:'collect',n:'Shopkeeper',d:'Collect from shops',v:()=>S.c.collect||0,t:[50,250,1000],title:'Shop Tycoon'},
 {id:'rent',n:'Landlord',d:'Collect rent',v:()=>S.c.rent||0,t:[50,250,1000],title:'Landlord'},
 {id:'tour',n:'Tourist Magnet',d:'Welcome tourists at once',v:()=>S.c.maxTour||0,t:[500,1500,3000],title:'Tourist Magnet'},
 {id:'build',n:'Master Builder',d:'Build buildings',v:()=>builtTotal(),t:[25,75,150],title:'Master Builder'},
 {id:'earn',n:'Millionaire',d:'Earn yen from shops and rent',v:()=>S.c.earned||0,t:[50000,500000,5000000],title:'Millionaire'},
 {id:'upg',n:'Craftsman',d:'Upgrade buildings',v:()=>S.c.upg||0,t:[1,10,25],title:'Craftsman'},
 {id:'stars',n:'Star Mayor',d:'Buildings reaching ★★★',v:()=>S.c.s3||0,t:[1,5,15],title:'Star Mayor'},
 {id:'mast',n:'Harvest Sage',d:'Farms at ★★★',v:()=>S.c.f3||0,t:[1,3,8],title:'Harvest Sage'},
 {id:'daily',n:'Diligent Mayor',d:'Complete daily missions',v:()=>S.c.daily||0,t:[5,25,100],title:'Diligent Mayor'},
 {id:'help',n:'Good Neighbour',d:'Help friends',v:()=>S.c.help||0,t:[1,10,50],title:'Good Neighbour'},
 {id:'land',n:'Land Baron',d:'Expand your land',v:()=>S.c.expand||0,t:[1,2,4],title:'Land Baron'},
 {id:'level',n:'Veteran Mayor',d:'Reach level',v:()=>S.lvl,t:[5,10,15],title:'Veteran Mayor'},
 {id:'lm',n:'Monument Maker',d:'Build landmarks',v:()=>Object.keys(DEFS).filter(k=>DEFS[k].lm).reduce((a,k)=>a+ev(k),0),t:[1,2,4],title:'Monument Maker'},
 {id:'sea',n:'Four Seasons',d:'Build seasonal decorations',v:()=>Object.keys(DEFS).filter(k=>DEFS[k].season&&DEFS[k].cat==='decor').reduce((a,k)=>a+ev(k),0),t:[1,4,8],title:'Season Keeper'},
];
const ACH_KOBAN=[2,5,10];
const achTier=a=>S.ach[a.id]|0;
const achReady=a=>{const k=achTier(a);return k<3&&a.v()>=a.t[k];};

/* daily missions: 3 a day, picked from this pool by date, with targets that grow with your level */
const DPOOL=[
 {id:'harvest',k:'harvest',n:t=>'Harvest '+t+' crops',t:l=>6+l},
 {id:'collect',k:'collect',n:t=>'Collect from shops '+t+' times',t:l=>4+Math.ceil(l/2)},
 {id:'rent',k:'rent',n:t=>'Collect rent '+t+' times',t:l=>3+Math.ceil(l/3)},
 {id:'supply',k:'supply',n:t=>'Stock shops with goods '+t+' times',t:l=>3+Math.ceil(l/3)},
 {id:'plant',k:'plant',n:t=>'Plant '+t+' crops',t:l=>6+l},
 {id:'build',k:'builtT',n:t=>'Build '+t+' new buildings',t:()=>3},
 {id:'earn',k:'earned',n:t=>'Earn ¥'+num(t)+' from shops and rent',t:()=>Math.max(300,Math.round(avgCollect()*12/100)*100)},
 {id:'help',k:'help',n:()=>'Help a friend in their town',t:()=>1,ok:()=>!!cloudUser},
 {id:'dnb',k:'dnb',n:t=>'Collect '+t+' shops during their day or night bonus',t:()=>3,ok:()=>S.b.some(b=>DEFS[b.type].dn&&nearRoad(b))},
 {id:'upg',k:'upg',n:()=>'Upgrade a building',t:()=>1,ok:()=>S.lvl>=4&&S.b.some(b=>bStars(b)>=lvOf(b)&&upCost(b))},
];
const cval=k=>k==='builtT'?builtTotal():(S.c[k]||0);
function dayKey(off){const d=new Date();d.setDate(d.getDate()+(off||0));return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function newDaily(){
  const key=today();let seed=0;for(const ch of key)seed=(seed*31+ch.charCodeAt(0))%1000003;
  const pool=DPOOL.filter(m=>!m.ok||m.ok());const ids=[];
  while(ids.length<3&&ids.length<pool.length){seed=(seed*9301+49297)%233280;const m=pool[Math.floor(seed/233280*pool.length)];if(!ids.includes(m.id))ids.push(m.id);}
  const ms=ids.map(id=>DPOOL.find(m=>m.id===id));
  S.daily={d:key,ids,t:ms.map(m=>m.t(S.lvl)),base:ms.map(m=>cval(m.k)),claimed:[false,false,false],bonus:false};}
function dailyNow(){if(!S.daily||S.daily.d!==today())newDaily();return S.daily;}
function dProg(i){const dl=dailyNow(),m=DPOOL.find(q=>q.id===dl.ids[i]);return Math.max(0,cval(m.k)-dl.base[i]);}
function goalsReady(){if(visiting)return 0;const dl=dailyNow();let c=0;
  dl.ids.forEach((id,i)=>{if(!dl.claimed[i]&&dProg(i)>=dl.t[i])c++;});if(!dl.bonus&&dl.claimed.every(Boolean))c++;
  return c+ACH.filter(achReady).length;}
function giveKoban(k,why){S.koban+=k;toast('+'+k+' koban · '+why);}
function claimDaily(i){const dl=dailyNow();if(dl.claimed[i]||dProg(i)<dl.t[i])return;dl.claimed[i]=true;S.c.daily=(S.c.daily||0)+1;S.energy+=5;giveKoban(1,'mission complete, +5 energy');save();}
function claimBonus(){const dl=dailyNow();if(dl.bonus||!dl.claimed.every(Boolean))return;dl.bonus=true;
  const st=S.streak||{n:0,last:''};st.n=st.last===dayKey(-1)?st.n+1:1;st.last=today();S.streak=st;
  let k=3,why='all daily missions done';if(st.n%7===0){k+=10;why='7-day streak!';}giveKoban(k,why);save();}
function claimAch(a){const k=achTier(a);if(k>=3||a.v()<a.t[k])return;S.ach[a.id]=k+1;let why=a.n+' '+'★'.repeat(k+1);
  if(k+1===3&&!S.titles.includes(a.title)){S.titles.push(a.title);if(!S.title)S.title=a.title;why+=' · new title: '+a.title;}
  giveKoban(ACH_KOBAN[k],why);save();}
/* treasure shop perks */
const PERKS=[
 {id:'inc',n:'Lucky Charm',d:'+5% income from every shop and home',cost:12,max:5},
 {id:'en',n:'Bigger Lunchbox',d:'+2 maximum energy',cost:8,max:5},
 {id:'tip',n:'Bigger Tip Box',d:'Holds more hours of tips: 8h, then 12h, then 16h',cost:[10,20],max:2},
];
const perkCost=p=>Array.isArray(p.cost)?p.cost[Math.min(S.perk[p.id]|0,p.cost.length-1)]:p.cost;
function buyPerk(p){const lv=S.perk[p.id]|0;if(lv>=p.max)return;const pc=perkCost(p);if(S.koban<pc){toast('You need '+(pc-S.koban)+' more koban.');return;}S.koban-=pc;S.perk[p.id]=lv+1;recompute();save();toast(p.n+' level '+(lv+1)+'!');}
function buyRefill(){if(S.koban<3){toast('You need '+(3-S.koban)+' more koban.');return;}if(S.energy>=maxE()){toast('Your energy is already full.');return;}S.koban-=3;S.energy=maxE();save();rewardFx('Energy refilled!');}

let goalsTab='daily';
function openGoals(tabName){if(visiting)return;if(tabName)goalsTab=tabName;
  modal('<h2>Mayor\'s Goals</h2><div class="kbal">'+KOBAN+'<b id="gKoban">'+S.koban+'</b> koban</div><div class="btabs" id="gTabs"><button class="tab" data-g="daily">Daily</button><button class="tab" data-g="ach">Achievements</button><button class="tab" data-g="shop">Treasure</button></div><div id="gBody"></div>',
    [{label:'Close',cls:'primary'}],card=>{card.querySelectorAll('#gTabs .tab').forEach(t=>t.onclick=()=>{goalsTab=t.dataset.g;renderGoals(card);});renderGoals(card);});}
function renderGoals(card){const body=card.querySelector('#gBody');if(!body)return;
  card.querySelectorAll('#gTabs .tab').forEach(t=>t.classList.toggle('on',t.dataset.g===goalsTab));card.querySelector('#gKoban').textContent=S.koban;
  const bar=(v,t)=>'<span class="gbar"><i style="width:'+Math.min(100,v/t*100)+'%"></i></span>';
  let h='';
  if(goalsTab==='daily'){const dl=dailyNow(),st=S.streak||{n:0,last:''},left=(new Date(new Date().setHours(24,0,0,0))-new Date())/1000;
    h='<ol class="board goals">'+dl.ids.map((id,i)=>{const m=DPOOL.find(q=>q.id===id),v=Math.min(dProg(i),dl.t[i]),done=v>=dl.t[i];
      return '<li><span class="rk">'+(i+1)+'</span><span class="who"><span class="nm">'+m.n(dl.t[i])+'</span><span class="tw">'+bar(v,dl.t[i])+num(v)+' / '+num(dl.t[i])+' · 1 koban + 5 energy</span></span><span class="val">'+(dl.claimed[i]?'Done':done?'<button class="btn mini primary" data-d="'+i+'">Claim</button>':'')+'</span></li>';}).join('')+
      '<li class="bonus"><span class="rk">★</span><span class="who"><span class="nm">Finish all 3 missions</span><span class="tw">3 koban · 7-day streak gives +10 more</span></span><span class="val">'+(dl.bonus?'Done':dl.claimed.every(Boolean)?'<button class="btn mini primary" id="gBonus">Claim</button>':'')+'</span></li></ol>'+
      '<p class="gnote">Streak: <b>'+(st.last===today()||st.last===dayKey(-1)?st.n:0)+' days</b> · New missions in '+fmt(left)+'</p>';}
  else if(goalsTab==='ach'){
    h=(S.titles.length?'<p class="gnote">Your title: '+S.titles.map(t=>'<button class="tab tsel'+(t===S.title?' on':'')+'" data-t="'+esc(t)+'">'+esc(t)+'</button>').join(' ')+'</p>':'<p class="gnote">Complete an achievement to ★★★ to earn a title for the leaderboard.</p>')+
      '<ol class="board goals">'+ACH.map((a,i)=>{const k=achTier(a),v=a.v(),t=a.t[Math.min(k,2)];
      return '<li><span class="rk astars">'+'★'.repeat(k)+'<em>'+'☆'.repeat(3-k)+'</em></span><span class="who"><span class="nm">'+a.n+'</span><span class="tw">'+(k>=3?'Complete · title: '+a.title:bar(v,t)+a.d+' '+num(Math.min(v,t))+' / '+num(t)+' · '+ACH_KOBAN[k]+' koban')+'</span></span><span class="val">'+(achReady(a)?'<button class="btn mini primary" data-a="'+i+'">Claim</button>':'')+'</span></li>';}).join('')+'</ol>';}
  else{
    h='<ol class="board goals">'+PERKS.map((p,i)=>{const lv=S.perk[p.id]|0;return '<li><span class="rk">'+lv+'/'+p.max+'</span><span class="who"><span class="nm">'+p.n+'</span><span class="tw">'+p.d+(lv?' · now '+(p.id==='inc'?'+'+lv*5+'%':p.id==='tip'?TIP_H[lv]+'h':'+'+lv*2+' energy'):'')+'</span></span><span class="val">'+(lv>=p.max?'Max':'<button class="btn mini" data-p="'+i+'">'+perkCost(p)+' koban</button>')+'</span></li>';}).join('')+
      '<li><span class="rk">⚡</span><span class="who"><span class="nm">Full energy refill</span><span class="tw">Fill your energy to the top right now</span></span><span class="val"><button class="btn mini" id="gRefill">3 koban</button></span></li>'+
      Object.keys(DEFS).filter(k=>DEFS[k].tab==='treasure').map(k=>{const d=DEFS[k];return '<li><span class="rk">'+(ev(k)?'✓':'')+'</span><span class="who"><span class="nm">'+d.n+(d.w>1?' (2×2)':'')+'</span><span class="tw">Exclusive decoration · +'+d.appeal*3+' tourists</span></span><span class="val"><button class="btn mini" data-b="'+k+'">'+d.koban+' koban</button></span></li>';}).join('')+'</ol>';}
  body.innerHTML=h;
  body.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{claimDaily(+b.dataset.d);renderGoals(card);});
  const gb=body.querySelector('#gBonus');if(gb)gb.onclick=()=>{claimBonus();renderGoals(card);};
  body.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{claimAch(ACH[+b.dataset.a]);renderGoals(card);});
  body.querySelectorAll('.tsel').forEach(b=>b.onclick=()=>{S.title=b.dataset.t;save();pushBoard();renderGoals(card);});
  body.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{buyPerk(PERKS[+b.dataset.p]);renderGoals(card);});
  const rf=body.querySelector('#gRefill');if(rf)rf.onclick=()=>{buyRefill();renderGoals(card);};
  body.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const d=DEFS[b.dataset.b];if(blocked(d))return;nextModal();closeDrawer();mode='build';sel=b.dataset.b;moving=null;removeSel=null;updChip();});}
function updGoalsBtn(){const n=goalsReady(),dot=$('#goalsDot');dot.hidden=!n;dot.textContent=n>9?'9+':n;}
$('#goalsBtn').onclick=()=>openGoals();

setInterval(()=>{tickEnergy(Date.now());recompute();updHUD();updClock();if(!visiting&&!mOpen&&S.tips&&S.tips.seasons&&S.lastSea!==ENV().season)seasonNews(false);if(!visiting){S.c.maxTour=Math.max(S.c.maxTour||0,D.tourists);updGoalsBtn();}updQuest();updSheet();updEvent();if(!$('#drawer').hidden){document.querySelectorAll('.card').forEach(c=>{const d=DEFS[c.dataset.t];c.classList.toggle('poor',S.lvl>=d.lvl&&(S.yen<d.cost||!!(d.candy&&E().candy<d.candy)||!!(d.koban&&S.koban<d.koban)));});}},250);

/* ---------- boot ---------- */
resize();rebuild();fitCam();tickEnergy(Date.now());updHUD();updQuest();updEvent();
let last=performance.now();
function frame(t){const dt=Math.min(.1,(t-last)/1000);last=t;updWalkers(dt);updParticles(dt,ENV());updGhosts(dt,Date.now());draw(Date.now());requestAnimationFrame(frame);}
requestAnimationFrame(frame);
platformReady.then(plat=>{
let isNew=fresh;
if(CG){
  const o=readCG();cgHadSave=!!o;
  if(o)useTown(o);else{dirty=true;cloudDirty=true;flush();}
  isNew=!o&&fresh;
  try{if(CG.user&&CG.user.addAuthListener)CG.user.addAuthListener(()=>setTimeout(()=>{const n=readCG();if(n&&!visiting){useTown(n);toast('Loaded your saved town.');}},600));}catch(e){}
  try{CG.ad.hasAdblock().then(b=>{if(b)adsOff='Video ads are blocked by an ad blocker, so this option is off.';}).catch(()=>{});}catch(e){}
}
if(innerHeight<560){$('#quest').classList.add('min');$('#qToggle').textContent='+';}
if(isNew&&eventOn())E().seen=true;
if(isNew)modal('<div class="big">'+TANUKI+'</div><h2>Welcome to Komorebi Town</h2><p>I\'m Mayor Kobu. Our sleepy valley wants to become the best holiday spot in Japan. Grow rice, open shops, plant sakura and bring the tourists in!</p><p>Follow my requests in the corner and I\'ll reward you.</p>',[{label:'Let\'s build',cls:'primary'}]);
if(eventOn()&&!E().seen){E().seen=true;save();modal('<div class="big">'+PUMPKIN+'</div><h2>The Halloween Festival is here!</h2><p>For two weeks only, until 11 November. Catch floating ghosts and grow pumpkins to collect candy, then spend it on limited items like the Haunted House and Lantern Ghost.</p>',[{label:'Later'},{label:'See the festival',cls:'primary',fn:()=>openEvent()}]);}
if(!isNew){const ls=lastSeen();if(ls&&Date.now()-ls>=AWAY_MIN)welcomeBack(Date.now()-ls);}
markSeen();seasonNews(isNew);updClock();
if(!mOpen)gp(true);
});
})();
</script>
