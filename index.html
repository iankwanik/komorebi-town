<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Komorebi Town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* Layout: full-screen isometric town canvas; HUD + mayor quest card float top-left, action dock bottom-centre, trays rise above the dock */
:root{
  --ink:#1c2541; --ink-2:#4b5675; --paper:#fbfaf3; --paper-2:#e9efdc; --sky:#cfe5ec;
  --vermilion:#d6432b; --gold:#f0b429; --matcha:#6a9b42;
  --display:'Dela Gothic One','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  --body:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Yu Gothic',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);font-weight:500;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.panel{background:var(--paper);border:2px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink)}
.btn{border:2px solid var(--ink);background:var(--paper);border-radius:10px;padding:7px 13px;font-weight:800;font-size:13px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
.btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--vermilion);color:#fff}
.btn.danger{background:#fff0ec;color:var(--vermilion)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

#top{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:flex-start;gap:8px;pointer-events:none;z-index:5}
#hud{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%}
#hud>*{pointer-events:auto}
.lvl{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px}
.lvl-num{width:34px;height:34px;border-radius:50%;background:var(--vermilion);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:15px;border:2px solid var(--ink)}
.xpbar{width:78px;height:8px;border-radius:6px;background:var(--paper-2);border:1.5px solid var(--ink);overflow:hidden}
.xpfill{height:100%;background:var(--matcha);width:0;transition:width .3s}
.xptxt{font-size:10.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-top:2px;font-weight:700}
.stat{display:flex;align-items:center;gap:5px;padding:5px 10px 5px 6px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat svg{width:22px;height:22px;flex:none}
.stat small{display:block;font-weight:700;font-size:9.5px;color:var(--ink-2)}
[hidden]{display:none!important}
.hud-right{margin-left:auto;display:flex;gap:6px;align-items:center}
#cloudBtn{display:flex;align-items:center;gap:6px;height:40px;box-sizing:border-box;padding:0 11px 0 8px;font-weight:800;font-size:12.5px;cursor:pointer;white-space:nowrap}
#cloudBtn svg{width:22px;height:22px;flex:none}
#cloudBtn.off{background:var(--gold)}
#cloudBtn.err{background:#ffe3dc}
#friendsBtn{width:40px;height:40px;display:grid;place-items:center;padding:0;cursor:pointer}
#friendsBtn svg{width:23px;height:23px}
#eventCard{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 8px;pointer-events:auto;background:#2b2238;color:#fbeedd;max-width:300px;box-sizing:border-box}
#eventCard #evIcon svg{width:38px;height:38px;display:block}
#eventCard .qlabel{color:#f0b46a}
#eventCard .evline{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
#eventCard .btn{margin-left:auto;padding:5px 11px;color:var(--ink);background:#f6c48a}
.tab.evtab{background:#2b2238;color:#f6c48a}
.tab.evtab.on{background:#7a4fb0;color:#fff}
.evnote{flex:none;width:96px;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:4px;border-radius:12px;background:#2b2238;color:#fbeedd;padding:8px;font-size:13px;line-height:1.3;text-align:center}
.evnote b{font-family:var(--display);font-weight:400;font-size:22px;color:#f6c48a}
.evnote small{font-size:10.5px;color:#d9c8e8}
.card .lim{position:absolute;top:10px;right:10px;background:#7a4fb0;color:#fff;font-size:10px;font-weight:800;border-radius:6px;padding:2px 6px}
.codebox{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 12px}
.codebox span{font-family:var(--display);font-size:24px;letter-spacing:.12em;background:var(--paper-2);border-radius:10px;padding:4px 12px;-webkit-user-select:all;user-select:all}
.field .row{display:flex;gap:8px}
.field .row input{flex:1;min-width:0;text-transform:uppercase;letter-spacing:.1em}
.btn.mini{padding:4px 9px;font-size:12px;box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:#fff;color:var(--ink-2)}
.btn:disabled{opacity:.55;cursor:default}
.acts{display:flex;gap:6px}
.board li[data-i]{cursor:pointer}
.board li[data-i]:hover{background:#f6f8ef}
#visitBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:7;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;width:min(540px,calc(100% - 20px));box-sizing:border-box}
#visitBar .vinfo{flex:1;min-width:0}
#visitBar .sstat{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#boardBtn{width:40px;height:40px;display:grid;place-items:center;padding:0;cursor:pointer}
#boardBtn svg{width:23px;height:23px}
.field{display:flex;flex-direction:column;gap:4px;text-align:left;margin:0 0 10px}
.field label{font-size:12px;font-weight:800;color:var(--ink-2)}
.field input{font:inherit;font-size:15px;font-weight:700;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:10px;padding:8px 10px;-webkit-user-select:text;user-select:text;box-sizing:border-box;width:100%}
.field input:focus{outline:3px solid var(--gold);outline-offset:1px}
.btabs{display:flex;gap:6px;justify-content:center;margin:0 0 10px;flex-wrap:wrap}
.board{list-style:none;margin:0 0 12px;padding:0;text-align:left;max-height:min(48vh,420px);overflow-y:auto;border:2px solid var(--ink);border-radius:12px;background:#fff}
.board li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--paper-2);font-size:13px}
.board li:last-child{border-bottom:0}
.board li.empty{display:block;text-align:center;color:var(--ink-2);padding:18px}
.board .rk{font-family:var(--display);font-size:14px;text-align:center;color:var(--ink-2)}
.board li:nth-child(1) .rk{color:#b8860b}.board li:nth-child(2) .rk{color:#7d8798}.board li:nth-child(3) .rk{color:#a0623a}
.board .who{min-width:0;display:flex;flex-direction:column}
.board .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .tw{font-size:11px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .val{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.board .val small{font-weight:700;color:var(--ink-2)}
.board li.me{background:#fff4d2}
#menuBtn{width:40px;height:40px;display:grid;place-items:center;padding:0;cursor:pointer}
#menuBtn svg{width:20px;height:20px}

#quest{display:flex;gap:10px;padding:10px 30px 10px 10px;max-width:300px;pointer-events:auto;position:relative}
.mayor svg{width:46px;height:46px;display:block}
.qbody{min-width:0}
.qlabel{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:800}
.qtitle{font-family:var(--display);font-size:14px;line-height:1.3;margin:2px 0 3px;text-wrap:balance}
.qhint{font-size:12px;color:var(--ink-2);line-height:1.45}
.qprog{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.qbar{flex:1;height:7px;border-radius:5px;background:var(--paper-2);border:1.5px solid var(--ink);overflow:hidden;min-width:60px}
#qFill{height:100%;background:var(--gold);width:0;transition:width .3s}
.qreward{font-size:11.5px;margin-top:4px;font-weight:700}
#qClaim{margin-top:8px}
#quest.min .qhint,#quest.min .qreward,#quest.min .qprog{display:none}
#qToggle{position:absolute;top:4px;right:4px;border:0;background:none;font-weight:800;cursor:pointer;font-size:16px;width:26px;height:26px;border-radius:8px}

#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:5px;z-index:6}
#dock button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:66px;padding:6px 8px;border-radius:10px;font-weight:800;font-size:12px;cursor:pointer}
#dock button svg{width:24px;height:24px}
#dock button[data-act=build]{background:var(--vermilion);color:#fff}
#dock button.on{background:var(--ink);color:var(--paper)}
#zoom{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:5}
#zoom button{width:42px;height:42px;font-size:20px;font-weight:800;cursor:pointer;padding:0;line-height:1}

.tray{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:7}
#drawer{width:min(700px,calc(100% - 20px));padding:10px;box-sizing:border-box}
.tabs{display:flex;gap:5px;overflow-x:auto;margin-bottom:8px;align-items:center}
.tab{border:0;background:var(--paper-2);border-radius:999px;padding:6px 13px;font-weight:800;font-size:12.5px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--ink);color:var(--paper)}
#drawerClose{margin-left:auto;border:0;background:none;font-size:20px;font-weight:800;cursor:pointer;width:32px;height:32px;flex:none}
.cards{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px}
.card{flex:none;width:112px;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:6px;display:flex;flex-direction:column;align-items:stretch;gap:2px;cursor:pointer;text-align:left;position:relative}
.card:hover{background:#fffdf3}
.card canvas{width:100%;height:80px;background:linear-gradient(#e3eff2,#f2f6ea);border-radius:8px;display:block}
.cname{font-weight:800;font-size:12px;line-height:1.2;margin-top:3px}
.cmeta{font-size:10.5px;color:var(--ink-2);line-height:1.3}
.ccost{font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums}
.card.locked{background:#f0f0ea}
.card.locked canvas{filter:grayscale(1) opacity(.55)}
.card .lock{position:absolute;top:10px;left:10px;background:var(--ink);color:#fff;font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 6px}
.card.poor .ccost{color:var(--vermilion)}

#chip{display:flex;align-items:center;gap:10px;padding:7px 7px 7px 14px;font-weight:700;font-size:13px;max-width:calc(100% - 20px);box-sizing:border-box}
#chip span{min-width:0}
#sheet{display:flex;gap:10px;align-items:center;padding:8px;width:min(460px,calc(100% - 20px));box-sizing:border-box}
#sheet canvas{width:72px;height:60px;border-radius:8px;background:linear-gradient(#e3eff2,#f2f6ea);flex:none}
.sbody{flex:1;min-width:0}
.stitle{font-family:var(--display);font-size:14px}
.sstat{font-size:12px;color:var(--ink-2);line-height:1.4;margin-top:1px}
.sbar{height:7px;border-radius:5px;background:var(--paper-2);border:1.5px solid var(--ink);overflow:hidden;margin-top:5px}
#sBar{height:100%;background:var(--matcha);width:0}
.sbtns{display:flex;flex-direction:column;gap:6px}
.sbtns .btn{padding:5px 10px;font-size:12px}

#toast{position:fixed;top:30%;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-weight:700;font-size:13px;z-index:20;max-width:calc(100% - 40px);text-align:center;pointer-events:none;box-shadow:3px 3px 0 rgba(28,37,65,.25)}
#modal{position:fixed;inset:0;background:rgba(28,37,65,.45);display:grid;place-items:center;z-index:30;padding:20px}
.mcard{max-width:370px;width:100%;padding:18px 18px 16px;text-align:center;box-sizing:border-box;max-height:calc(100vh - 60px);overflow:auto}
.mcard .big svg{width:72px;height:72px}
.mcard h2{font-family:var(--display);font-weight:400;font-size:21px;margin:6px 0 8px;text-wrap:balance}
.mcard p{font-size:13.5px;line-height:1.6;color:var(--ink-2);margin:0 0 10px}
.mcard ul{text-align:left;font-size:13px;line-height:1.55;color:var(--ink-2);padding-left:18px;margin:0 0 12px}
.mcard li{margin-bottom:4px}
.mcard .unlocks{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0 12px}
.mcard .unlocks span{background:var(--paper-2);border-radius:999px;padding:4px 10px;font-weight:800;font-size:12px}
.mbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.levelstamp{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--vermilion);color:#fff;font-family:var(--display);font-size:28px;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
@media (max-width:480px){
  .stat{font-size:13px;padding:4px 8px 4px 5px}
  .stat svg{width:19px;height:19px}
  .xpbar{width:60px}
  #quest{max-width:240px}
  .qhint{font-size:11.5px}
  #dock button{min-width:58px;padding:5px 6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<canvas id="game" aria-label="Town map"></canvas>

<div id="top">
  <div id="hud">
    <div class="panel lvl"><div class="lvl-num" id="lvlNum">1</div><div><div class="xpbar"><div class="xpfill" id="xpFill"></div></div><div class="xptxt" id="xpTxt">0 / 30 XP</div></div></div>
    <div class="panel stat" title="Yen"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f0b429" stroke="#1c2541" stroke-width="2"/><path d="M8.5 6.8l3.5 5 3.5-5M12 11.8v6.4M9 13h6M9 16h6" stroke="#1c2541" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg><span id="yen">0</span></div>
    <div class="panel stat" title="Energy"><svg viewBox="0 0 24 24"><path d="M12 3c2 0 9 11 9 14a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3c0-3 7-14 9-14z" fill="#fff" stroke="#1c2541" stroke-width="2" stroke-linejoin="round"/><rect x="8" y="13.5" width="8" height="6.5" rx="1" fill="#1c2541"/></svg><span><span id="en">0</span><small id="enT"></small></span></div>
    <div class="panel stat" title="Goods"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="6" fill="#e2c27a" stroke="#1c2541" stroke-width="2"/><path d="M8 6.5v11M16 6.5v11" stroke="#1c2541" stroke-width="1.8"/></svg><span id="goods">0</span></div>
    <div class="panel stat" title="Tourists"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="12" rx="3" fill="#7fb8d0" stroke="#1c2541" stroke-width="2"/><path d="M8 7l1.5-2.5h5L16 7" fill="#7fb8d0" stroke="#1c2541" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" fill="#fff" stroke="#1c2541" stroke-width="2"/></svg><span id="tour">0</span></div>
    <div class="panel stat" title="Staff in use / residents"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2" fill="#f0cfae" stroke="#1c2541" stroke-width="2"/><path d="M3.5 20c0-4 2.5-6 5.5-6s5.5 2 5.5 6z" fill="#5d8f4c" stroke="#1c2541" stroke-width="2" stroke-linejoin="round"/><circle cx="16.5" cy="9" r="2.6" fill="#f0cfae" stroke="#1c2541" stroke-width="1.8"/><path d="M15 14.2c3.3-.4 5.6 1.6 5.6 5.8h-4" fill="#c8572f" stroke="#1c2541" stroke-width="1.8" stroke-linejoin="round"/></svg><span id="staff">0</span></div>
    <div class="hud-right">
      <button class="panel" id="friendsBtn" aria-label="Friends" hidden><svg viewBox="0 0 24 24"><circle cx="8.5" cy="8" r="3.2" fill="#f0cfae" stroke="#1c2541" stroke-width="2"/><path d="M3 20c0-4 2.4-6 5.5-6s5.5 2 5.5 6z" fill="#7fb8d0" stroke="#1c2541" stroke-width="2" stroke-linejoin="round"/><path d="M17 7v6M14 10h6" stroke="#d6432b" stroke-width="2.4" stroke-linecap="round"/></svg></button>
      <button class="panel" id="boardBtn" aria-label="Leaderboard" hidden><svg viewBox="0 0 24 24"><path d="M7 4h10v4a5 5 0 0 1-10 0z" fill="#f0b429" stroke="#1c2541" stroke-width="2" stroke-linejoin="round"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3" fill="none" stroke="#1c2541" stroke-width="2"/><path d="M12 13v4M8.5 20h7v-1.5a1.5 1.5 0 0 0-1.5-1.5h-4a1.5 1.5 0 0 0-1.5 1.5z" fill="#f0b429" stroke="#1c2541" stroke-width="2" stroke-linejoin="round"/></svg></button>
      <button class="panel off" id="cloudBtn" hidden><svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.2 9.1 4.5 4.5 0 0 0 7 18z" fill="#fff" stroke="#1c2541" stroke-width="2" stroke-linejoin="round"/></svg><span id="cloudTxt">Sign in</span></button>
      <button class="panel" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="#1c2541" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </div>
  <div id="quest" class="panel">
    <div class="mayor" id="mayorIcon"></div>
    <div class="qbody">
      <div class="qlabel">Mayor Kobu asks</div>
      <div class="qtitle" id="qTitle"></div>
      <div class="qhint" id="qHint"></div>
      <div class="qprog"><div class="qbar"><div id="qFill"></div></div><span id="qNum"></span></div>
      <div class="qreward" id="qReward"></div>
      <button id="qClaim" class="btn primary" hidden>Claim reward</button>
    </div>
    <button id="qToggle" aria-label="Fold quest card">–</button>
  </div>
  <div id="eventCard" class="panel" hidden><span id="evIcon"></span><div><div class="qlabel">Halloween Festival</div><div class="evline"><b id="evCandy">0</b> candy · <span id="evLeft"></span></div></div><button class="btn" id="evOpen">Open</button></div>
</div>

<div id="zoom"><button class="panel" id="zin" aria-label="Zoom in">+</button><button class="panel" id="zout" aria-label="Zoom out">−</button></div>

<nav id="dock" class="panel">
  <button data-act="build"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M12 13v5M9.5 15.5h5"/></svg>Build</button>
  <button data-act="move"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg>Move</button>
  <button data-act="remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Remove</button>
  <button data-act="expand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Expand</button>
</nav>

<div id="drawer" class="panel tray" hidden>
  <div class="tabs" id="tabs"></div>
  <div class="cards" id="cards"></div>
</div>
<div id="chip" class="panel tray" hidden><span id="chipTxt"></span><button id="chipDone" class="btn">Done</button></div>
<div id="sheet" class="panel tray" hidden>
  <canvas id="sThumb" width="144" height="120"></canvas>
  <div class="sbody"><div class="stitle" id="sName"></div><div class="sstat" id="sStat"></div><div class="sbar" id="sBarW"><div id="sBar"></div></div></div>
  <div class="sbtns"><button id="sMove" class="btn">Move</button><button id="sSell" class="btn danger">Remove</button></div>
</div>

if (firebaseConfig.apiKey.startsWith("PASTE")) {
  console.info("Komorebi Town: Firebase config not set, so the game saves on this device only.");
} else {
  const V = "10.12.2";
  const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, signOut, onAuthStateChanged } =
    await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const { getFirestore, doc, getDoc, setDoc, serverTimestamp, collection, query, orderBy, limit, getDocs, where, addDoc, deleteDoc } =
    await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  window.cloud = {
    async signIn() {
      try { await signInWithPopup(auth, provider); }
      catch (e) {
        if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") await signInWithRedirect(auth, provider);
        else if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") throw e;
      }
    },
    signOut: () => signOut(auth),
    onUser: cb => onAuthStateChanged(auth, u => cb(u ? { uid: u.uid, name: u.displayName || u.email || "Player" } : null)),
    async load() {
      const snap = await getDoc(doc(db, "saves", auth.currentUser.uid));
      return snap.exists() ? JSON.parse(snap.data().data) : null;
    },
    async save(state) {
      await setDoc(doc(db, "saves", auth.currentUser.uid), {
        data: JSON.stringify(state),
        savedAt: state.savedAt || Date.now(),
        level: state.lvl,
        updated: serverTimestamp()
      });
    }
  };
  window.cloud.uid = () => (auth.currentUser ? auth.currentUser.uid : null);
  window.cloud.saveBoard = async entry => {
    await setDoc(doc(db, "leaderboard", auth.currentUser.uid), { ...entry, updated: serverTimestamp() });
  };
  window.cloud.loadBoard = async field => {
    const snap = await getDocs(query(collection(db, "leaderboard"), orderBy(field, "desc"), limit(50)));
    return snap.docs.map(d => ({ uid: d.id, ...d.data() }));
  };
  window.cloud.loadSave = async uid => {
    const snap = await getDoc(doc(db, "saves", uid));
    return snap.exists() ? JSON.parse(snap.data().data) : null;
  };
  window.cloud.getBoard = async uid => {
    const snap = await getDoc(doc(db, "leaderboard", uid));
    return snap.exists() ? { uid, ...snap.data() } : null;
  };
  window.cloud.findByCode = async code => {
    const q = await getDocs(query(collection(db, "leaderboard"), where("code", "==", code), limit(1)));
    return q.empty ? null : { uid: q.docs[0].id, ...q.docs[0].data() };
  };
  window.cloud.sendHelp = async (to, data) => {
    await addDoc(collection(db, "inbox", to, "items"), { ...data, from: auth.currentUser.uid, at: serverTimestamp() });
  };
  window.cloud.readInbox = async () => {
    const q = await getDocs(collection(db, "inbox", auth.currentUser.uid, "items"));
    return q.docs.map(d => ({ id: d.id, ...d.data() }));
  };
  window.cloud.deleteInbox = async id => {
    await deleteDoc(doc(db, "inbox", auth.currentUser.uid, "items", id));
  };
  window.dispatchEvent(new Event("cloud-ready"));
}
</script>

/* ---------- grid ---------- */
let occ=new Int32Array(MAP*MAP), roadTiles=[], forest=[];
const D={appeal:0,res:0,staff:0,tourists:0,open:0,mult:1};
const off=()=>(MAP-S.size)/2;
const inMap=(x,y)=>x>=0&&y>=0&&x<MAP&&y<MAP;
function unlocked(x,y){const o=off();return x>=o&&y>=o&&x<o+S.size&&y<o+S.size;}
const isRoad=(x,y)=>inMap(x,y)&&S.roads[y*MAP+x]===1;
function nearRoad(b){const d=DEFS[b.type];for(let i=-1;i<=d.w;i++)for(let j=-1;j<=d.h;j++){const io=i===-1||i===d.w,jo=j===-1||j===d.h;if(io!==jo&&isRoad(b.x+i,b.y+j))return true;}return false;}
const hash=(x,y)=>{const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s);};
function rebuild(){
  occ.fill(0);
  for(const b of S.b){const d=DEFS[b.type];for(let i=0;i<d.w;i++)for(let j=0;j<d.h;j++)occ[(b.y+j)*MAP+b.x+i]=b.id;}
  roadTiles=[];for(let y=0;y<MAP;y++)for(let x=0;x<MAP;x++)if(S.roads[y*MAP+x])roadTiles.push([x,y]);
  forest=[];for(let y=0;y<MAP;y++)for(let x=0;x<MAP;x++)if(!unlocked(x,y)&&hash(x,y)<.48)forest.push({x:x+.3+hash(y,x)*.4,y:y+.3+hash(x+3,y)*.4,s:.75+hash(x,y+7)*.5});
  recompute();
}
function recompute(){let a=0,r=0,s=0,o=0;for(const b of S.b){const d=DEFS[b.type];if(d.appeal)a+=d.appeal;if(d.res)r+=d.res;if(d.staff){s+=d.staff;if(nearRoad(b))o++;}}D.appeal=a;D.res=r;D.staff=s;D.open=o;D.tourists=a*3+o*5;D.mult=1+D.tourists/300;}
function canPlace(t,x,y,ign){const d=DEFS[t];for(let i=0;i<d.w;i++)for(let j=0;j<d.h;j++){const X=x+i,Y=y+j;if(!inMap(X,Y)||!unlocked(X,Y)||isRoad(X,Y))return false;const o=occ[Y*MAP+X];if(o&&o!==ign)return false;}return true;}
function anchor(t,tx,ty){const d=DEFS[t];return{x:tx-Math.floor((d.w-1)/2),y:ty-Math.floor((d.h-1)/2)};}
function prog(b,n){const d=DEFS[b.type];if(d.cat==='farm')return b.st==='empty'?0:(n-b.t)/(d.grow*1000);if(d.cat==='shop')return b.st==='idle'?0:(n-b.t)/(d.time*1000);if(d.cat==='home')return (n-b.t)/(d.time*1000);return 0;}

const OUT='rgba(28,37,65,.38)';

const _sc={};

function poly(p,fill,st){ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(st!==false){ctx.strokeStyle=st||OUT;ctx.lineWidth=.8;ctx.lineJoin='round';ctx.stroke();}}

  poly([P(x,y1,z),P(x1,y1,z),P(x1,y1,z+h),P(x,y1,z+h)],shade(c,.9),o);
  poly([P(x1,y,z),P(x1,y1,z),P(x1,y1,z+h),P(x1,y,z+h)],shade(c,.74),o);
  poly([P(x,y,z+h),P(x1,y,z+h),P(x1,y1,z+h),P(x,y1,z+h)],shade(c,1.12),o);}
function hip(x,y,w,d,z,h,o,c){
  box(x-o,y-o,w+2*o,d+2*o,z-1.6,1.6,shade(c,.62));

  poly(X?[q(C,z),q(Dd,z),q(r1,zt),q(r2,zt)]:[q(C,z),q(Dd,z),q(r2,zt)],shade(c,.94));}
function ell(px,py,rx,ry,c,st){ctx.beginPath();ctx.ellipse(px,py,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();if(st!==false){ctx.strokeStyle=st||OUT;ctx.lineWidth=.8;ctx.stroke();}}

function fy(x0,x1,y,z0,z1,c){poly([P(x0,y,z0),P(x1,y,z0),P(x1,y,z1),P(x0,y,z1)],c,false);}

function updGhosts(dt,n){if(!eventOn()||visiting){ghosts.length=0;return;}ghostT+=dt;if(ghostT>=30&&ghosts.length<3){ghostT=0;const o=off(),sz=S.size;ghosts.push({x:o+1+Math.random()*(sz-2),y:o+1+Math.random()*(sz-2),ph:Math.random()*6,t0:n});}}
function drawGhost(g,n,s){const p=P(g.x,g.y,26+Math.sin(n/500+g.ph)*5),sh=P(g.x,g.y,0),a=Math.min(1,(n-g.t0)/600);

  ctx.beginPath();ctx.moveTo(-8,6);ctx.lineTo(-8,-3);ctx.arc(0,-3,8,Math.PI,0);ctx.lineTo(8,6);const wv=Math.floor(n/250)%2;for(let i=0;i<4;i++){const xx=8-i*4;ctx.quadraticCurveTo(xx-2,9+((i+wv)%2)*2,xx-4,6);}ctx.closePath();
  ctx.fillStyle='#fbf8ff';ctx.fill();ctx.strokeStyle='rgba(60,30,90,.55)';ctx.lineWidth=1;ctx.stroke();
  ell(-3,-3,1.5,2.2,'#2a2238',false);ell(3,-3,1.5,2.2,'#2a2238',false);ell(0,1.5,1.6,1.2,'#2a2238',false);ell(-5.5,0,1.6,.9,'rgba(240,120,150,.6)',false);ell(5.5,0,1.6,.9,'rgba(240,120,150,.6)',false);
  ctx.restore();}
function hitGhost(w){const r=18/Math.min(1,cam.z);for(let i=ghosts.length-1;i>=0;i--){const g=ghosts[i],p=P(g.x,g.y,26);if(Math.hypot(w[0]-p[0],w[1]-p[1])<r)return i;}return -1;}


/* ---------- camera & loop ---------- */
let W=0,H=0,dpr=1;
const cam={x:0,y:288,z:1};
function resize(){dpr=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
function fitCam(){const z=Math.min(W/(S.size*64+40),(H-150)/(S.size*32+130));cam.z=clamp(z,.45,1.8);cam.x=0;cam.y=P(9,9,0)[1]+10;}
function clampCam(){const lim=MAP*32;cam.x=clamp(cam.x,-lim,lim);cam.y=clamp(cam.y,-80,MAP*32+80);}
const s2w=(sx,sy)=>[(sx-W/2)/cam.z+cam.x,(sy-H/2)/cam.z+cam.y];
function w2t(wx,wy){const a=wy/16,b=wx/32;return[Math.floor((a+b)/2),Math.floor((a-b)/2)];}

let mode=null, sel=null, moving=null, removeSel=null, hover=null, sheetB=null;
const floats=[], walkers=[];
const KIM=['#d6432b','#2f6db0','#6a9b42','#e2a33a','#8a4fa0','#e0789a','#1c2541','#3f8f8a'];
function newWalker(){const r=roadTiles[Math.random()*roadTiles.length|0];return{fx:r[0],fy:r[1],tx:r[0],ty:r[1],p:Math.random(),sp:.35+Math.random()*.35,c:KIM[Math.random()*KIM.length|0],pc:KIM[Math.random()*KIM.length|0],par:Math.random()<.3,ox:(Math.random()-.5)*.45,oy:(Math.random()-.5)*.45,ph:Math.random()*6};}
function updWalkers(dt){
  if(!roadTiles.length){walkers.length=0;return;}
  const want=Math.min(46,Math.floor(D.tourists/4));
  while(walkers.length<want)walkers.push(newWalker());
  if(walkers.length>want)walkers.length=want;
  for(const w of walkers){
    if(!isRoad(w.fx,w.fy)||!isRoad(w.tx,w.ty)){Object.assign(w,newWalker());continue;}
    w.p+=dt*w.sp;
    if(w.p>=1){w.p=0;const px=w.fx,py=w.fy;w.fx=w.tx;w.fy=w.ty;
      const nb=[[1,0],[-1,0],[0,1],[0,-1]].map(([a,c])=>[w.fx+a,w.fy+c]).filter(([a,c])=>isRoad(a,c));
      let opts=nb.filter(([a,c])=>!(a===px&&c===py));if(!opts.length)opts=nb;
      if(opts.length){const o=opts[Math.random()*opts.length|0];w.tx=o[0];w.ty=o[1];}}
  }
}
function drawWalker(w,n){
  const x=w.fx+(w.tx-w.fx)*w.p+.5+w.ox,y=w.fy+(w.ty-w.fy)*w.p+.5+w.oy,p=P(x,y,0),bob=Math.abs(Math.sin(n/150+w.ph))*1.2;
  ell(p[0],p[1],3.6,1.6,'rgba(28,37,65,.2)',false);
  poly([[p[0]-3,p[1]-1-bob],[p[0]+3,p[1]-1-bob],[p[0]+2.2,p[1]-10-bob],[p[0]-2.2,p[1]-10-bob]],w.c,OUT);
  ctx.fillStyle='#f6e7b8';ctx.fillRect(p[0]-2.4,p[1]-7-bob,4.8,1.4);
  ell(p[0],p[1]-12.6-bob,2.6,2.6,'#f0cfae',OUT);
  ctx.beginPath();ctx.arc(p[0],p[1]-13-bob,2.7,Math.PI,0);ctx.fillStyle='#2a2220';ctx.fill();
  if(w.par){ln([p[0]+2.4,p[1]-8-bob],[p[0]+2.4,p[1]-19-bob],'#5a391f',.9);ell(p[0]+2.4,p[1]-19-bob,7,2.8,w.pc,OUT);}
}
function fir(f){const p=P(f.x,f.y,0),s=f.s;ell(p[0],p[1],8*s,4*s,'rgba(28,37,65,.14)',false);ctx.fillStyle='#5b4330';ctx.fillRect(p[0]-1.5*s,p[1]-8*s,3*s,8*s);
  for(let i=0;i<3;i++){const yb=p[1]-6*s-i*8.5*s,w=(12.5-i*3)*s,h=14*s;poly([[p[0]-w,yb],[p[0],yb-h],[p[0],yb+2*s]],'#457a4d',false);poly([[p[0],yb-h],[p[0]+w,yb],[p[0],yb+2*s]],'#33613c',false);}}

function drawBuilding(b,n,alpha){
  const d=DEFS[b.type];if(alpha!==undefined)ctx.globalAlpha=alpha;
  DR[b.type](b,n,prog(b,n));
  ctx.globalAlpha=1;
}
function indicator(b,n){const d=DEFS[b.type];if(d.cat==='decor'||d.cat==='road')return null;
  if((d.cat==='shop'||d.cat==='home')&&!nearRoad(b))return{k:'warn'};
  const p=prog(b,n);
  if(d.cat==='farm'){if(b.st==='empty')return{k:'seed'};return p>=1?{k:'rice'}:{bar:p};}
  if(d.cat==='shop'){if(b.st==='idle')return{k:'crate'};return p>=1?{k:'coin'}:{bar:p};}
  return p>=1?{k:'coin'}:null;}
function bubble(px,py,k,s,n){
  ctx.save();ctx.translate(px,py+Math.sin(n/300+px)*1.6);ctx.scale(s,s);
  ctx.beginPath();ctx.moveTo(-4,8);ctx.lineTo(0,15);ctx.lineTo(4,8);ctx.closePath();ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#1c2541';ctx.lineWidth=1.6;ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,11.5,0,Math.PI*2);ctx.fillStyle=k==='warn'?'#fff3e8':'#fff';ctx.fill();ctx.stroke();
  if(k==='coin'){ell(0,0,7.5,7.5,'#f0b429','#1c2541');ctx.strokeStyle='#1c2541';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-2.8,-4);ctx.lineTo(0,-.4);ctx.lineTo(2.8,-4);ctx.moveTo(0,-.4);ctx.lineTo(0,4.4);ctx.moveTo(-2.6,.8);ctx.lineTo(2.6,.8);ctx.moveTo(-2.6,3);ctx.lineTo(2.6,3);ctx.stroke();}
  else if(k==='rice'){ctx.strokeStyle='#c99a2e';ctx.lineWidth=1.6;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*.8,6);ctx.quadraticCurveTo(i*2.2,0,i*2.6,-6);ctx.stroke();ell(i*2.6,-6.5,1.5,2.2,'#f0c24b',false);}ctx.fillStyle='#d6432b';ctx.fillRect(-3.4,1.5,6.8,2);}
  else if(k==='seed'){ln([0,7],[0,-1],'#5aa646',2);ell(-3.6,-2.5,3.6,2,'#6cb84f','#3e7a2f');ell(3.6,-4.5,3.6,2,'#80c75e','#3e7a2f');}
  else if(k==='crate'){ctx.beginPath();ctx.roundRect?ctx.roundRect(-7,-5,14,10,5):ctx.rect(-7,-5,14,10);ctx.fillStyle='#e2c27a';ctx.fill();ctx.strokeStyle='#1c2541';ctx.lineWidth=1.4;ctx.stroke();ln([-2.5,-5],[-2.5,5],'#1c2541',1.2);ln([2.5,-5],[2.5,5],'#1c2541',1.2);}
  else if(k==='warn'){poly([[0,-7.5],[7.5,6],[-7.5,6]],'#f0b429','#1c2541');ln([0,-3],[0,1.6],'#1c2541',1.8);ell(0,3.8,1,1,'#1c2541',false);}
  ctx.restore();}
function bar(px,py,p,s){ctx.save();ctx.translate(px,py);ctx.scale(s,s);ctx.fillStyle='#1c2541';ctx.fillRect(-15,-3.5,30,7);ctx.fillStyle='#f7f5ec';ctx.fillRect(-13.5,-2,27,4);ctx.fillStyle='#6a9b42';ctx.fillRect(-13.5,-2,27*clamp(p,0,1),4);ctx.restore();}

let skyG=null,skyK='';
function draw(n){
  ctx=C0;ctx.setTransform(dpr,0,0,dpr,0,0);
  const evOn=eventOn(),sk=H+'|'+evOn;if(!skyG||skyK!==sk){skyG=ctx.createLinearGradient(0,0,0,H);if(evOn){skyG.addColorStop(0,'#4a3a75');skyG.addColorStop(.5,'#b9708a');skyG.addColorStop(1,'#f0c49a');}else{skyG.addColorStop(0,'#b9dcea');skyG.addColorStop(.55,'#dcecea');skyG.addColorStop(1,'#e6efdc');}skyK=sk;}
  ctx.fillStyle=skyG;ctx.fillRect(0,0,W,H);
  // distant mountain
  const my=H*.34-(cam.y-300)*cam.z*.08,mx=W*.62-cam.x*cam.z*.05,mw=Math.max(W,700)*.55;
  ctx.beginPath();ctx.moveTo(mx-mw,my+mw*.42);ctx.lineTo(mx-mw*.13,my);ctx.quadraticCurveTo(mx,my-8,mx+mw*.13,my);ctx.lineTo(mx+mw,my+mw*.42);ctx.closePath();ctx.fillStyle=evOn?'#6f5f92':'#a8c6d4';ctx.fill();
  ctx.beginPath();ctx.moveTo(mx-mw*.13,my);ctx.quadraticCurveTo(mx,my-8,mx+mw*.13,my);ctx.lineTo(mx+mw*.24,my+mw*.08);ctx.lineTo(mx+mw*.1,my+mw*.05);ctx.lineTo(mx,my+mw*.09);ctx.lineTo(mx-mw*.1,my+mw*.05);ctx.lineTo(mx-mw*.24,my+mw*.08);ctx.closePath();ctx.fillStyle=evOn?'#e9e0f2':'#f3f7f8';ctx.fill();
  if(evOn){ell(W*.16,H*.14,26,26,'#fbf3d8',false);for(let i=0;i<4;i++){const t=(n/16000+i*.27)%1;bat(-40+t*(W+80),H*.12+i*24+Math.sin(n/700+i*2)*10,.9+i*.12,Math.sin(n/90+i));}}

  ctx.setTransform(dpr*cam.z,0,0,dpr*cam.z,dpr*(W/2-cam.x*cam.z),dpr*(H/2-cam.y*cam.z));
  // island sides
  poly([P(0,MAP,0),P(MAP,MAP,0),P(MAP,MAP,-30),P(0,MAP,-30)],'#8a6a48',false);
  poly([P(MAP,0,0),P(MAP,MAP,0),P(MAP,MAP,-30),P(MAP,0,-30)],'#6f5338',false);
  poly([P(0,MAP,-30),P(MAP,MAP,-30),P(MAP,MAP,-34),P(0,MAP,-34)],'#5f9a8a',false);
  poly([P(MAP,0,-30),P(MAP,MAP,-30),P(MAP,MAP,-34),P(MAP,0,-34)],'#4f8576',false);
  // tiles
  for(let y=0;y<MAP;y++)for(let x=0;x<MAP;x++){
    const u=unlocked(x,y),r=S.roads[y*MAP+x],alt=(x+y)&1;
    let c=u?(alt?'#9fca72':'#99c46c'):(alt?'#7f9f63':'#7a9a5e');
    poly([P(x,y),P(x+1,y),P(x+1,y+1),P(x,y+1)],c,false);
    if(r){poly([P(x+.04,y+.04),P(x+.96,y+.04),P(x+.96,y+.96),P(x+.04,y+.96)],'#c9c1b0',false);
      poly([P(x+.2,y+.2),P(x+.8,y+.2),P(x+.8,y+.8),P(x+.2,y+.8)],'#d6cfbf',false);
      if(isRoad(x+1,y))poly([P(x+.96,y+.04),P(x+1,y+.04),P(x+1,y+.96),P(x+.96,y+.96)],'#c9c1b0',false);
      if(isRoad(x,y+1))poly([P(x+.04,y+.96),P(x+.96,y+.96),P(x+.96,y+1),P(x+.04,y+1)],'#c9c1b0',false);}
  }
  const o=off(),sz=S.size;
  ctx.strokeStyle='rgba(255,255,255,.13)';ctx.lineWidth=1;ctx.beginPath();
  for(let i=0;i<=sz;i++){let a=P(o+i,o),b=P(o+i,o+sz);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);a=P(o,o+i);b=P(o+sz,o+i);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);}
  ctx.stroke();
  if(sz<MAP){ctx.setLineDash([6,5]);ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=1.6;poly([P(o,o),P(o+sz,o),P(o+sz,o+sz),P(o,o+sz)],'rgba(0,0,0,0)','rgba(255,255,255,.75)');ctx.setLineDash([]);}
  // footprint highlights
  let ghost=null;
  if(mode==='build'&&sel&&hover&&sel!=='road'){const a=anchor(sel,hover[0],hover[1]);ghost={t:sel,x:a.x,y:a.y,ok:canPlace(sel,a.x,a.y)};}
  if(mode==='build'&&sel==='road'&&hover){ghost={t:'road',x:hover[0],y:hover[1],ok:inMap(hover[0],hover[1])&&unlocked(hover[0],hover[1])&&!isRoad(hover[0],hover[1])&&!occ[hover[1]*MAP+hover[0]]};}
  if(mode==='move'&&moving&&hover){const a=anchor(moving.type,hover[0],hover[1]);ghost={t:moving.type,x:a.x,y:a.y,ok:canPlace(moving.type,a.x,a.y,moving.id),mv:true};}
  if(ghost){const d=DEFS[ghost.t];for(let i=0;i<d.w;i++)for(let j=0;j<d.h;j++){const X=ghost.x+i,Y=ghost.y+j;poly([P(X,Y),P(X+1,Y),P(X+1,Y+1),P(X,Y+1)],ghost.ok?'rgba(106,175,66,.55)':'rgba(214,67,43,.5)','rgba(255,255,255,.8)');}}
  for(const hb of [removeSel,moving]){if(!hb)continue;const d=DEFS[hb.type],col=hb===removeSel?'rgba(214,67,43,.45)':'rgba(47,109,176,.4)';for(let i=0;i<d.w;i++)for(let j=0;j<d.h;j++){const X=hb.x+i,Y=hb.y+j;poly([P(X,Y),P(X+1,Y),P(X+1,Y+1),P(X,Y+1)],col,false);}}
  // objects, depth sorted
  const items=[];
  for(const b of S.b){const d=DEFS[b.type];items.push([b.x+b.y+(d.w+d.h)/2,0,b]);}
  for(const f of forest)items.push([f.x+f.y,1,f]);
  for(const w of walkers)items.push([w.fx+(w.tx-w.fx)*w.p+w.fy+(w.ty-w.fy)*w.p+1+w.ox+w.oy,2,w]);
  if(ghost&&ghost.t!=='road'){const d=DEFS[ghost.t];items.push([ghost.x+ghost.y+(d.w+d.h)/2+.01,3,ghost]);}
  items.sort((a,b)=>a[0]-b[0]);
  for(const it of items){
    if(it[1]===0)drawBuilding(it[2],n,it[2]===moving?.45:undefined);
    else if(it[1]===1)fir(it[2]);
    else if(it[1]===2)drawWalker(it[2],n);
    else{const g=it[2],fake={x:g.x,y:g.y,type:g.t,st:g.mv?moving.st:(DEFS[g.t].cat==='farm'?'empty':'idle'),t:g.mv?moving.t:n};ctx.globalAlpha=.7;DR[g.t](fake,n,g.mv?prog(moving,n):0);ctx.globalAlpha=1;}
  }
  // indicators
  const s=clamp(1/cam.z,.85,1.7);
  if(!mode&&!visiting)for(const b of S.b){const ind=indicator(b,n);if(!ind)continue;const d=DEFS[b.type],p=P(b.x+d.w/2,b.y+d.h/2,d.ht+(ind.bar!==undefined?8:20));
    if(ind.bar!==undefined)bar(p[0],p[1],ind.bar,s);else bubble(p[0],p[1],ind.k,s*(ind.k==='seed'?.8:1),n);}
  for(const g of ghosts)drawGhost(g,n,s);
  // floats
  const tn=performance.now();
  ctx.font='800 13px "M PLUS Rounded 1c", system-ui, sans-serif';ctx.textAlign='center';ctx.lineJoin='round';
  for(let i=floats.length-1;i>=0;i--){const f=floats[i],a=(tn-f.t0)/1400;if(a>=1){floats.splice(i,1);continue;}
    const p=P(f.x,f.y,f.z+a*34);ctx.save();ctx.translate(p[0],p[1]);ctx.scale(s,s);ctx.globalAlpha=1-a*a;ctx.lineWidth=3.5;ctx.strokeStyle='#ffffff';ctx.strokeText(f.txt,0,0);ctx.fillStyle=f.col;ctx.fillText(f.txt,0,0);ctx.restore();}
}

/* ---------- game actions ---------- */
function floatAt(x,y,z,txt,col){floats.push({bid:-1,x,y,z,txt,col,t0:performance.now()});}
function float(b,txt,col){const d=DEFS[b.type];const same=floats.filter(f=>f.bid===b.id&&performance.now()-f.t0<500).length;floats.push({bid:b.id,x:b.x+d.w/2,y:b.y+d.h/2,z:d.ht+8+same*14,txt,col,t0:performance.now()});}
function spend(y){if(S.yen<y){toast('You need ¥'+num(y-S.yen)+' more.');return false;}S.yen-=y;return true;}
function useE(){if(S.energy<1){toast('Out of energy. You get 1 back every '+ER+'s.');return false;}if(S.energy>=maxE())S.eT=Date.now();S.energy--;return true;}
function gainXp(n){S.xp+=n;while(S.xp>=need(S.lvl)){S.xp-=need(S.lvl);S.lvl++;S.energy=Math.max(S.energy,maxE());const bonus=50*S.lvl;S.yen+=bonus;levelUp(S.lvl,bonus);}}
function initB(b){const d=DEFS[b.type];if(d.cat==='farm'){b.st='empty';b.t=0;}else if(d.cat==='shop'){b.st='idle';b.t=0;}else if(d.cat==='home'){b.st='run';b.t=Date.now();}}
function place(t,tx,ty){
  const d=DEFS[t];
  if(blocked(d))return;
  const a=anchor(t,tx,ty);
  if(!canPlace(t,a.x,a.y)){toast(inMap(tx,ty)&&!unlocked(tx,ty)?'That land is still forest. Expand to use it.':'That spot is taken.');return;}
  S.yen-=d.cost;if(d.candy)E().candy-=d.candy;
  const b={id:S.nid++,type:t,x:a.x,y:a.y};initB(b);S.b.push(b);S.c.built[t]=(S.c.built[t]||0)+1;
  rebuild();float(b,d.candy?'-'+d.candy+' candy':(d.cost?'-¥'+num(d.cost):'Placed!'),d.candy?'#7a4fb0':'#d6432b');gainXp(Math.max(1,Math.round((d.cost+(d.candy||0)*5)/50)));save();
  if(d.gold){setMode(null);toast('The Golden Pumpkin is yours!');}
  else if(d.staff&&!nearRoad(b))toast('Tip: shops only open when they touch a road.');
  else if(d.cat==='home'&&!nearRoad(b))toast('Tip: homes pay rent only when they touch a road.');
}
let lastPaint=null,paintWarned=false;
function paintAt(sx,sy){const w=s2w(sx,sy),t=w2t(w[0],w[1]),k=t[0]+','+t[1];if(k===lastPaint)return;lastPaint=k;
  const [x,y]=t;if(!inMap(x,y)||!unlocked(x,y)||isRoad(x,y)||occ[y*MAP+x])return;
  if(S.yen<5){if(!paintWarned){toast('You need ¥5 for each road tile.');paintWarned=true;}return;}
  S.yen-=5;S.roads[y*MAP+x]=1;rebuild();save();}
function interact(b){
  const d=DEFS[b.type],n=Date.now();
  if(d.cat==='farm'){
    if(b.st==='empty'){if(S.energy<1){useE();return;}if(!spend(d.plant))return;useE();b.st='grow';b.t=n;float(b,'-¥'+d.plant,'#d6432b');save();return;}
    if(prog(b,n)>=1){if(!useE())return;b.st='empty';if(d.candyYield&&eventOn()){addCandy(d.yield);float(b,'+'+d.yield+' candy','#7a4fb0');}else{S.goods+=d.yield;float(b,'+'+d.yield+' goods','#4f7f2e');}S.c.harvest++;gainXp(d.xp);save();return;}
    return showSheet(b);
  }
  if(d.cat==='shop'){
    if(!nearRoad(b)){toast(d.n+' needs to touch a road.');return;}
    if(b.st==='idle'){if(S.goods<d.supply){toast('Needs '+d.supply+' goods. You have '+S.goods+'. Harvest your farms.');return;}S.goods-=d.supply;b.st='open';b.t=n;S.c.supply++;float(b,'-'+d.supply+' goods','#8a6a2f');save();return;}

const HS=19,hitC=document.createElement('canvas');hitC.width=hitC.height=HS;const hitX=hitC.getContext('2d',{willReadFrequently:true});

function actionable(b){const d=DEFS[b.type],n=Date.now();

/* move / remove / visiting: a flat item's own tile wins, then what you actually touched */
function pick(w){const h=hits(w);
  const f=h.find(x=>x.foot&&DEFS[x.b.type].ht<=18);if(f)return f.b;const o=h.find(x=>x.op);if(o)return o.b;return h[0]?h[0].b:null;}

});

 ['Expand your land','Tap Expand at the bottom of the screen.',()=>S.c.expand,1,{yen:250,xp:30}],
 ['Grow a Tea Field','Tea gives more goods per harvest.',()=>ev('tea'),1,{yen:150,xp:20}],
 ['Dig a Koi Pond','A big boost to appeal.',()=>ev('pond'),1,{yen:250,xp:30}],
 ['Welcome 150 tourists','Mix decor with busy shops.',()=>D.tourists,150,{yen:400,xp:40}],
 ['Open a Sushi Bar','Fresh fish for hungry visitors.',()=>ev('sushi'),1,{yen:400,xp:40}],
 ['Open a Tea House','A quiet spot under a red parasol.',()=>ev('teahouse'),1,{yen:500,xp:50}],
 ['Reach level 6','Bigger buildings are waiting.',()=>S.lvl,6,{yen:600,goods:60}],
 ['Build a Shrine','Every town needs its guardian.',()=>ev('shrine'),1,{yen:800,xp:80}],
 ['Open a Ryokan Inn','Guests love a traditional inn.',()=>ev('ryokan'),1,{yen:900,xp:90}],
 ['Raise the Pagoda','You will see it from across the valley.',()=>ev('pagoda'),1,{yen:1500,xp:120}],

 ['Open an Onsen Bath','Hot springs make everyone stay longer.',()=>ev('onsen'),1,{yen:3000,xp:200}],
 ['Build the Castle Keep','The crown of Komorebi Town.',()=>ev('castle'),1,{yen:8000,xp:400}],

 ['Build a Taiko Drum Stage','Let the drums call the crowds.',()=>ev('taiko'),1,{yen:1200,xp:100}],
 ['Reach level 10','Your town is becoming famous.',()=>S.lvl,10,{yen:2500,goods:150}],

const LOCKQ={9:'torii',25:'takoyaki',26:'daruma',27:'izakaya',28:'persimmon',29:'taiko',31:'dojo',32:'samurai',35:'strawberry',36:'garden',37:'kabuki',38:'villa',40:'buddha',10:'ramen',13:'tea',14:'pond',16:'sushi',17:'teahouse',19:'shrine',20:'ryokan',21:'pagoda',23:'onsen',24:'castle'};
function rewardTxt(r){const a=[];if(r.yen)a.push('¥'+num(r.yen));if(r.goods)a.push(r.goods+' goods');if(r.xp)a.push(r.xp+' XP');return 'Reward: '+a.join(' · ');}
function updQuest(){const q=QUESTS[S.q];
  if(!q){$('#qTitle').textContent='Komorebi Town is complete!';$('#qHint').textContent='Keep building. Every tourist is a happy one.';$('#qFill').style.width='100%';$('#qNum').textContent='';$('#qReward').textContent='';$('#qClaim').hidden=true;return;}
  const have=Math.min(q[2](),q[3]);
  let hint=q[1];const lk=LOCKQ[S.q];if(lk&&S.lvl<DEFS[lk].lvl)hint='Unlocks at level '+DEFS[lk].lvl+'. '+hint;
  $('#qTitle').textContent=q[0];$('#qHint').textContent=hint;$('#qFill').style.width=(have/q[3]*100)+'%';$('#qNum').textContent=num(have)+' / '+num(q[3]);$('#qReward').textContent=rewardTxt(q[4]);$('#qClaim').hidden=have<q[3];}
$('#qClaim').onclick=()=>{const q=QUESTS[S.q];if(!q||q[2]()<q[3])return;const r=q[4];if(r.yen)S.yen+=r.yen;if(r.goods)S.goods+=r.goods;S.q++;if(r.xp)gainXp(r.xp);save();toast(rewardTxt(r).replace('Reward','Claimed'));updQuest();};
$('#qToggle').onclick=()=>{const q=$('#quest');q.classList.toggle('min');$('#qToggle').textContent=q.classList.contains('min')?'+':'–';};

/* ---------- HUD ---------- */
function updHUD(){const n=Date.now();
  $('#lvlNum').textContent=S.lvl;$('#xpFill').style.width=(S.xp/need(S.lvl)*100)+'%';$('#xpTxt').textContent=num(S.xp)+' / '+num(need(S.lvl))+' XP';
  $('#yen').textContent='¥'+num(S.yen);$('#en').textContent=S.energy+'/'+maxE();
  $('#enT').textContent=S.energy<maxE()?'+1 in '+fmt(ER-(n-S.eT)/1000):'';
  $('#goods').textContent=num(S.goods);$('#tour').textContent=num(D.tourists);$('#staff').textContent=D.staff+'/'+D.res;}
function tickEnergy(n){const me=maxE();if(S.energy>=me){S.eT=n;return;}const k=Math.floor((n-S.eT)/(ER*1000));if(k>0){S.energy=Math.min(me,S.energy+k);S.eT+=k*ER*1000;if(S.energy>=me)S.eT=n;}}
setInterval(()=>{tickEnergy(Date.now());recompute();updHUD();updQuest();updSheet();updEvent();if(!$('#drawer').hidden){document.querySelectorAll('.card').forEach(c=>{const d=DEFS[c.dataset.t];c.classList.toggle('poor',S.lvl>=d.lvl&&(S.yen<d.cost||!!(d.candy&&E().candy<d.candy)));});}},250);

/* ---------- boot ---------- */
resize();rebuild();fitCam();tickEnergy(Date.now());updHUD();updQuest();updEvent();
let last=performance.now();
function frame(t){const dt=Math.min(.1,(t-last)/1000);last=t;updWalkers(dt);updGhosts(dt,Date.now());draw(Date.now());requestAnimationFrame(frame);}
requestAnimationFrame(frame);
if(fresh)modal('<div class="big">'+TANUKI+'</div><h2>Welcome to Komorebi Town</h2><p>I\'m Mayor Kobu. Our sleepy valley wants to become the best holiday spot in Japan. Grow rice, open shops, plant sakura and bring the tourists in!</p><p>Follow my requests in the corner and I\'ll reward you.</p>',[{label:'Let\'s build',cls:'primary'}]);
if(eventOn()&&!E().seen){E().seen=true;save();modal('<div class="big">'+PUMPKIN+'</div><h2>The Halloween Festival is here!</h2><p>For two weeks only, until 11 November. Catch floating ghosts and grow pumpkins to collect candy, then spend it on limited items like the Haunted House and Lantern Ghost.</p>',[{label:'Later'},{label:'See the festival',cls:'primary',fn:()=>openEvent()}]);}
})();
</script>
